<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>La tua scheda · PT Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#f4f6fb;--card:#ffffff;--ink:#0f172a;--muted:#64748b;--dim:#94a3b8;
    --line:#e8edf5;--blue:#2563eb;--blue-soft:#eff4ff;--green:#059669;--green-soft:#ecfdf5;--amber:#f59e0b;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding:0 0 90px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  input,button{font-family:inherit}
  .topbar{background:var(--ink);color:#fff;padding:18px 0 20px;position:sticky;top:0;z-index:30;box-shadow:0 2px 16px rgba(15,23,42,.18)}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:900;font-size:19px;letter-spacing:-.5px;display:flex;align-items:center;gap:7px}
  .logo .pt{color:#60a5fa}
  .logo-badge{width:26px;height:26px;border-radius:7px;background:var(--blue);display:grid;place-items:center;font-size:13px}
  .topbar .lang{font-size:12px;color:#94a3b8;font-weight:500}
  .hero{background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff;border-radius:0 0 22px 22px;padding:6px 0 26px;margin-bottom:-14px}
  .hero .wrap{padding-top:6px}
  .hero h1{font-size:23px;font-weight:900;letter-spacing:-.4px;margin-bottom:3px}
  .hero .sub{font-size:13px;color:#cbd5e1;font-weight:500}
  .hero .pt-by{margin-top:16px;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:7px 13px;border-radius:100px;font-size:12.5px;color:#e2e8f0;font-weight:500}
  .hero .pt-by .dot{width:7px;height:7px;border-radius:50%;background:#34d399}
  .day-tabs{display:flex;gap:8px;margin:24px 0 6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .day-tabs::-webkit-scrollbar{display:none}
  .day-tab{flex-shrink:0;padding:9px 16px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s}
  .day-tab.active{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 4px 12px rgba(37,99,235,.3)}
  .datebar{display:flex;align-items:center;gap:10px;margin:14px 0 16px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 14px;box-shadow:var(--shadow)}
  .datebar label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .datebar input{flex:1;border:none;background:transparent;font-size:14px;font-weight:700;color:var(--ink);outline:none}
  .ex{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:11px;box-shadow:var(--shadow)}
  .ex.done{border-color:#a7f3d0;background:linear-gradient(180deg,var(--green-soft),#fff 40%)}
  .ex-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
  .ex-name{font-size:15px;font-weight:700;letter-spacing:-.2px;line-height:1.3}
  .ex-muscles{font-size:11.5px;color:var(--dim);font-weight:500;margin-top:1px}
  .ex-check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex-shrink:0;cursor:pointer;display:grid;place-items:center;font-size:14px;color:transparent;transition:all .15s;background:#fff}
  .ex-check.on{background:var(--green);border-color:var(--green);color:#fff}
  .prescribed{display:flex;gap:6px;margin-bottom:12px;font-size:11.5px;flex-wrap:wrap}
  .pres-chip{background:#f1f5f9;border-radius:7px;padding:4px 9px;color:var(--muted);font-weight:600}
  .pres-chip b{color:var(--ink);font-weight:800}
  .sets-head,.set-row{display:grid;grid-template-columns:34px 1fr 1fr 1fr;gap:7px;align-items:center}
  .sets-head{margin-bottom:6px}
  .sets-head div{font-size:9.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.4px;text-align:center}
  .sets-head div:first-child{text-align:left;padding-left:4px}
  .set-row{margin-bottom:7px}
  .set-n{font-size:13px;font-weight:800;color:var(--blue);padding-left:6px}
  .set-row input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;font-size:15px;font-weight:700;color:var(--ink);outline:none;background:#fbfcfe;transition:border-color .15s,background .15s}
  .set-row input:focus{border-color:var(--blue);background:#fff}
  .set-row input::placeholder{color:#cbd5e1;font-weight:600}
  .timed-sets{display:flex;flex-direction:column;gap:7px}
  .timed-row{display:flex;align-items:center;gap:10px;background:#fbfcfe;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px}
  .timed-row.set-done{background:var(--green-soft);border-color:#a7f3d0}
  .timed-row .tn{font-size:13px;font-weight:800;color:var(--blue);width:38px}
  .timed-row .tval{flex:1;font-size:15px;font-weight:800;color:var(--ink)}
  .timed-row .tval span{font-size:12px;color:var(--muted);font-weight:700}
  .btn-play{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 3px 10px rgba(37,99,235,.3)}
  .btn-play.replay{background:var(--card);color:var(--blue);border:1.5px solid var(--blue-soft);box-shadow:none}
  .ex-note{margin-top:11px;font-size:12px;color:var(--muted);font-weight:500;background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:8px 11px;display:flex;gap:7px;align-items:flex-start}
  .ex-note .i{flex-shrink:0}
  .savebar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 0;z-index:40;box-shadow:0 -4px 24px rgba(15,23,42,.08)}
  .savebar .wrap{display:flex;align-items:center;gap:12px}
  .savebar .progress{flex:1;font-size:13px;font-weight:700;color:var(--muted)}
  .savebar .progress b{color:var(--ink)}
  .btn-save{background:var(--blue);color:#fff;border:none;border-radius:13px;padding:13px 24px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 16px rgba(37,99,235,.35);transition:transform .12s}
  .btn-save:active{transform:scale(.96)}
  .btn-save:disabled{opacity:.5}
  .btn-save.saved{background:var(--green);box-shadow:0 4px 16px rgba(5,150,105,.35)}
  .foot{text-align:center;margin-top:30px;padding:0 20px}
  .foot .made{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600;background:var(--card);border:1px solid var(--line);padding:9px 16px;border-radius:100px;box-shadow:var(--shadow)}
  .foot .made .pt{color:var(--blue);font-weight:900}
  .foot .disc{font-size:11px;color:var(--dim);margin-top:14px;line-height:1.5;font-weight:500}
  .loading{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px;font-weight:500}
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;font-weight:700;z-index:60;opacity:0;transition:all .3s;box-shadow:0 8px 32px rgba(15,23,42,.3);pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{background:var(--green)}.toast.err{background:#dc2626}
  .timer-overlay{position:fixed;inset:0;background:linear-gradient(160deg,#1e293b,#0f172a);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:30px}
  .timer-overlay.show{display:flex;animation:fadeIn .25s}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .timer-overlay.rest{background:linear-gradient(160deg,#78350f,#451a03)}
  .t-label{font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#cbd5e1;margin-bottom:6px}
  .t-exname{font-size:20px;font-weight:900;margin-bottom:34px;text-align:center}
  .t-ring{position:relative;width:260px;height:260px}
  .t-ring svg{transform:rotate(-90deg)}
  .t-ring .track{fill:none;stroke:rgba(255,255,255,.12);stroke-width:14}
  .t-ring .prog{fill:none;stroke:#fff;stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .95s linear}
  .timer-overlay.rest .t-ring .prog{stroke:var(--amber)}
  .t-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .t-num .big{font-size:74px;font-weight:900;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
  .t-num .unit{font-size:14px;color:#94a3b8;font-weight:700;margin-top:4px}
  .t-actions{display:flex;gap:14px;margin-top:42px}
  .t-btn{border:none;border-radius:14px;padding:15px 28px;font-size:15px;font-weight:800;cursor:pointer}
  .t-btn.stop{background:rgba(255,255,255,.14);color:#fff}
  .t-btn.skip{background:#fff;color:var(--ink)}
  .ex{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
  <div class="topbar">
    <div class="wrap">
      <div class="logo"><span class="logo-badge">📋</span><span><span class="pt">PT</span>Board</span></div>
      <span class="lang">🇮🇹 IT</span>
    </div>
  </div>
  <div class="hero">
    <div class="wrap">
      <h1 id="cliente">…</h1>
      <div class="sub" id="programma">Caricamento scheda…</div>
      <div class="pt-by"><span class="dot"></span><span>Preparato da <b id="pt-nome">…</b></span></div>
    </div>
  </div>
  <div class="wrap">
    <div class="day-tabs" id="dayTabs"></div>
    <div class="datebar" id="datebar" style="display:none"><label>Data seduta</label><input type="date" id="dataSeduta"></div>
    <div id="esercizi"><div class="loading">Caricamento scheda…</div></div>
    <div class="foot">
      <div class="made">Creato con <span class="pt">PT&nbsp;Board</span></div>
      <div class="disc">Inserisci reps e carico, oppure usa il cronometro per gli esercizi a tempo.</div>
    </div>
  </div>
  <div class="savebar" id="savebar" style="display:none"><div class="wrap">
    <div class="progress" id="progress">0 / 0 completati</div>
    <button class="btn-save" id="btnSave" onclick="salva()">Salva seduta</button>
  </div></div>
  <div class="toast" id="toast"></div>

  <div class="timer-overlay" id="timerOv">
    <div class="t-label" id="tLabel">Esercizio</div>
    <div class="t-exname" id="tExname">—</div>
    <div class="t-ring">
      <svg width="260" height="260" viewBox="0 0 260 260">
        <circle class="track" cx="130" cy="130" r="116"></circle>
        <circle class="prog" id="tProg" cx="130" cy="130" r="116"></circle>
      </svg>
      <div class="t-num"><div class="big" id="tBig">0</div><div class="unit">secondi</div></div>
    </div>
    <div class="t-actions">
      <button class="t-btn stop" onclick="stopTimer()">Annulla</button>
      <button class="t-btn skip" id="tSkip" onclick="skipTimer()">Salta</button>
    </div>
  </div>

<script>
  /* ── FIREBASE (no auth, no persistence) ── */
  firebase.initializeApp({
    apiKey:"AIzaSyC2cyMakGET5yBCCVgrnn6H_3Skn7g39hc",
    authDomain:"ptboard-1.firebaseapp.com",
    projectId:"ptboard-1",
    storageBucket:"ptboard-1.firebasestorage.app",
    messagingSenderId:"223801010947",
    appId:"1:223801010947:web:9c3f887243609bcdad9736"
  });
  var fbDb = firebase.firestore();

  var SHARE_ID = null;
  var SCHEDA = null;          // { cliente, ptNome, programma, giorni:[{nome,esercizi:[...]}] }
  var stato = null;           // stato compilazione (localStorage)
  var giornoAttivo = 0;

  function getShareId(){
    var p = new URLSearchParams(location.search);
    if(p.get('id')) return p.get('id');
    var m = location.pathname.match(/\/s\/([^\/?#]+)/);
    if(m) return m[1];
    var stored = sessionStorage.getItem('shareId');
    if(stored){ sessionStorage.removeItem('shareId'); return stored; }
    return null;
  }
  function mostraErrore(msg){
    document.body.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:DM Sans,sans-serif;padding:40px;text-align:center;color:#0f172a">'+
      '<div style="font-size:40px;margin-bottom:12px">📋</div><div style="font-size:18px;font-weight:800;margin-bottom:8px">PT Board</div>'+
      '<div style="font-size:14px;color:#64748b;max-width:300px">'+msg+'</div></div>';
  }
  var _tt;
  function showToast(msg,type){ var el=document.getElementById('toast'); if(!el)return; el.textContent=msg; el.className='toast show'+(type==='ok'?' ok':type==='err'?' err':''); clearTimeout(_tt); _tt=setTimeout(function(){el.className='toast'+(type==='ok'?' ok':type==='err'?' err':'');},2600); }

  function isTimed(reps){ return /s|sec|:/i.test(String(reps)); }
  function secFromReps(reps){ var s=String(reps); var mm=s.match(/(\d+):(\d+)/); if(mm) return (+mm[1])*60+(+mm[2]); var m=s.match(/(\d+)/); return m?+m[1]:30; }
  function numCarico(c){ var m=String(c||'').match(/^([\d.,]+)/); return m?m[1]:'kg'; }
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);});}

  /* ── stato compilazione locale ── */
  function storageKey(){ return 'ptb_fill_'+SHARE_ID; }
  function initStato(){
    var saved=null;
    try{ saved=JSON.parse(localStorage.getItem(storageKey())); }catch(e){}
    if(saved && saved.giorni) return saved;
    var st={ dataSeduta:new Date().toISOString().slice(0,10), giorni:{} };
    SCHEDA.giorni.forEach(function(g,gi){
      st.giorni[gi]={esercizi:{}};
      g.esercizi.forEach(function(e,ei){
        if(isTimed(e.reps)) st.giorni[gi].esercizi[ei]={done:false,timed:true,sets:Array.from({length:e.serie||1},function(){return{sec:'',fatto:false};})};
        else st.giorni[gi].esercizi[ei]={done:false,timed:false,sets:Array.from({length:e.serie||1},function(){return{reps:'',kg:'',rpe:''};})};
      });
    });
    return st;
  }
  function salvaStato(){ try{ localStorage.setItem(storageKey(),JSON.stringify(stato)); }catch(e){} }

  function render(){
    document.getElementById('cliente').textContent=SCHEDA.cliente||'';
    document.getElementById('pt-nome').textContent=SCHEDA.ptNome||'';
    document.getElementById('programma').textContent=SCHEDA.programma||'';
    document.getElementById('datebar').style.display='flex';
    document.getElementById('savebar').style.display='block';
    document.getElementById('dataSeduta').value=stato.dataSeduta;

    document.getElementById('dayTabs').innerHTML=SCHEDA.giorni.map(function(g,gi){
      return '<div class="day-tab '+(gi===giornoAttivo?'active':'')+'" onclick="cambiaGiorno('+gi+')">'+esc(g.nome)+'</div>';
    }).join('');

    var g=SCHEDA.giorni[giornoAttivo];
    document.getElementById('esercizi').innerHTML=g.esercizi.map(function(e,ei){
      var st=stato.giorni[giornoAttivo].esercizi[ei];
      var body;
      if(st.timed){
        body='<div class="timed-sets">'+st.sets.map(function(s,si){
          return '<div class="timed-row '+(s.fatto?'set-done':'')+'">'+
            '<span class="tn">Set '+(si+1)+'</span>'+
            '<span class="tval">'+(s.sec?esc(s.sec)+'<span> s</span>':'<span style="color:#cbd5e1">— s</span>')+'</span>'+
            '<button class="btn-play '+(s.fatto?'replay':'')+'" onclick="startTimer('+ei+','+si+')">'+(s.fatto?'↻ Rifai':'▶ '+secFromReps(e.reps)+'s')+'</button>'+
          '</div>';
        }).join('')+'</div>';
      } else {
        var rows=st.sets.map(function(s,si){
          return '<div class="set-row">'+
            '<div class="set-n">'+(si+1)+'</div>'+
            '<input inputmode="numeric" placeholder="'+esc(String(e.reps))+'" value="'+esc(s.reps)+'" oninput="upd('+ei+','+si+',\'reps\',this.value)">'+
            '<input inputmode="decimal" placeholder="'+esc(numCarico(e.carico))+'" value="'+esc(s.kg)+'" oninput="upd('+ei+','+si+',\'kg\',this.value)">'+
            '<input inputmode="numeric" placeholder="—" value="'+esc(s.rpe||'')+'" oninput="upd('+ei+','+si+',\'rpe\',this.value)">'+
          '</div>';
        }).join('');
        body='<div class="sets-head"><div>Set</div><div>Reps</div><div>Kg</div><div>RPE</div></div>'+rows;
      }
      return '<div class="ex '+(st.done?'done':'')+'">'+
        '<div class="ex-top"><div><div class="ex-name">'+esc(e.nome)+'</div><div class="ex-muscles">'+esc(e.muscoli||'')+'</div></div>'+
        '<div class="ex-check '+(st.done?'on':'')+'" onclick="toggleDone('+ei+')">✓</div></div>'+
        '<div class="prescribed">'+
          '<span class="pres-chip">Prescritto: <b>'+esc(String(e.serie||''))+'×'+esc(String(e.reps||''))+'</b></span>'+
          (e.carico?'<span class="pres-chip">Carico: <b>'+esc(String(e.carico))+'</b></span>':'')+
          (e.rec?'<span class="pres-chip">Rec: <b>'+esc(String(e.rec))+'</b></span>':'')+
        '</div>'+body+
        (e.nota?'<div class="ex-note"><span class="i">💡</span><span>'+esc(e.nota)+'</span></div>':'')+
      '</div>';
    }).join('');
    aggiornaProgress();
  }

  /* IMPORTANTE: upd NON richiama render() — altrimenti l'input perde il focus
     mentre scrivi e sembra che il campo "non accetti" i numeri. */
  function upd(ei,si,c,v){ stato.giorni[giornoAttivo].esercizi[ei].sets[si][c]=v; salvaStato(); }
  function toggleDone(ei){ var st=stato.giorni[giornoAttivo].esercizi[ei]; st.done=!st.done; salvaStato(); render(); }
  function cambiaGiorno(gi){ giornoAttivo=gi; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  function aggiornaProgress(){ var ex=stato.giorni[giornoAttivo].esercizi; var tot=Object.keys(ex).length,done=Object.values(ex).filter(function(x){return x.done;}).length; document.getElementById('progress').innerHTML='<b>'+done+'</b> / '+tot+' completati'; }
  document.addEventListener('change',function(e){ if(e.target&&e.target.id==='dataSeduta'){ stato.dataSeduta=e.target.value; salvaStato(); } });

  /* ── TIMER ── */
  var timerInt=null, timerCtx={};
  var R=116, CIRC=2*Math.PI*R;
  function startTimer(ei,si){ var e=SCHEDA.giorni[giornoAttivo].esercizi[ei]; var dur=secFromReps(e.reps); timerCtx={ei:ei,si:si,phase:'work',ex:e}; openTimer(e.nome,'Esercizio',dur,false); }
  function openTimer(name,label,dur,isRest){
    var ov=document.getElementById('timerOv'); ov.classList.toggle('rest',isRest); ov.classList.add('show');
    document.getElementById('tProg').style.strokeDasharray=CIRC;
    document.getElementById('tExname').textContent=name;
    document.getElementById('tLabel').textContent=label;
    document.getElementById('tSkip').textContent=isRest?'Salta riposo':'Salta';
    document.querySelector('.t-num .unit').textContent=isRest?'riposo':'secondi';
    var left=dur, big=document.getElementById('tBig'), prog=document.getElementById('tProg');
    big.textContent=left; prog.style.strokeDashoffset=0;
    clearInterval(timerInt);
    timerInt=setInterval(function(){ left--; big.textContent=Math.max(left,0); prog.style.strokeDashoffset=CIRC*(1-left/dur); if(left<=0){ clearInterval(timerInt); finePhase(); } },1000);
  }
  function finePhase(){
    beep();
    if(timerCtx.phase==='work'){
      var ei=timerCtx.ei,si=timerCtx.si,ex=timerCtx.ex;
      var s=stato.giorni[giornoAttivo].esercizi[ei].sets[si]; s.sec=secFromReps(ex.reps); s.fatto=true; salvaStato();
      var rec=secFromReps(ex.rec); if(rec>0){ timerCtx.phase='rest'; openTimer('Recupero','Riposo',rec,true); } else { stopTimer(); }
    } else { stopTimer(); }
  }
  function skipTimer(){ if(timerCtx.phase==='work'){ clearInterval(timerInt); finePhase(); } else { stopTimer(); } }
  function stopTimer(){ clearInterval(timerInt); document.getElementById('timerOv').classList.remove('show'); render(); }
  function beep(){ try{ var ctx=new (window.AudioContext||window.webkitAudioContext)(); var o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=880; o.type='sine'; g.gain.setValueAtTime(.3,ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.4); o.start(); o.stop(ctx.currentTime+.4); if(navigator.vibrate) navigator.vibrate(200); }catch(e){} }

  /* ── SALVATAGGIO ── (solo log + updatedAt, come da regola Firestore) */
  async function salva(){
    var btn=document.getElementById('btnSave'); btn.disabled=true;
    var g=SCHEDA.giorni[giornoAttivo];
    var es=stato.giorni[giornoAttivo].esercizi;
    var esercizi=g.esercizi.map(function(e,ei){
      var st=es[ei];
      return { nome:e.nome, timed:!!st.timed, done:!!st.done,
        sets: st.sets.map(function(s){ return st.timed?{sec:s.sec||'',fatto:!!s.fatto}:{reps:s.reps||'',kg:s.kg||'',rpe:s.rpe||''}; }) };
    });
    var entry={ data:stato.dataSeduta, giorno:g.nome, esercizi:esercizi, ts:Date.now() };
    try{
      await fbDb.collection('sharedClients').doc(SHARE_ID).update({
        log: firebase.firestore.FieldValue.arrayUnion(entry),
        updatedAt: Date.now()
      });
      btn.textContent='✓ Salvato'; btn.classList.add('saved');
      showToast('Seduta salvata','ok');
      setTimeout(function(){ btn.textContent='Salva seduta'; btn.classList.remove('saved'); btn.disabled=false; },2000);
    }catch(e){
      btn.disabled=false;
      showToast('Errore salvataggio, riprova','err');
    }
  }

  /* ── ADAPTER Firestore → SCHEDA ── */
  function adatta(data){
    var sa=data.schedaAttuale||{};
    return { cliente:data.cliente||'', ptNome:data.ptNome||'', programma:sa.programma||'', giorni:(sa.giorni||[]).map(function(g){
      return { nome:g.nome||'Allenamento', esercizi:(g.esercizi||[]).map(function(e){
        return { nome:e.nome||'Esercizio', muscoli:e.muscoli||'', serie:e.serie||1, reps:e.reps!=null?e.reps:'', carico:e.carico||'', rec:e.rec||'', nota:e.nota||'' };
      }) };
    }) };
  }

  async function init(){
    SHARE_ID=getShareId();
    if(!SHARE_ID){ mostraErrore('Link non valido.'); return; }
    try{
      var doc=await fbDb.collection('sharedClients').doc(SHARE_ID).get();
      if(!doc.exists){ mostraErrore('Scheda non trovata. Controlla il link.'); return; }
      var data=doc.data();
      if(data.attivo===false){ mostraErrore('Questo link non è più attivo. Contatta il tuo personal trainer.'); return; }
      SCHEDA=adatta(data);
      if(!SCHEDA.giorni.length){ mostraErrore('La scheda non contiene esercizi.'); return; }
      stato=initStato();
      render();
    }catch(e){ mostraErrore('Errore di connessione. Riprova.'); }
  }
  init();
</script>
</body>
