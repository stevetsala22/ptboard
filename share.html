<style>
  :root{--accent:#185FA5}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fafafa;color:#042C53;min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{display:flex;align-items:flex-start;justify-content:center;padding:24px}
  .card{max-width:480px;width:100%;background:#fff;border-radius:18px;box-shadow:0 4px 24px rgba(4,44,83,0.08);overflow:hidden;margin-top:24px;margin-bottom:80px}

  /* Header */
  .head{padding:20px 24px 0;display:flex;align-items:center;gap:8px}
  .logo{width:30px;height:30px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:14px;letter-spacing:-0.3px}
  .brand{font-size:14px;font-weight:500;color:#042C53;flex:1}

  /* Title block */
  .head-info{padding:18px 24px 18px;border-bottom:1px solid #f0f0ec}
  .step-label{font-size:11px;color:#94a3b8;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:6px}
  .cliente-name{font-size:22px;font-weight:600;line-height:1.2;letter-spacing:-0.4px;color:#042C53;margin-bottom:4px}
  .pt-info{font-size:13px;color:#5F5E5A}

  /* Date + day select bar */
  .top-controls{padding:14px 24px;background:#fafafa;border-bottom:1px solid #f0f0ec;display:flex;flex-direction:column;gap:10px}
  .ctrl-row{display:flex;align-items:center;gap:10px;font-size:13px}
  .ctrl-label{font-weight:600;color:#5F5E5A;flex-shrink:0;min-width:84px}
  .ctrl-input,.ctrl-select{flex:1;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:#042C53;-webkit-appearance:none}
  .ctrl-input:focus,.ctrl-select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(24,95,165,0.15)}
  .ctrl-select{cursor:pointer;font-weight:600}

  /* Body */
  .body{padding:20px 24px}
  .parti{padding:0 24px}.parti:empty{display:none}
  #partePrima{padding-top:18px}#parteDopo{padding-bottom:6px}
  #partePrima:not(:empty)+.body{padding-top:4px}
  .rp-box{border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:13px;color:#444441;line-height:1.5;background:#f0fdfa;border-left:4px solid #0f766e}
  .rp-box.prog{background:#f5f3ff;border-left-color:#7c3aed}
  .rp-tit{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#0f766e;margin-bottom:3px}
  .rp-box.prog .rp-tit{color:#6d28d9}
  .parte-lbl{font-size:10.5px;font-weight:800;color:#888780;letter-spacing:.08em;text-transform:uppercase;margin:6px 0 6px}
  .parte-box{background:#fff;border:1px solid #f0f0ec;border-left:4px solid #d97706;border-radius:12px;padding:10px 14px;font-size:13px;color:#444441;line-height:1.5;margin-bottom:6px}
  .parte-box.defat{border-left-color:#0284c7}
  .blk-nota{font-size:12px;color:#042C53;font-style:italic;margin-top:4px}
  .day-chips{flex:1;display:flex;gap:6px;flex-wrap:wrap}
  .day-chip{padding:7px 12px;border-radius:10px;border:1px solid #d3d1c7;background:#fff;color:#5F5E5A;font:700 12px inherit;font-family:inherit;cursor:pointer}
  .day-chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .blk-timer{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;margin-top:10px}
  .bt-lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#5F5E5A}
  .bt-val{font-size:28px;font-weight:800;color:#042C53;font-variant-numeric:tabular-nums;line-height:1.15}
  .bt-sub{font-size:11.5px;color:#5F5E5A}
  .bt-btns{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  .bt-go{border:none;border-radius:10px;background:var(--accent);color:#fff;font:700 13px inherit;font-family:inherit;padding:10px 14px;cursor:pointer;min-width:92px}
  .bt-go:disabled{opacity:.5}
  .bt-reset{border:1px solid #d3d1c7;border-radius:10px;background:#fff;color:#5F5E5A;font:600 12px inherit;font-family:inherit;padding:6px 10px;cursor:pointer}
  .blk-emom .bt-go{background:#6366f1}.blk-emom .bt-lbl{color:#4338ca}
  .blk-amrap .bt-go{background:#0891b2}.blk-amrap .bt-lbl{color:#0e7490}
  .blk-hyrox .bt-go{background:#0f766e}.blk-hyrox .bt-lbl{color:#0f766e}

  /* Exercise card */
  .ex-block{background:#fafafa;border:1px solid #f0f0ec;border-radius:12px;padding:14px;margin-bottom:12px}
  .ex-block.in-blk{border-left:5px solid #8b5cf6;background:#faf8ff}
  .ex-block.in-blk.blk-sup{border-left-color:#f97316;background:#fffaf5}
  .blk-banner{background:#fff;border:1px solid #8b5cf6;border-left-width:4px;border-radius:8px;padding:8px 10px;margin-bottom:10px}
  .blk-sup .blk-banner{border-color:#f97316}
  .blk-title{font-size:12px;font-weight:800;color:#6d28d9;text-transform:uppercase;letter-spacing:.4px}
  .blk-sup .blk-title{color:#c2410c}
  .ex-num{display:inline-block;min-width:22px;padding:1px 5px;margin-right:6px;border-radius:6px;background:#e6edf5;color:#042C53;font-size:12px;font-weight:800;text-align:center}
  .in-blk .ex-num{background:#8b5cf6;color:#fff}
  .in-blk.blk-sup .ex-num{background:#f97316}
  .ex-block.in-blk.blk-emom{border-left-color:#6366f1;background:#f7f7ff}.blk-emom .blk-banner{border-color:#6366f1}.blk-emom .blk-title{color:#4338ca}.in-blk.blk-emom .ex-num{background:#6366f1}
  .ex-block.in-blk.blk-amrap{border-left-color:#0891b2;background:#f3fbfd}.blk-amrap .blk-banner{border-color:#0891b2}.blk-amrap .blk-title{color:#0e7490}.in-blk.blk-amrap .ex-num{background:#0891b2}
  .ex-block.in-blk.blk-hyrox{border-left-color:#0f766e;background:#f2faf8}.blk-hyrox .blk-banner{border-color:#0f766e}.blk-hyrox .blk-title{color:#0f766e}.in-blk.blk-hyrox .ex-num{background:#0f766e}
  .ex-block.in-blk.blk-finisher{border-left-color:#e11d48;background:#fff7f8}.blk-finisher .blk-banner{border-color:#e11d48}.blk-finisher .blk-title{color:#be123c}.in-blk.blk-finisher .ex-num{background:#e11d48}
  .ex-block.grp-start{margin-top:26px;position:relative}
  .ex-block.grp-start::before{content:'';position:absolute;left:0;right:0;top:-15px;border-top:2px solid #b4b2a9}
  .blk-sub{font-size:12px;color:#5F5E5A;margin-top:2px}
  .ex-block.done{background:#f0fdf4;border-color:#bbf7d0}
  .ex-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px}
  .ex-header-left{flex:1;min-width:0}
  .ex-name{font-size:15px;font-weight:600;color:#042C53;line-height:1.3}
  .ex-target{font-size:12px;color:var(--accent);font-weight:600;margin-top:2px}
  .ex-muscles{font-size:11px;color:#94a3b8;margin-top:3px}
  .ex-nota{font-size:12px;color:#5F5E5A;background:#fff;border-left:3px solid var(--accent);padding:6px 10px;margin-top:8px;border-radius:0 6px 6px 0;font-style:italic}
  .anim-btn{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:4px 10px;border-radius:12px;border:1px solid var(--accent);background:#fff;color:var(--accent);font:600 12px inherit;font-family:inherit;cursor:pointer}
  .anim-box{margin:4px 0 10px;border-radius:10px;overflow:hidden;background:var(--anim-bg)}
  .anim-cap{font-size:11px;color:#5F5E5A;padding:4px 8px 6px}
  .anim-cap a{color:#5F5E5A}
  .ex-progress{font-size:11px;color:var(--accent);font-weight:600;background:#E6F1FB;padding:3px 8px;border-radius:12px;white-space:nowrap}
  .ex-progress.done{color:#166534;background:#dcfce7}

  /* Set rows (reps mode) */
  .set-row{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid #f0f0ec}
  .set-row:first-of-type{border-top:none}
  .set-num{font-size:11px;font-weight:600;color:#94a3b8;width:22px;flex-shrink:0;letter-spacing:0.5px}
  .set-input{width:54px;padding:7px 4px;border:1px solid #cbd5e1;border-radius:7px;font-size:13.5px;font-family:inherit;text-align:center;color:#042C53;font-weight:600;background:#fff;-webkit-appearance:none;-moz-appearance:textfield}
  .set-input::-webkit-outer-spin-button,.set-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .set-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(24,95,165,0.15)}
  .set-input.done{background:#f0fdf4;border-color:#86efac;color:#166534}
  .set-sep{font-size:12px;color:#cbd5e1;flex-shrink:0}
  .set-rpe{padding:6px 4px;border:1px solid #cbd5e1;border-radius:7px;font-size:12px;background:#fff;font-family:inherit;font-weight:600;color:var(--accent);width:auto;max-width:74px}
  .set-rpe.done{background:#f0fdf4;border-color:#86efac;color:#166534}
  .set-check{margin-left:auto;width:32px;height:32px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:16px;font-family:inherit;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .set-check:disabled{background:#cbd5e1;cursor:not-allowed}
  .set-check.done{background:#16a34a}

  /* Set rows (timed mode) */
  .set-row-timed{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid #f0f0ec}
  .set-row-timed:first-of-type{border-top:none}
  .set-timed-info{flex:1;font-size:13px;color:#042C53;font-weight:500}
  .set-timed-info.done{color:#166534}
  .btn-play{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn-play.replay{background:#16a34a}

  /* Save button area */
  .save-area{position:sticky;bottom:0;background:#fff;padding:14px 24px;border-top:1px solid #f0f0ec;box-shadow:0 -4px 12px rgba(4,44,83,0.04)}
  .btn-save{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:background 0.15s}
  .btn-save:hover{background:#0f4a85}
  .btn-save:active{transform:scale(0.99)}
  .btn-save:disabled{opacity:.6;cursor:not-allowed}
  .btn-save.saved{background:#16a34a}

  /* Footer */
  .footer{padding:14px 24px;text-align:center;background:#fafafa;border-top:1px solid #f0f0ec}
  .footer-text{font-size:11px;color:#94a3b8}
  .footer-text a{color:var(--accent);text-decoration:none}

  /* Rest timer floating */
  .rest-timer{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);background:#042C53;color:#fff;padding:14px 20px;border-radius:14px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 24px rgba(0,0,0,0.2);z-index:100;transition:transform 0.25s;min-width:240px}
  .rest-timer.show{transform:translateX(-50%) translateY(0)}
  .rest-timer-label{font-size:11px;color:#94a3b8;letter-spacing:0.5px;text-transform:uppercase}
  .rest-timer-value{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
  .rest-timer-skip{background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;margin-left:auto}
  .rest-timer-skip:hover{background:rgba(255,255,255,0.25)}

  /* Toast */
  .toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-180%);background:#042C53;color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;font-weight:500;z-index:200;transition:transform 0.25s;box-shadow:0 8px 24px rgba(0,0,0,0.2)}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.ok{background:#16a34a}
  .toast.err{background:#dc2626}

  /* Empty / error states */
  .state-msg{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
  .state-icon{font-size:42px;margin-bottom:14px}
  .state-title{font-size:18px;font-weight:600;color:#042C53;margin-bottom:8px}
  .state-text{font-size:13px;color:#5F5E5A;max-width:280px;line-height:1.55}

  /* Loading */
  .loading{padding:60px 24px;text-align:center;color:#94a3b8}
  .spinner{width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<main class="card" id="card">
  <!-- Loading iniziale -->
  <div class="loading" id="loadingScreen">
    <div class="spinner"></div>
    Caricamento scheda...
  </div>

  <!-- Contenuto principale (nascosto fino a load completo) -->
  <div id="mainContent" style="display:none">
    <header class="head">
      <div class="logo" id="brandLogo">PT</div>
      <div class="brand" id="brandName">PT Board</div>
    </header>

    <section class="head-info">
      <div class="step-label">La tua scheda</div>
      <div class="cliente-name" id="cliente">—</div>
      <div class="pt-info"><span id="programma">—</span> · PT: <span id="pt-nome">—</span></div>
    </section>

    <section class="top-controls">
      <div class="ctrl-row">
        <span class="ctrl-label">📅 Data seduta</span>
        <input type="date" class="ctrl-input" id="dataSeduta">
      </div>
      <div class="ctrl-row" id="daySelectWrap" style="display:none">
        <span class="ctrl-label">📋 Giorno</span>
        <select class="ctrl-select" id="daySelect"></select>
        <div class="day-chips" id="dayChips" hidden></div>
      </div>
    </section>

    <section class="parti" id="partePrima"></section>
    <section class="body" id="exerciseList"></section>
    <section class="parti" id="parteDopo"></section>

    <div class="save-area">
      <button class="btn-save" id="btnSave">Salva seduta</button>
    </div>

    <footer class="footer">
      <div class="footer-text">
        <a href="/">personaltrainerboard.com</a>
      </div>
    </footer>
  </div>
</main>

<!-- Rest timer floating (riusato sia per recupero che per esercizi a tempo) -->
<div class="rest-timer" id="restTimer">
  <div>
    <div class="rest-timer-label" id="restTimerLabel">Recupero</div>
    <div class="rest-timer-value" id="restTimerValue">90s</div>
  </div>
  <button class="rest-timer-skip" id="restTimerSkip" type="button">Salta</button>
</div>

<script>
(function(){
  var SHARE_ID=null;
  var SCHEDA=null; // {cliente, ptNome, programma, giorni:[{nome, esercizi:[{nome,muscoli,serie,reps,carico,rec,nota}]}]}
  var stato=null;
  var giornoAttivo=0;
  var restTimerInterval=null;
  var restTimerEnd=0;
  var restTimerOnEnd=null;

  // ── HELPERS ──
  function $(id){return document.getElementById(id);}
  // Tempi: i dati arrivano come "45s"/"90s"; si mostrano "45s", "1min 30s", "2min" (come nell'app).
  function fmtSec(n){n=Math.round(+n||0);if(n<=0)return '';if(n<60)return n+'s';var m=Math.floor(n/60),r=n%60;return m+'min'+(r?' '+r+'s':'');}
  function fmtT(v){var m=String(v==null?'':v).match(/^\s*(\d+)\s*s\s*$/);return m?fmtSec(+m[1]):String(v==null?'':v);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var TIPI_BLOCCO=['superset','circuito','emom','amrap','hyrox','finisher'];
  function bannerTitolo(b){
    var nome={superset:'Superset',circuito:'Circuito',emom:'EMOM',amrap:'AMRAP',hyrox:'Hyrox',finisher:'Finisher'}[b.tipo]||'Circuito';
    var dopo=(b.tipo==='emom'||b.tipo==='amrap')?(b.durata||12)+' min':b.giri+(b.giri===1?' giro':' giri');
    return nome+' '+b.label+' · '+dopo;
  }
  function bannerTesto(b){
    if(b.tipo==='emom') return 'Ogni minuto parte una stazione: finita la stazione, recuperi fino all\'inizio del minuto successivo. Avanti così per '+(b.durata||12)+' minuti.';
    if(b.tipo==='amrap') return 'Più giri possibili in '+(b.durata||12)+' minuti, a ritmo costante.';
    if(b.tipo==='hyrox') return 'Esegui le stazioni in sequenza senza pause programmate per '+b.giri+(b.giri===1?' giro':' giri')+'. Segna il tempo totale.';
    if(b.tipo==='finisher') return 'Ultimo sforzo: dai il massimo'+(b.recGiri?', '+fmtSec(b.recGiri)+' di recupero tra i giri':'')+'.';
    return 'Esegui gli esercizi in sequenza'+(b.recEx?' con '+fmtSec(b.recEx)+' di pausa':' senza pausa')+', poi '+(b.recGiri?fmtSec(b.recGiri)+' di recupero e ':'')+'riparti dal primo.';
  }
  function isTimed(reps){return /s|sec|:/i.test(String(reps));}
  function secFromReps(reps){var s=String(reps);var mm=s.match(/(\d+):(\d+)/);if(mm)return (+mm[1])*60+(+mm[2]);var m=s.match(/(\d+)/);return m?+m[1]:30;}
  function secFromRec(rec){if(!rec)return 0;return secFromReps(rec);}

  function getShareId(){
    var p=new URLSearchParams(location.search);
    if(p.get('id'))return p.get('id');
    var m=location.pathname.match(/\/s\/([^\/?#]+)/);
    if(m)return m[1];
    var stored=sessionStorage.getItem('shareId');
    if(stored){sessionStorage.removeItem('shareId');return stored;}
    return null;
  }

  function mostraErrore(msg){
    $('loadingScreen').style.display='none';
    $('mainContent').style.display='none';
    var card=$('card');
    card.innerHTML='<div class="state-msg"><div class="state-icon">📋</div><div class="state-title">PT Board</div><div class="state-text">'+esc(msg)+'</div></div>';
  }

  var _tt;
  function showToast(msg,type){
    var el=$('toast');
    el.textContent=msg;
    el.className='toast show'+(type==='ok'?' ok':type==='err'?' err':'');
    clearTimeout(_tt);
    _tt=setTimeout(function(){el.className='toast'+(type==='ok'?' ok':type==='err'?' err':'');},2600);
  }

  // ── STATO LOCALE ──
  function storageKey(){return 'ptb_fill_'+SHARE_ID;}
  function initStato(){
    var saved=null;
    try{saved=JSON.parse(localStorage.getItem(storageKey()));}catch(e){}
    if(saved&&saved.giorni)return saved;
    var st={dataSeduta:new Date().toISOString().slice(0,10),giorni:{}};
    SCHEDA.giorni.forEach(function(g,gi){
      st.giorni[gi]={esercizi:{}};
      (g.esercizi||[]).forEach(function(e,ei){
        if(isTimed(e.reps))st.giorni[gi].esercizi[ei]={done:false,timed:true,sets:Array.from({length:e.serie||1},function(){return {sec:'',fatto:false};})};
        else st.giorni[gi].esercizi[ei]={done:false,timed:false,sets:Array.from({length:e.serie||1},function(){return {reps:'',kg:'',rpe:''};})};
      });
    });
    return st;
  }
  function salvaStato(){try{localStorage.setItem(storageKey(),JSON.stringify(stato));}catch(e){}}

  // ── TIMER DEI BLOCCHI: EMOM (minuto per minuto), AMRAP (conto alla rovescia), Hyrox (cronometro) ──
  // Stato per giorno+blocco, fuori dal DOM: la lista si puo' ridisegnare senza perdere il tempo.
  var blkTimers={},blkTick=null,wakeLock=null;
  function tState(k){return blkTimers[k]||(blkTimers[k]={acc:0,start:null,lastMin:0,done:false});}
  function tElapsed(t){return t.acc+(t.start?Date.now()-t.start:0);}
  function mmss(sec){sec=Math.max(0,Math.ceil(sec-0.001));var m=Math.floor(sec/60),r=sec%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
  function beep(lungo){
    try{if(navigator.vibrate)navigator.vibrate(lungo?[300,120,300]:150);}catch(e){}
    try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;beep.ctx=beep.ctx||new AC();var c=beep.ctx,o=c.createOscillator(),g=c.createGain();
      o.frequency.value=lungo?660:880;g.gain.value=0.15;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+(lungo?0.6:0.2));}catch(e){}
  }
  function wake(on){
    try{
      if(on&&!wakeLock&&navigator.wakeLock) navigator.wakeLock.request('screen').then(function(w){wakeLock=w;}).catch(function(){});
      else if(!on&&wakeLock){wakeLock.release();wakeLock=null;}
    }catch(e){}
  }
  function gestisciTick(){
    var attivi=Object.keys(blkTimers).some(function(k){return !!blkTimers[k].start;});
    if(attivi&&!blkTick){blkTick=setInterval(tickTimers,250);wake(true);}
    if(!attivi&&blkTick){clearInterval(blkTick);blkTick=null;wake(false);}
  }
  function tickTimers(){var els=document.querySelectorAll('.blk-timer');for(var i=0;i<els.length;i++)aggiornaTimer(els[i]);gestisciTick();}
  function aggiornaTimer(el){
    var k=el.getAttribute('data-k'),tipo=el.getAttribute('data-tipo'),durMin=+el.getAttribute('data-dur')||12,dur=durMin*60;
    var st=[];try{st=JSON.parse(el.getAttribute('data-st')||'[]');}catch(e){}
    var t=tState(k),sec=tElapsed(t)/1000,val='',sub='';
    if(tipo==='hyrox'){
      val=mmss(Math.floor(sec));
      sub=t.start?'In corso… vai senza pause':(sec>0?'Tempo totale: '+mmss(Math.floor(sec)):'Premi Avvia e segna il tempo totale');
    }else{
      if(sec>=dur&&!t.done){t.done=true;t.acc=dur*1000;t.start=null;sec=dur;beep(true);}
      if(tipo==='emom'){
        var min=Math.min(Math.floor(sec/60)+1,durMin);
        if(t.start&&min!==t.lastMin){if(t.lastMin)beep(false);t.lastMin=min;}
        val=t.done?'00:00':mmss(60-(sec%60));
        sub=t.done?'Finito! Ottimo lavoro':('Minuto '+min+' di '+durMin+(st.length?' · '+st[(min-1)%st.length]:''));
      }else{
        val=mmss(dur-sec);
        sub=t.done?'Finito! Segna quanti giri hai fatto':(t.start?'Più giri possibili, ritmo costante':(sec>0?'In pausa':'Premi Avvia quando sei pronto'));
      }
    }
    el.querySelector('.bt-val').textContent=val;
    el.querySelector('.bt-sub').textContent=sub;
    var go=el.querySelector('.bt-go');
    go.textContent=t.start?'Pausa':(t.done?'Finito':(sec>0?'Riprendi':'Avvia'));
    go.disabled=!!t.done;
  }
  function creaTimer(b,stazioni){
    var k=giornoAttivo+':'+b.id;
    var el=document.createElement('div');
    el.className='blk-timer';
    el.setAttribute('data-k',k);el.setAttribute('data-tipo',b.tipo);el.setAttribute('data-dur',String(b.durata||12));el.setAttribute('data-st',JSON.stringify(stazioni));
    var lbl={emom:'Timer EMOM',amrap:'Timer AMRAP',hyrox:'Cronometro'}[b.tipo];
    el.innerHTML='<div><div class="bt-lbl">'+lbl+'</div><div class="bt-val">00:00</div><div class="bt-sub"></div></div>'+
      '<div class="bt-btns"><button type="button" class="bt-go">Avvia</button><button type="button" class="bt-reset">Azzera</button></div>';
    el.querySelector('.bt-go').addEventListener('click',function(ev){
      ev.stopPropagation();var t=tState(k);if(t.done)return;
      if(t.start){t.acc+=Date.now()-t.start;t.start=null;}
      else{t.start=Date.now();if(!t.acc){t.lastMin=1;beep(false);}}
      gestisciTick();aggiornaTimer(el);
    });
    el.querySelector('.bt-reset').addEventListener('click',function(ev){
      ev.stopPropagation();blkTimers[k]={acc:0,start:null,lastMin:0,done:false};gestisciTick();aggiornaTimer(el);
    });
    aggiornaTimer(el);
    return el;
  }

  // ── REST TIMER (floating) ──
  function startRestTimer(seconds,label,onEnd){
    if(!seconds||seconds<=0){if(onEnd)onEnd();return;}
    stopRestTimer(true);
    restTimerOnEnd=onEnd||null;
    var el=$('restTimer');
    var val=$('restTimerValue');
    $('restTimerLabel').textContent=label||'Recupero';
    restTimerEnd=Date.now()+seconds*1000;
    el.classList.add('show');
    function tick(){
      var remaining=Math.max(0,Math.round((restTimerEnd-Date.now())/1000));
      val.textContent=remaining+'s';
      if(remaining<=0){
        stopRestTimer();
        try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
        if(restTimerOnEnd){var cb=restTimerOnEnd;restTimerOnEnd=null;cb();}
      }
    }
    tick();
    restTimerInterval=setInterval(tick,1000);
  }
  function stopRestTimer(silent){
    if(restTimerInterval){clearInterval(restTimerInterval);restTimerInterval=null;}
    var el=$('restTimer');
    setTimeout(function(){el.classList.remove('show');},100);
    if(!silent&&restTimerOnEnd){restTimerOnEnd=null;}
  }
  $('restTimerSkip').addEventListener('click',function(){
    // Se è esercizio a tempo, lo "completa" come fatto. Se è recupero, salta.
    var wasTimed=$('restTimerLabel').textContent.toLowerCase().indexOf('esercizio')!==-1;
    if(wasTimed&&restTimerOnEnd){var cb=restTimerOnEnd;restTimerOnEnd=null;stopRestTimer(true);cb();}
    else stopRestTimer();
  });

  // Regole, progressione, riscaldamento e defaticamento: fuori da #exerciseList (updateProgress usa l'indice dei figli).
  function testoRighe(t){return esc(t).replace(/\n/g,'<br>');}
  function renderParti(g){

    var r=g.riscaldamento,d=g.defaticamento;

  function renderExerciseBlock(e,ei){
    var st=stato.giorni[giornoAttivo].esercizi[ei];
    var totalSets=st.sets.length;
    var doneSets=st.sets.filter(function(s){return st.timed?s.fatto:!!(s.reps||s.kg);}).length;
    var allDone=doneSets>=totalSets&&totalSets>0;

    var lista=SCHEDA.giorni[giornoAttivo].esercizi||[];
    var prevE=lista[ei-1];
    var grp=function(x){return x&&x.blocco?'b:'+x.blocco.id:'_singoli';};
    // Numero da palestra: A1, A2 dentro il blocco; 1, 2, 3 per gli esercizi singoli.
    var num='';
    if(e.blocco){var pos=0;for(var k=0;k<=ei;k++){if(lista[k].blocco&&lista[k].blocco.id===e.blocco.id)pos++;}num=(e.blocco.label||'')+pos;}
    else{var n=0;for(var k2=0;k2<=ei;k2++){if(!lista[k2].blocco)n++;}num=String(n);}

    var block=document.createElement('div');
    block.className='ex-block'+(allDone?' done':'')+(e.blocco?' in-blk'+(e.blocco.tipo==='superset'?' blk-sup':(e.blocco.tipo!=='circuito'?' blk-'+e.blocco.tipo:'')):'')+(prevE&&grp(prevE)!==grp(e)?' grp-start':'');

    // Banner del blocco dentro il primo esercizio (non come fratello: updateProgress usa l'indice dei figli).
    if(e.blocco){
      var prev=SCHEDA.giorni[giornoAttivo].esercizi[ei-1];
      if(!prev||!prev.blocco||prev.blocco.id!==e.blocco.id){
        var b=e.blocco;
        var ban=document.createElement('div');
        ban.className='blk-banner';
        ban.innerHTML='<div class="blk-title">'+esc(bannerTitolo(b))+'</div><div class="blk-sub">'+esc(bannerTesto(b))+'</div>'+(b.nota?'<div class="blk-nota">'+esc(b.nota)+'</div>':'');
        if(b.tipo==='emom'||b.tipo==='amrap'||b.tipo==='hyrox'){
          var stazioni=[];lista.forEach(function(x){if(x.blocco&&x.blocco.id===b.id)stazioni.push((b.label||'')+(stazioni.length+1)+' '+x.nome);});
          ban.appendChild(creaTimer(b,stazioni));
        }
        block.appendChild(ban);
      }
    }

    var header=document.createElement('div');
    header.className='ex-header';
    var carico=e.carico?' @ '+e.carico:'';
    var aDurata=e.blocco&&(e.blocco.tipo==='emom'||e.blocco.tipo==='amrap');
    var dose=fmtT(e.reps||'')+(e.lato?' per lato':'');
    header.innerHTML='<div class="ex-header-left"><div class="ex-name"><span class="ex-num">'+esc(num)+'</span>'+esc(e.nome)+'</div><div class="ex-target">'+(aDurata?'':esc(String(e.serie||''))+' × ')+esc(dose)+esc(carico)+(e.rec?' · '+esc(fmtT(e.rec))+' rec':'')+'</div>'+(e.muscoli?'<div class="ex-muscles">'+esc(e.muscoli)+'</div>':'')+(e.nota?'<div class="ex-nota">'+esc(e.nota)+'</div>':'')+'</div><div class="ex-progress'+(allDone?' done':'')+'">'+doneSets+'/'+totalSets+'</div>';
    block.appendChild(header);

    // Animazione "Come si esegue" (anim-esercizi.js), dentro il blocco: updateProgress usa l'indice dei figli.
    if(e.anim&&window.PTAnim&&PTAnim.has({anim:e.anim})){
      var key=giornoAttivo+':'+ei;
      var btn=document.createElement('button');btn.type='button';btn.className='anim-btn';
      var box=document.createElement('div');box.className='anim-box';box.hidden=true;
      var handle=null;
      var open=function(v){
        animAperte[key]=v;box.hidden=!v;btn.textContent=v?'Chiudi':'\u25B6 Come si esegue';btn.setAttribute('aria-expanded',String(v));
        if(v&&!handle){handle=PTAnim.mount(box,e.anim,{label:'Esecuzione: '+e.nome});var cap=document.createElement('div');cap.className='anim-cap';var cr=PTAnim.CREDIT||{text:'Exercise data by RepDB (repdb.co)',url:'https://repdb.co'};cap.innerHTML=(PTAnim.FRAMES&&PTAnim.FRAMES[e.anim]===1?'Posizione di riferimento · ':'Posizione di partenza e di arrivo · ')+'<a href="'+cr.url+'" target="_blank" rel="noopener nofollow">'+esc(cr.text)+'</a>';box.appendChild(cap);}
        if(!v&&handle){handle.destroy();handle=null;box.innerHTML='';}
      };
      btn.addEventListener('click',function(){open(!animAperte[key]);});
      header.querySelector('.ex-header-left').appendChild(btn);
      block.appendChild(box);

  function renderRepsSetRow(e,ei,setIdx){
    var st=stato.giorni[giornoAttivo].esercizi[ei];
    var s=st.sets[setIdx];
    var done=!!(s.reps&&s.kg);

    var row=document.createElement('div');
    row.className='set-row';

    var num=document.createElement('div');

    row.appendChild(num);

    var pesoInput=document.createElement('input');
    pesoInput.type='number';
    pesoInput.inputMode='decimal';
    pesoInput.className='set-input'+(done?' done':'');
    pesoInput.placeholder='kg';
    pesoInput.value=s.kg||'';
    pesoInput.addEventListener('input',function(){s.kg=this.value;salvaStato();updateProgress(ei);});
    row.appendChild(pesoInput);

    var sep1=document.createElement('span');sep1.className='set-sep';sep1.textContent='×';row.appendChild(sep1);

    var repsInput=document.createElement('input');
    repsInput.type='number';
    repsInput.inputMode='numeric';
    repsInput.className='set-input'+(done?' done':'');
    repsInput.placeholder=esc(String(e.reps||'reps'));
    repsInput.value=s.reps||'';
    repsInput.addEventListener('input',function(){s.reps=this.value;salvaStato();updateProgress(ei);});
    row.appendChild(repsInput);

    var sep2=document.createElement('span');sep2.className='set-sep';sep2.textContent='·';row.appendChild(sep2);

    var rpeSel=document.createElement('select');
    rpeSel.className='set-rpe'+(done?' done':'');

    for(var r=5;r<=10;r++){
      var oR=document.createElement('option');oR.value=String(r);oR.textContent='RPE '+r;
      if(s.rpe&&Number(s.rpe)===r)oR.selected=true;
      rpeSel.appendChild(oR);
    }
    rpeSel.addEventListener('change',function(){s.rpe=this.value;salvaStato();});
    row.appendChild(rpeSel);

    var check=document.createElement('button');

      // Marca come fatto, parte timer recupero

      var recSec=secFromRec(e.rec);
      if(recSec>0)startRestTimer(recSec,'Recupero');
      renderExerciseList();
    });

    return row;
  }

  function renderTimedSetRow(e,ei,setIdx){
    var st=stato.giorni[giornoAttivo].esercizi[ei];
    var s=st.sets[setIdx];
    var dur=secFromReps(e.reps);

    var row=document.createElement('div');
    row.className='set-row-timed';

    var num=document.createElement('div');
    num.className='set-num';
    num.textContent=(setIdx+1);
    row.appendChild(num);

    var info=document.createElement('div');
    info.className='set-timed-info'+(s.fatto?' done':'');
    info.textContent=s.fatto?('✓ '+(s.sec||dur)+'s completati'):'A tempo: '+dur+' secondi';
    row.appendChild(info);

    var btn=document.createElement('button');
    btn.type='button';
    btn.className='btn-play'+(s.fatto?' replay':'');
    btn.textContent=s.fatto?'↻ Rifai':'▶ Start';
    btn.addEventListener('click',function(){
      startRestTimer(dur,'Esercizio',function(){
        s.fatto=true;
        s.sec=dur;
        salvaStato();
        // Dopo l'esercizio a tempo, parte recupero se previsto
        var recSec=secFromRec(e.rec);
        if(recSec>0)setTimeout(function(){startRestTimer(recSec,'Recupero');},400);
        renderExerciseList();
      });
    });
    row.appendChild(btn);

    return row;
  }

  function updateProgress(ei){
    // Aggiorna solo il badge "x/y" senza rifare tutto il blocco
    // Per semplicità rifacciamo solo il header dell'esercizio toccato
    var giorno=SCHEDA.giorni[giornoAttivo];
    var blocks=$('exerciseList').children;
    if(!blocks[ei])return;
    var e=giorno.esercizi[ei];
    var st=stato.giorni[giornoAttivo].esercizi[ei];
    var totalSets=st.sets.length;
    var doneSets=st.sets.filter(function(s){return st.timed?s.fatto:!!(s.reps||s.kg);}).length;
    var allDone=doneSets>=totalSets&&totalSets>0;
    var prog=blocks[ei].querySelector('.ex-progress');
    if(prog){
      prog.textContent=doneSets+'/'+totalSets;
      prog.className='ex-progress'+(allDone?' done':'');
    }
    if(allDone)blocks[ei].classList.add('done');
    else blocks[ei].classList.remove('done');
  }

  // ── SALVATAGGIO ──
  function salva(){
    var btn=$('btnSave');
    btn.disabled=true;
    btn.textContent='Salvataggio...';
    var g=SCHEDA.giorni[giornoAttivo];
    var es=stato.giorni[giornoAttivo].esercizi;
    var esercizi=g.esercizi.map(function(e,ei){
      var st=es[ei];
      return {nome:e.nome,timed:!!st.timed,done:!!st.done,sets:st.sets.map(function(s){return st.timed?{sec:s.sec||'',fatto:!!s.fatto}:{reps:s.reps||'',kg:s.kg||'',rpe:s.rpe||''};})};
    });
    var entry={data:stato.dataSeduta,giorno:g.nome,esercizi:esercizi,ts:Date.now()};
    fbDb.collection('sharedClients').doc(SHARE_ID).update({
      log:firebase.firestore.FieldValue.arrayUnion(entry),
      updatedAt:Date.now()
    }).then(function(){
      btn.textContent='✓ Salvato';
      btn.classList.add('saved');
      showToast('Seduta salvata','ok');
      setTimeout(function(){btn.textContent='Salva seduta';btn.classList.remove('saved');btn.disabled=false;},2000);
    }).catch(function(err){
      console.warn('[share] save error:',err);
      btn.textContent='Salva seduta';
      btn.disabled=false;
      showToast('Errore salvataggio, riprova','err');
    });
  }

  // ── ADAPTER Firestore → SCHEDA ──
  function parteOk(v){if(!v||typeof v!=='object')return null;var t=typeof v.testo==='string'?v.testo:'',m=+v.min||0;return (t||m)?{testo:t,min:m}:null;}
  function adatta(data){
    var sa=data.schedaAttuale||{};
    var giorni=(sa.giorni||[]).map(function(g){
      g=g||{};
      return {nome:g.nome||'Allenamento',esercizi:(g.esercizi||[]).filter(function(e){return e;}).map(function(e){
        var b=(e.blocco&&typeof e.blocco==='object')?{id:String(e.blocco.id||''),label:String(e.blocco.label||''),tipo:TIPI_BLOCCO.indexOf(e.blocco.tipo)!==-1?e.blocco.tipo:'circuito',giri:+e.blocco.giri||1,recEx:+e.blocco.recEx||0,recGiri:+e.blocco.recGiri||0,durata:+e.blocco.durata||0,nota:typeof e.blocco.nota==='string'?e.blocco.nota:''}:null;
        return {nome:e.nome||'Esercizio',muscoli:e.muscoli||'',serie:e.serie||1,reps:e.reps!=null?e.reps:'',carico:e.carico||'',rec:e.rec||'',nota:e.nota||'',lato:!!e.lato,blocco:b,anim:typeof e.anim==='string'?e.anim:''};
      }),
        regole:typeof g.regole==='string'?g.regole:'',progressione:typeof g.progressione==='string'?g.progressione:'',
        riscaldamento:parteOk(g.riscaldamento),defaticamento:parteOk(g.defaticamento)};
    }).filter(function(g){return g.esercizi.length>0;});
    return {cliente:data.cliente||'',ptNome:data.ptNome||'',programma:sa.programma||'',giorni:giorni,gymBranding:data.gymBranding||null};
  }

  // Applica il branding palestra denormalizzato nel doc sharedClients (FASE 5):
  // CSS vars + logo + nome brand nell'header. Fallback silenzioso: se mancante,
  // resta "PT Board" come oggi.
  function applyGymBrandingSnapshot(gb){
    if(!gb) return;
    try{
      var root=document.documentElement.style;
      if(gb.theme){
        if(gb.theme.accent) root.setProperty('--accent',gb.theme.accent);
        if(gb.theme.accentSecondary) root.setProperty('--accentSecondary',gb.theme.accentSecondary);
        if(gb.theme.onAccent) root.setProperty('--onAccent',gb.theme.onAccent);
      }
      var brandLogo=$('brandLogo');
      var brandName=$('brandName');
      if(brandLogo){
        if(gb.logo){
          brandLogo.innerHTML='';
          var img=document.createElement('img');
          img.src=gb.logo;img.alt='logo';
          img.style.cssText='width:100%;height:100%;object-fit:contain';
          brandLogo.appendChild(img);
          brandLogo.style.background='var(--accent)';
          brandLogo.style.padding='3px';
        } else {
          brandLogo.textContent=(gb.gymNome||'').trim().slice(0,2).toUpperCase()||'PT';
        }
      }
      if(brandName) brandName.textContent=gb.gymNome||'PT Board';
      // theme-color meta per il browser (barra iOS/Android).
      try{var m=document.querySelector('meta[name="theme-color"]');if(m&&gb.theme&&gb.theme.accent) m.setAttribute('content',gb.theme.accent);}catch(e){}
    }catch(e){console.warn('[share] applyGymBrandingSnapshot',e);}
  }

  $('btnSave').addEventListener('click',salva);

  $('dayChips').addEventListener('click',function(ev){
    var b=ev.target.closest('.day-chip');if(!b)return;
    var sel=$('daySelect');sel.value=b.getAttribute('data-gi');
    sel.dispatchEvent(new Event('change'));
  });
  $('daySelect').addEventListener('change',function(){
    giornoAttivo=+this.value;
    var cs=document.querySelectorAll('#dayChips .day-chip');for(var ci=0;ci<cs.length;ci++)cs[ci].classList.toggle('on',+cs[ci].getAttribute('data-gi')===giornoAttivo);
    if(!stato.giorni[giornoAttivo]){
      // Inizializza il giorno se non esiste (es. switch tra giorni)
      stato.giorni[giornoAttivo]={esercizi:{}};
      var g=SCHEDA.giorni[giornoAttivo];
      (g.esercizi||[]).forEach(function(e,ei){
        if(isTimed(e.reps))stato.giorni[giornoAttivo].esercizi[ei]={done:false,timed:true,sets:Array.from({length:e.serie||1},function(){return {sec:'',fatto:false};})};
        else stato.giorni[giornoAttivo].esercizi[ei]={done:false,timed:false,sets:Array.from({length:e.serie||1},function(){return {reps:'',kg:'',rpe:''};})};
      });
      salvaStato();
    }
    renderExerciseList();
  });

  // ── INIT ──
  function init(){
    SHARE_ID=getShareId();
    if(!SHARE_ID){mostraErrore('Link non valido.');return;}
    fbDb.collection('sharedClients').doc(SHARE_ID).get({source:'server'}).catch(function(){
      // fallback offline
      return fbDb.collection('sharedClients').doc(SHARE_ID).get();
    }).then(function(doc){
      if(!doc.exists){mostraErrore('Scheda non trovata. Controlla il link.');return;}
      var data=doc.data();
      if(data.attivo===false){mostraErrore('Questo link non è più attivo. Contatta il tuo personal trainer.');return;}
      SCHEDA=adatta(data);
      applyGymBrandingSnapshot(SCHEDA.gymBranding);
      if(!SCHEDA.giorni.length){mostraErrore('La scheda non contiene esercizi. Contatta il tuo personal trainer.');return;}
      if(giornoAttivo>=SCHEDA.giorni.length)giornoAttivo=0;
      stato=initStato();
      try{render();}
      catch(errRender){
        console.warn('[share] render error:',errRender);
        mostraErrore('Si è verificato un problema nel mostrare la scheda. Contatta il tuo personal trainer.');
      }
    }).catch(function(e){
      console.warn('[share] init error:',e);
      mostraErrore('Errore di connessione. Riprova.');
    });
  }

  // Se la pagina viene ripristinata dalla cache del browser/PWA (back-forward),
  // forza un ricaricamento fresco così non resta su una versione vecchia.
  window.addEventListener('pageshow',function(ev){if(ev.persisted){location.reload();}});

  init();
})();
</script>
</body>
</html>
