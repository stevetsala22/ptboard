<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fafafa;color:#042C53;min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{display:flex;align-items:flex-start;justify-content:center;padding:24px}
  .card{max-width:480px;width:100%;background:#fff;border-radius:18px;box-shadow:0 4px 24px rgba(4,44,83,0.08);overflow:hidden;margin-top:24px;margin-bottom:80px}

  /* Header */
  .head{padding:20px 24px 0;display:flex;align-items:center;gap:8px}
  .logo{width:30px;height:30px;background:#185FA5;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:14px;letter-spacing:-0.3px}
  .brand{font-size:14px;font-weight:500;color:#042C53;flex:1}

  /* Title block */
  .head-info{padding:18px 24px 18px;border-bottom:1px solid #f0f0ec}
  .step-label{font-size:11px;color:#94a3b8;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:6px}
  .cliente-name{font-size:22px;font-weight:600;line-height:1.2;letter-spacing:-0.4px;color:#042C53;margin-bottom:4px}
  .pt-info{font-size:13px;color:#5F5E5A}

  /* Date + day select bar */
  .top-controls{padding:14px 24px;background:#fafafa;border-bottom:1px solid #f0f0ec;display:flex;flex-direction:column;gap:10px}
  .ctrl-row{display:flex;align-items:center;gap:10px;font-size:13px}
  .ctrl-label{font-weight:600;color:#5F5E5A;flex-shrink:0;min-width:84px}
  .ctrl-input,.ctrl-select{flex:1;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:#042C53;-webkit-appearance:none}
  .ctrl-input:focus,.ctrl-select:focus{outline:none;border-color:#185FA5;box-shadow:0 0 0 2px rgba(24,95,165,0.15)}
  .ctrl-select{cursor:pointer;font-weight:600}

  /* Body */
  .body{padding:20px 24px}

  /* Exercise card */
  .ex-block{background:#fafafa;border:1px solid #f0f0ec;border-radius:12px;padding:14px;margin-bottom:12px}
  .ex-block.done{background:#f0fdf4;border-color:#bbf7d0}
  .ex-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px}
  .ex-header-left{flex:1;min-width:0}
  .ex-name{font-size:15px;font-weight:600;color:#042C53;line-height:1.3}
  .ex-target{font-size:12px;color:#185FA5;font-weight:600;margin-top:2px}
  .ex-muscles{font-size:11px;color:#94a3b8;margin-top:3px}
  .ex-nota{font-size:12px;color:#5F5E5A;background:#fff;border-left:3px solid #185FA5;padding:6px 10px;margin-top:8px;border-radius:0 6px 6px 0;font-style:italic}
  .ex-progress{font-size:11px;color:#185FA5;font-weight:600;background:#E6F1FB;padding:3px 8px;border-radius:12px;white-space:nowrap}
  .ex-progress.done{color:#166534;background:#dcfce7}

  /* Set rows (reps mode) */
  .set-row{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid #f0f0ec}
  .set-row:first-of-type{border-top:none}
  .set-num{font-size:11px;font-weight:600;color:#94a3b8;width:22px;flex-shrink:0;letter-spacing:0.5px}
  .set-input{width:54px;padding:7px 4px;border:1px solid #cbd5e1;border-radius:7px;font-size:13.5px;font-family:inherit;text-align:center;color:#042C53;font-weight:600;background:#fff;-webkit-appearance:none;-moz-appearance:textfield}
  .set-input::-webkit-outer-spin-button,.set-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .set-input:focus{outline:none;border-color:#185FA5;box-shadow:0 0 0 2px rgba(24,95,165,0.15)}
  .set-input.done{background:#f0fdf4;border-color:#86efac;color:#166534}
  .set-sep{font-size:12px;color:#cbd5e1;flex-shrink:0}
  .set-rpe{padding:6px 4px;border:1px solid #cbd5e1;border-radius:7px;font-size:12px;background:#fff;font-family:inherit;font-weight:600;color:#185FA5;width:auto;max-width:74px}
  .set-rpe.done{background:#f0fdf4;border-color:#86efac;color:#166534}
  .set-check{margin-left:auto;width:32px;height:32px;background:#185FA5;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:16px;font-family:inherit;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .set-check:disabled{background:#cbd5e1;cursor:not-allowed}
  .set-check.done{background:#16a34a}

  /* Set rows (timed mode) */
  .set-row-timed{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid #f0f0ec}
  .set-row-timed:first-of-type{border-top:none}
  .set-timed-info{flex:1;font-size:13px;color:#042C53;font-weight:500}
  .set-timed-info.done{color:#166534}
  .btn-play{background:#185FA5;color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn-play.replay{background:#16a34a}

  /* Save button area */
  .save-area{position:sticky;bottom:0;background:#fff;padding:14px 24px;border-top:1px solid #f0f0ec;box-shadow:0 -4px 12px rgba(4,44,83,0.04)}
  .btn-save{width:100%;padding:14px;background:#185FA5;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:background 0.15s}
  .btn-save:hover{background:#0f4a85}
  .btn-save:active{transform:scale(0.99)}
  .btn-save:disabled{opacity:.6;cursor:not-allowed}
  .btn-save.saved{background:#16a34a}

  /* Footer */
  .footer{padding:14px 24px;text-align:center;background:#fafafa;border-top:1px solid #f0f0ec}
  .footer-text{font-size:11px;color:#94a3b8}
  .footer-text a{color:#185FA5;text-decoration:none}

  /* Rest timer floating */
  .rest-timer{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);background:#042C53;color:#fff;padding:14px 20px;border-radius:14px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 24px rgba(0,0,0,0.2);z-index:100;transition:transform 0.25s;min-width:240px}
  .rest-timer.show{transform:translateX(-50%) translateY(0)}
  .rest-timer-label{font-size:11px;color:#94a3b8;letter-spacing:0.5px;text-transform:uppercase}
  .rest-timer-value{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
  .rest-timer-skip{background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;margin-left:auto}
  .rest-timer-skip:hover{background:rgba(255,255,255,0.25)}

  /* Toast */
  .toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-180%);background:#042C53;color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;font-weight:500;z-index:200;transition:transform 0.25s;box-shadow:0 8px 24px rgba(0,0,0,0.2)}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.ok{background:#16a34a}
  .toast.err{background:#dc2626}

  /* Empty / error states */
  .state-msg{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
  .state-icon{font-size:42px;margin-bottom:14px}
  .state-title{font-size:18px;font-weight:600;color:#042C53;margin-bottom:8px}
  .state-text{font-size:13px;color:#5F5E5A;max-width:280px;line-height:1.55}

  /* Loading */
  .loading{padding:60px 24px;text-align:center;color:#94a3b8}
  .spinner{width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#185FA5;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<main class="card" id="card">
  <!-- Loading iniziale -->
  <div class="loading" id="loadingScreen">
    <div class="spinner"></div>
    Caricamento scheda...
  </div>

  <!-- Contenuto principale (nascosto fino a load completo) -->
  <div id="mainContent" style="display:none">
    <header class="head">
      <div class="logo">PT</div>
      <div class="brand">PT Board</div>
    </header>

    <section class="head-info">
      <div class="step-label">La tua scheda</div>
      <div class="cliente-name" id="cliente">—</div>
      <div class="pt-info"><span id="programma">—</span> · PT: <span id="pt-nome">—</span></div>
    </section>

    <section class="top-controls">
      <div class="ctrl-row">
        <span class="ctrl-label">📅 Data seduta</span>
        <input type="date" class="ctrl-input" id="dataSeduta">
      </div>
      <div class="ctrl-row" id="daySelectWrap" style="display:none">
        <span class="ctrl-label">📋 Giorno</span>
        <select class="ctrl-select" id="daySelect"></select>
      </div>
    </section>

    <section class="body" id="exerciseList"></section>

    <div class="save-area">
      <button class="btn-save" id="btnSave">Salva seduta</button>
    </div>

    <footer class="footer">
      <div class="footer-text">
        <a href="/">personaltrainerboard.com</a>
      </div>
    </footer>
  </div>
</main>

<!-- Rest timer floating (riusato sia per recupero che per esercizi a tempo) -->
<div class="rest-timer" id="restTimer">
  <div>
    <div class="rest-timer-label" id="restTimerLabel">Recupero</div>
    <div class="rest-timer-value" id="restTimerValue">90s</div>
  </div>
  <button class="rest-timer-skip" id="restTimerSkip" type="button">Salta</button>
</div>

<script>
(function(){
  var SHARE_ID=null;
  var SCHEDA=null; // {cliente, ptNome, programma, giorni:[{nome, esercizi:[{nome,muscoli,serie,reps,carico,rec,nota}]}]}
  var stato=null;
  var giornoAttivo=0;
  var restTimerInterval=null;
  var restTimerEnd=0;
  var restTimerOnEnd=null;

  // ── HELPERS ──
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function isTimed(reps){return /s|sec|:/i.test(String(reps));}
  function secFromReps(reps){var s=String(reps);var mm=s.match(/(\d+):(\d+)/);if(mm)return (+mm[1])*60+(+mm[2]);var m=s.match(/(\d+)/);return m?+m[1]:30;}
  function secFromRec(rec){if(!rec)return 0;return secFromReps(rec);}

  function getShareId(){
    var p=new URLSearchParams(location.search);
    if(p.get('id'))return p.get('id');
    var m=location.pathname.match(/\/s\/([^\/?#]+)/);
    if(m)return m[1];
    var stored=sessionStorage.getItem('shareId');
    if(stored){sessionStorage.removeItem('shareId');return stored;}
    return null;
  }

  function mostraErrore(msg){
    $('loadingScreen').style.display='none';
    $('mainContent').style.display='none';
    var card=$('card');
    card.innerHTML='<div class="state-msg"><div class="state-icon">📋</div><div class="state-title">PT Board</div><div class="state-text">'+esc(msg)+'</div></div>';
  }

  var _tt;
  function showToast(msg,type){
    var el=$('toast');
    el.textContent=msg;
    el.className='toast show'+(type==='ok'?' ok':type==='err'?' err':'');
    clearTimeout(_tt);
    _tt=setTimeout(function(){el.className='toast'+(type==='ok'?' ok':type==='err'?' err':'');},2600);
  }

  // ── STATO LOCALE ──
  function storageKey(){return 'ptb_fill_'+SHARE_ID;}
  function initStato(){
    var saved=null;
    try{saved=JSON.parse(localStorage.getItem(storageKey()));}catch(e){}
    if(saved&&saved.giorni)return saved;
    var st={dataSeduta:new Date().toISOString().slice(0,10),giorni:{}};
    SCHEDA.giorni.forEach(function(g,gi){
      st.giorni[gi]={esercizi:{}};
      (g.esercizi||[]).forEach(function(e,ei){
        if(isTimed(e.reps))st.giorni[gi].esercizi[ei]={done:false,timed:true,sets:Array.from({length:e.serie||1},function(){return {sec:'',fatto:false};})};
        else st.giorni[gi].esercizi[ei]={done:false,timed:false,sets:Array.from({length:e.serie||1},function(){return {reps:'',kg:'',rpe:''};})};
      });
    });
    return st;
  }
  function salvaStato(){try{localStorage.setItem(storageKey(),JSON.stringify(stato));}catch(e){}}

  // ── REST TIMER (floating) ──
  function startRestTimer(seconds,label,onEnd){
    if(!seconds||seconds<=0){if(onEnd)onEnd();return;}
    stopRestTimer(true);
    restTimerOnEnd=onEnd||null;
    var el=$('restTimer');
    var val=$('restTimerValue');
    $('restTimerLabel').textContent=label||'Recupero';
    restTimerEnd=Date.now()+seconds*1000;
    el.classList.add('show');
    function tick(){
      var remaining=Math.max(0,Math.round((restTimerEnd-Date.now())/1000));
      val.textContent=remaining+'s';
      if(remaining<=0){
        stopRestTimer();
        try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
        if(restTimerOnEnd){var cb=restTimerOnEnd;restTimerOnEnd=null;cb();}
      }
    }
    tick();
    restTimerInterval=setInterval(tick,1000);
  }
  function stopRestTimer(silent){
    if(restTimerInterval){clearInterval(restTimerInterval);restTimerInterval=null;}
    var el=$('restTimer');
    setTimeout(function(){el.classList.remove('show');},100);
    if(!silent&&restTimerOnEnd){restTimerOnEnd=null;}
  }
  $('restTimerSkip').addEventListener('click',function(){
    // Se è esercizio a tempo, lo "completa" come fatto. Se è recupero, salta.
    var wasTimed=$('restTimerLabel').textContent.toLowerCase().indexOf('esercizio')!==-1;
    if(wasTimed&&restTimerOnEnd){var cb=restTimerOnEnd;restTimerOnEnd=null;stopRestTimer(true);cb();}
    else stopRestTimer();
  });

  // ── RENDER ──
  function render(){
    $('cliente').textContent=SCHEDA.cliente||'';
    $('pt-nome').textContent=SCHEDA.ptNome||'';
    $('programma').textContent=SCHEDA.programma||'';
    $('dataSeduta').value=stato.dataSeduta;

    var sel=$('daySelect');
    var wrap=$('daySelectWrap');
    sel.innerHTML=SCHEDA.giorni.map(function(g,gi){
      return '<option value="'+gi+'" '+(gi===giornoAttivo?'selected':'')+'>'+esc(g.nome)+'</option>';
    }).join('');
    wrap.style.display=SCHEDA.giorni.length>1?'flex':'none';

    renderExerciseList();
    $('loadingScreen').style.display='none';
    $('mainContent').style.display='block';
  }

  function renderExerciseList(){
    var giorno=SCHEDA.giorni[giornoAttivo];
    var list=$('exerciseList');
    list.innerHTML='';
    (giorno.esercizi||[]).forEach(function(e,ei){
      list.appendChild(renderExerciseBlock(e,ei));
    });
  }

  function renderExerciseBlock(e,ei){
    var st=stato.giorni[giornoAttivo].esercizi[ei];
    var totalSets=st.sets.length;
    var doneSets=st.sets.filter(function(s){return st.timed?s.fatto:!!(s.reps||s.kg);}).length;
    var allDone=doneSets>=totalSets&&totalSets>0;

    var block=document.createElement('div');
    block.className='ex-block'+(allDone?' done':'');

    var header=document.createElement('div');
    header.className='ex-header';
    var carico=e.carico?' @ '+esc(e.carico):'';
    header.innerHTML='<div class="ex-header-left"><div class="ex-name">'+esc(e.nome)+'</div><div class="ex-target">'+esc(String(e.serie||''))+' × '+esc(String(e.reps||''))+esc(carico)+(e.rec?' · '+esc(e.rec)+' rec':'')+'</div>'+(e.muscoli?'<div class="ex-muscles">'+esc(e.muscoli)+'</div>':'')+(e.nota?'<div class="ex-nota">'+esc(e.nota)+'</div>':'')+'</div><div class="ex-progress'+(allDone?' done':'')+'">'+doneSets+'/'+totalSets+'</div>';
    block.appendChild(header);

    for(var i=0;i<st.sets.length;i++){
      if(st.timed)block.appendChild(renderTimedSetRow(e,ei,i));
      else block.appendChild(renderRepsSetRow(e,ei,i));
    }
    return block;
  }

  function renderRepsSetRow(e,ei,setIdx){
    var st=stato.giorni[giornoAttivo].esercizi[ei];
    var s=st.sets[setIdx];
    var done=!!(s.reps&&s.kg);

    var row=document.createElement('div');
    row.className='set-row';

    var num=document.createElement('div');
    num.className='set-num';
    num.textContent=(setIdx+1);
    row.appendChild(num);

    var pesoInput=document.createElement('input');
    pesoInput.type='number';
    pesoInput.inputMode='decimal';
    pesoInput.className='set-input'+(done?' done':'');
    pesoInput.placeholder='kg';
    pesoInput.value=s.kg||'';
    pesoInput.addEventListener('input',function(){s.kg=this.value;salvaStato();updateProgress(ei);});
    row.appendChild(pesoInput);

    var sep1=document.createElement('span');sep1.className='set-sep';sep1.textContent='×';row.appendChild(sep1);

    var repsInput=document.createElement('input');
    repsInput.type='number';
    repsInput.inputMode='numeric';
    repsInput.className='set-input'+(done?' done':'');
    repsInput.placeholder=esc(String(e.reps||'reps'));
    repsInput.value=s.reps||'';
    repsInput.addEventListener('input',function(){s.reps=this.value;salvaStato();updateProgress(ei);});
    row.appendChild(repsInput);

    var sep2=document.createElement('span');sep2.className='set-sep';sep2.textContent='·';row.appendChild(sep2);

    var rpeSel=document.createElement('select');
    rpeSel.className='set-rpe'+(done?' done':'');
    var opt0=document.createElement('option');opt0.value='';opt0.textContent='RPE';rpeSel.appendChild(opt0);
    for(var r=5;r<=10;r++){
      var oR=document.createElement('option');oR.value=String(r);oR.textContent='RPE '+r;
      if(s.rpe&&Number(s.rpe)===r)oR.selected=true;
      rpeSel.appendChild(oR);
    }
    rpeSel.addEventListener('change',function(){s.rpe=this.value;salvaStato();});
    row.appendChild(rpeSel);

    var check=document.createElement('button');
    check.type='button';
    check.className='set-check'+(done?' done':'');
    check.textContent='✓';
    check.addEventListener('click',function(){
      if(!s.kg&&!s.reps){showToast('Inserisci peso o reps prima','err');return;}
      // Marca come fatto, parte timer recupero
      salvaStato();
      var recSec=secFromRec(e.rec);
      if(recSec>0)startRestTimer(recSec,'Recupero');
      renderExerciseList();
    });
    row.appendChild(check);

    return row;
  }

  function renderTimedSetRow(e,ei,setIdx){
    var st=stato.giorni[giornoAttivo].esercizi[ei];
    var s=st.sets[setIdx];
    var dur=secFromReps(e.reps);

    var row=document.createElement('div');
    row.className='set-row-timed';

    var num=document.createElement('div');
    num.className='set-num';
    num.textContent=(setIdx+1);
    row.appendChild(num);

    var info=document.createElement('div');
    info.className='set-timed-info'+(s.fatto?' done':'');
    info.textContent=s.fatto?('✓ '+(s.sec||dur)+'s completati'):'A tempo: '+dur+' secondi';
    row.appendChild(info);

    var btn=document.createElement('button');
    btn.type='button';
    btn.className='btn-play'+(s.fatto?' replay':'');
    btn.textContent=s.fatto?'↻ Rifai':'▶ Start';
    btn.addEventListener('click',function(){
      startRestTimer(dur,'Esercizio',function(){
        s.fatto=true;
        s.sec=dur;
        salvaStato();
        // Dopo l'esercizio a tempo, parte recupero se previsto
        var recSec=secFromRec(e.rec);
        if(recSec>0)setTimeout(function(){startRestTimer(recSec,'Recupero');},400);
        renderExerciseList();
      });
    });
    row.appendChild(btn);

    return row;
  }

  function updateProgress(ei){
    // Aggiorna solo il badge "x/y" senza rifare tutto il blocco
    // Per semplicità rifacciamo solo il header dell'esercizio toccato
    var giorno=SCHEDA.giorni[giornoAttivo];
    var blocks=$('exerciseList').children;
    if(!blocks[ei])return;
    var e=giorno.esercizi[ei];
    var st=stato.giorni[giornoAttivo].esercizi[ei];
    var totalSets=st.sets.length;
    var doneSets=st.sets.filter(function(s){return st.timed?s.fatto:!!(s.reps||s.kg);}).length;
    var allDone=doneSets>=totalSets&&totalSets>0;
    var prog=blocks[ei].querySelector('.ex-progress');
    if(prog){
      prog.textContent=doneSets+'/'+totalSets;
      prog.className='ex-progress'+(allDone?' done':'');
    }
    if(allDone)blocks[ei].classList.add('done');
    else blocks[ei].classList.remove('done');
  }

  // ── SALVATAGGIO ──
  function salva(){
    var btn=$('btnSave');
    btn.disabled=true;
    btn.textContent='Salvataggio...';
    var g=SCHEDA.giorni[giornoAttivo];
    var es=stato.giorni[giornoAttivo].esercizi;
    var esercizi=g.esercizi.map(function(e,ei){
      var st=es[ei];
      return {nome:e.nome,timed:!!st.timed,done:!!st.done,sets:st.sets.map(function(s){return st.timed?{sec:s.sec||'',fatto:!!s.fatto}:{reps:s.reps||'',kg:s.kg||'',rpe:s.rpe||''};})};
    });
    var entry={data:stato.dataSeduta,giorno:g.nome,esercizi:esercizi,ts:Date.now()};
    fbDb.collection('sharedClients').doc(SHARE_ID).update({
      log:firebase.firestore.FieldValue.arrayUnion(entry),
      updatedAt:Date.now()
    }).then(function(){
      btn.textContent='✓ Salvato';
      btn.classList.add('saved');
      showToast('Seduta salvata','ok');
      setTimeout(function(){btn.textContent='Salva seduta';btn.classList.remove('saved');btn.disabled=false;},2000);
    }).catch(function(err){
      console.warn('[share] save error:',err);
      btn.textContent='Salva seduta';
      btn.disabled=false;
      showToast('Errore salvataggio, riprova','err');
    });
  }

  // ── ADAPTER Firestore → SCHEDA ──
  function adatta(data){
    var sa=data.schedaAttuale||{};
    var giorni=(sa.giorni||[]).map(function(g){
      g=g||{};
      return {nome:g.nome||'Allenamento',esercizi:(g.esercizi||[]).filter(function(e){return e;}).map(function(e){
        return {nome:e.nome||'Esercizio',muscoli:e.muscoli||'',serie:e.serie||1,reps:e.reps!=null?e.reps:'',carico:e.carico||'',rec:e.rec||'',nota:e.nota||''};
      })};
    }).filter(function(g){return g.esercizi.length>0;});
    return {cliente:data.cliente||'',ptNome:data.ptNome||'',programma:sa.programma||'',giorni:giorni};
  }

  // ── EVENTS ──
  $('btnSave').addEventListener('click',salva);
  $('dataSeduta').addEventListener('change',function(){stato.dataSeduta=this.value;salvaStato();});
  $('daySelect').addEventListener('change',function(){
    giornoAttivo=+this.value;
    if(!stato.giorni[giornoAttivo]){
      // Inizializza il giorno se non esiste (es. switch tra giorni)
      stato.giorni[giornoAttivo]={esercizi:{}};
      var g=SCHEDA.giorni[giornoAttivo];
      (g.esercizi||[]).forEach(function(e,ei){
        if(isTimed(e.reps))stato.giorni[giornoAttivo].esercizi[ei]={done:false,timed:true,sets:Array.from({length:e.serie||1},function(){return {sec:'',fatto:false};})};
        else stato.giorni[giornoAttivo].esercizi[ei]={done:false,timed:false,sets:Array.from({length:e.serie||1},function(){return {reps:'',kg:'',rpe:''};})};
      });
      salvaStato();
    }
    renderExerciseList();
  });

  // ── INIT ──
  function init(){
    SHARE_ID=getShareId();
    if(!SHARE_ID){mostraErrore('Link non valido.');return;}
    fbDb.collection('sharedClients').doc(SHARE_ID).get({source:'server'}).catch(function(){
      // fallback offline
      return fbDb.collection('sharedClients').doc(SHARE_ID).get();
    }).then(function(doc){
      if(!doc.exists){mostraErrore('Scheda non trovata. Controlla il link.');return;}
      var data=doc.data();
      if(data.attivo===false){mostraErrore('Questo link non è più attivo. Contatta il tuo personal trainer.');return;}
      SCHEDA=adatta(data);
      if(!SCHEDA.giorni.length){mostraErrore('La scheda non contiene esercizi. Contatta il tuo personal trainer.');return;}
      if(giornoAttivo>=SCHEDA.giorni.length)giornoAttivo=0;
      stato=initStato();
      try{render();}
      catch(errRender){
        console.warn('[share] render error:',errRender);
        mostraErrore('Si è verificato un problema nel mostrare la scheda. Contatta il tuo personal trainer.');
      }
    }).catch(function(e){
      console.warn('[share] init error:',e);
      mostraErrore('Errore di connessione. Riprova.');
    });
  }

  // Se la pagina viene ripristinata dalla cache del browser/PWA (back-forward),
  // forza un ricaricamento fresco così non resta su una versione vecchia.
  window.addEventListener('pageshow',function(ev){if(ev.persisted){location.reload();}});

  init();
})();
</script>
</body>
</html>
