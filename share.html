<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>La tua scheda · PT Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --ink:#0f172a;
    --muted:#64748b;
    --dim:#94a3b8;
    --line:#e8edf5;
    --blue:#2563eb;
    --blue-soft:#eff4ff;
    --green:#059669;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:'DM Sans',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.5;
    padding:0 0 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  .topbar{
    background:var(--ink);
    color:#fff;
    padding:18px 0 20px;
    position:sticky;top:0;z-index:10;
    box-shadow:0 2px 16px rgba(15,23,42,.18);
  }
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:900;font-size:19px;letter-spacing:-.5px;display:flex;align-items:center;gap:7px}
  .logo .pt{color:#60a5fa}
  .logo-badge{width:26px;height:26px;border-radius:7px;background:var(--blue);display:grid;place-items:center;font-size:13px}
  .topbar .lang{font-size:12px;color:#94a3b8;font-weight:500}
  .hero{
    background:linear-gradient(135deg,#1e293b,#0f172a);
    color:#fff;
    border-radius:0 0 22px 22px;
    padding:6px 0 26px;
    margin-bottom:-14px;
  }
  .hero .wrap{padding-top:6px}
  .hero h1{font-size:23px;font-weight:900;letter-spacing:-.4px;margin-bottom:3px}
  .hero .sub{font-size:13px;color:#cbd5e1;font-weight:500}
  .hero .pt-by{
    margin-top:16px;display:inline-flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
    padding:7px 13px;border-radius:100px;font-size:12.5px;color:#e2e8f0;font-weight:500;
  }
  .hero .pt-by .dot{width:7px;height:7px;border-radius:50%;background:#34d399}
  .meta{display:flex;gap:10px;margin:26px 0 18px}
  .meta .chip{
    flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:13px 12px;text-align:center;box-shadow:var(--shadow);
  }
  .meta .chip .n{font-size:20px;font-weight:900;color:var(--ink);letter-spacing:-.5px}
  .meta .chip .l{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
  .day{margin-bottom:22px}
  .day-head{display:flex;align-items:center;gap:10px;margin:0 4px 12px}
  .day-head .badge{
    width:34px;height:34px;border-radius:10px;background:var(--blue);color:#fff;
    display:grid;place-items:center;font-weight:900;font-size:14px;flex-shrink:0;
    box-shadow:0 4px 12px rgba(37,99,235,.3);
  }
  .day-head h2{font-size:16px;font-weight:700;letter-spacing:-.3px}
  .day-head .meta-day{font-size:12px;color:var(--dim);font-weight:500}
  .ex{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:15px 16px;margin-bottom:10px;box-shadow:var(--shadow);
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .ex:active{transform:scale(.992)}
  .ex-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:13px}
  .ex-name{font-size:15px;font-weight:700;letter-spacing:-.2px;line-height:1.3}
  .ex-num{
    font-size:11px;font-weight:800;color:var(--blue);background:var(--blue-soft);
    padding:3px 8px;border-radius:7px;flex-shrink:0;
  }
  .ex-muscles{font-size:11.5px;color:var(--dim);font-weight:500;margin-top:1px}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .stat{
    background:#f8fafc;border:1px solid var(--line);border-radius:11px;
    padding:9px 6px;text-align:center;
  }
  .stat .v{font-size:18px;font-weight:900;color:var(--ink);letter-spacing:-.5px;line-height:1}
  .stat .v .u{font-size:11px;font-weight:700;color:var(--muted)}
  .stat .k{font-size:9.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:5px}
  .stat.accent{background:var(--blue-soft);border-color:#dbe7ff}
  .stat.accent .v{color:var(--blue)}
  .ex-note{
    margin-top:11px;font-size:12px;color:var(--muted);font-weight:500;
    background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:8px 11px;
    display:flex;gap:7px;align-items:flex-start;
  }
  .ex-note .i{flex-shrink:0}
  .foot{text-align:center;margin-top:34px;padding:0 20px}
  .foot .made{
    display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);
    font-weight:600;background:var(--card);border:1px solid var(--line);
    padding:9px 16px;border-radius:100px;box-shadow:var(--shadow);
  }
  .foot .made .pt{color:var(--blue);font-weight:900}
  .foot .disc{font-size:11px;color:var(--dim);margin-top:14px;line-height:1.5;font-weight:500}
  .ex,.meta .chip,.day-head{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .loading{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px;font-weight:500}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--ink);color:#fff;font-size:13px;font-weight:600;
    padding:11px 20px;border-radius:100px;box-shadow:0 4px 20px rgba(15,23,42,.2);
    transition:transform .25s cubic-bezier(.2,.7,.2,1);z-index:99;white-space:nowrap;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.ok{background:var(--green)}
  .toast.err{background:#dc2626}
</style>
</head>
<body>
  <div class="topbar">
    <div class="wrap">
      <div class="logo"><span class="logo-badge">📋</span><span><span class="pt">PT</span>Board</span></div>
      <span class="lang">🇮🇹 IT</span>
    </div>
  </div>
  <div class="hero">
    <div class="wrap">
      <h1 id="cliente">…</h1>
      <div class="sub" id="programma">Caricamento scheda…</div>
      <div class="pt-by"><span class="dot"></span><span>Preparato da <b id="pt-nome">…</b></span></div>
    </div>
  </div>
  <div class="wrap">
    <div class="meta">
      <div class="chip"><div class="n" id="m-sedute">—</div><div class="l">Sedute/sett</div></div>
      <div class="chip"><div class="n" id="m-durata">—</div><div class="l">Durata</div></div>
      <div class="chip"><div class="n" id="m-settimane">—</div><div class="l">Settimane</div></div>
    </div>
    <div id="giorni"><div class="loading">Caricamento scheda…</div></div>
    <div class="foot">
      <div class="made">Creato con <span class="pt">PT&nbsp;Board</span></div>
      <div class="disc">Questa scheda è personale e preparata dal tuo personal trainer.<br>Esegui gli esercizi secondo le indicazioni ricevute.</div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
<script>
  /* ── FIREBASE INIT (no auth, no persistence) ── */
  firebase.initializeApp({
    apiKey:"AIzaSyC2cyMakGET5yBCCVgrnn6H_3Skn7g39hc",
    authDomain:"ptboard-1.firebaseapp.com",
    projectId:"ptboard-1",
    storageBucket:"ptboard-1.firebasestorage.app",
    messagingSenderId:"223801010947",
    appId:"1:223801010947:web:9c3f887243609bcdad9736"
  });
  var fbDb = firebase.firestore();

  /* ── SHARE ID ── */
  function getShareId(){
    var p = new URLSearchParams(location.search);
    if(p.get('id')) return p.get('id');
    var m = location.pathname.match(/\/s\/([^\/?#]+)/);
    if(m) return m[1];
    var stored = sessionStorage.getItem('shareId');
    if(stored){ sessionStorage.removeItem('shareId'); return stored; }
    return null;
  }

  /* ── ERRORE SCHERMATA ── */
  function mostraErrore(msg){
    document.body.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;'+
      'align-items:center;justify-content:center;font-family:DM Sans,sans-serif;padding:40px;text-align:center;color:#0f172a">'+
      '<div style="font-size:40px;margin-bottom:12px">📋</div>'+
      '<div style="font-size:18px;font-weight:800;margin-bottom:8px">PT Board</div>'+
      '<div style="font-size:14px;color:#64748b;max-width:300px">'+msg+'</div></div>';
  }

  /* ── TOAST ── */
  var _toastTimer;
  function showToast(msg, type){
    var el = document.getElementById('toast');
    if(!el) return;
    el.textContent = msg;
    el.className = 'toast show' + (type === 'ok' ? ' ok' : type === 'err' ? ' err' : '');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function(){ el.className = 'toast'; }, 3000);
  }

  /* ── SALVATAGGIO SU FIREBASE ──
     ATTENZIONE: il client non loggato puo aggiornare SOLO log + updatedAt
     (regola Firestore Tappa 3). Non includere altri campi nell'update. */
  async function salvaSuFirebase(shareId, giornoNome, esercizi){
    var entry = {
      data: new Date().toLocaleDateString('it-IT'),
      giorno: giornoNome,
      esercizi: esercizi,
      ts: Date.now()
    };
    try{
      await fbDb.collection('sharedClients').doc(shareId).update({
        log: firebase.firestore.FieldValue.arrayUnion(entry),
        updatedAt: Date.now()
      });
      // backup locale (fallback se connessione cade in futuro)
      try{
        var key = 'ptb_share_' + shareId;
        var prev = JSON.parse(localStorage.getItem(key) || '[]');
        prev.push(entry);
        localStorage.setItem(key, JSON.stringify(prev));
      }catch(_){}
      return true;
    }catch(e){
      // salva comunque in localStorage come backup
      try{
        var key2 = 'ptb_share_' + shareId;
        var prev2 = JSON.parse(localStorage.getItem(key2) || '[]');
        prev2.push(entry);
        localStorage.setItem(key2, JSON.stringify(prev2));
      }catch(_){}
      return false;
    }
  }

  /* ── ADAPTER: mappa i dati Firestore alla forma che render() si aspetta ── */
  function adattaDaFirestore(data){
    var sa = data.schedaAttuale || {};
    return {
      cliente:    data.cliente || '',
      ptNome:     data.ptNome || '',
      programma:  sa.programma || '',
      seduteSett: sa.seduteSett || sa.sedute || '—',
      durata:     sa.durata || '—',
      settimane:  sa.settimane || '—',
      giorni:     sa.giorni || []
    };
  }

  /* ── RENDER (UI invariata rispetto alla versione mock) ── */
  function render(d){
    document.getElementById('cliente').textContent = d.cliente;
    document.getElementById('pt-nome').textContent = d.ptNome;
    document.getElementById('programma').textContent = d.programma;
    document.getElementById('m-sedute').textContent = d.seduteSett;
    document.getElementById('m-durata').textContent = d.durata;
    document.getElementById('m-settimane').textContent = d.settimane;
    var cont = document.getElementById('giorni');
    var letters = ['A','B','C','D','E','F'];
    cont.innerHTML = d.giorni.map(function(g, gi){ return (
      '<div class="day">'+
        '<div class="day-head" style="animation-delay:'+( gi*.06)+'s">'+
          '<div class="badge">'+(letters[gi]||(gi+1))+'</div>'+
          '<div>'+
            '<h2>'+esc(g.nome)+'</h2>'+
            '<div class="meta-day">'+esc(g.focus||'')+'</div>'+
          '</div>'+
        '</div>'+
        g.esercizi.map(function(e, ei){ return (
          '<div class="ex" style="animation-delay:'+((gi*.06)+(ei*.04))+'s">'+
            '<div class="ex-top">'+
              '<div>'+
                '<div class="ex-name">'+esc(e.nome)+'</div>'+
                '<div class="ex-muscles">'+esc(e.muscoli||'')+'</div>'+
              '</div>'+
              '<div class="ex-num">'+(ei+1)+'</div>'+
            '</div>'+
            '<div class="grid">'+
              '<div class="stat"><div class="v">'+esc(String(e.serie))+'</div><div class="k">Serie</div></div>'+
              '<div class="stat"><div class="v">'+esc(String(e.reps))+'</div><div class="k">Reps</div></div>'+
              '<div class="stat accent"><div class="v">'+fmtCarico(e.carico)+'</div><div class="k">Carico</div></div>'+
            '</div>'+
            (e.nota ? '<div class="ex-note"><span class="i">💡</span><span>'+esc(e.nota)+'</span></div>' : '')+
          '</div>'
        );}).join('')+
      '</div>'
    );}).join('');
  }

  function fmtCarico(c){
    var m = String(c).match(/^([\d.,]+)\s*kg$/i);
    if(m) return m[1]+'<span class="u"> kg</span>';
    return esc(String(c));
  }
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);});}

  /* ── INIT ──
     Per testare con un documento reale:
     1. Firebase Console → Firestore → crea collection "sharedClients"
     2. Documento con id "test-demo", campi:
        ownerUid:"qualsiasi", cliente:"Mario", ptNome:"Steve", attivo:true,
        schedaAttuale:{programma:"Full Body", seduteSett:3, durata:"60'",
          settimane:4, giorni:[{nome:"Full Body A", focus:"Forza · 3 esercizi",
          esercizi:[{nome:"Squat",muscoli:"Quadricipiti",serie:4,reps:"8",carico:"60 kg",rec:"180s",nota:""}]}]},
        log:[]
     3. Aprire share.html?id=test-demo (localhost deve essere autorizzato in Firebase) */
  async function init(){
    var shareId = getShareId();
    if(!shareId){ mostraErrore('Link non valido.'); return; }
    try{
      var doc = await fbDb.collection('sharedClients').doc(shareId).get();
      if(!doc.exists){ mostraErrore('Scheda non trovata. Controlla il link.'); return; }
      var data = doc.data();
      if(data.attivo === false){ mostraErrore('Questo link non è più attivo. Contatta il tuo personal trainer.'); return; }
      render(adattaDaFirestore(data));
    }catch(e){
      mostraErrore('Errore di connessione. Riprova.');
    }
  }

  init();
</script>
</body>
</html>
