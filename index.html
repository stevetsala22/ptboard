var checkOnboardingEmails=async function(uid,profile){
  if(!profile||!profile.email)return;
  if(!profile.createdAt)return;
  var created=profile.createdAt;
  if(typeof created==='string')created=new Date(created);
  if(created.toDate)created=created.toDate();
  var now=new Date();
  var daysSinceReg=Math.floor((now-created)/(1000*60*60*24));
  var sentEmails=profile.onboardingSent||{};
  var hasActivePlan=profile.plan&&profile.plan!=='trial'&&profile.planExpiresAt&&new Date(profile.planExpiresAt)>now;
  var toSend=ONBOARDING_EMAILS.filter(function(e){
    if(daysSinceReg<e.day||sentEmails[e.key])return false;
    if(e.requireNoActivePlan&&hasActivePlan)return false;
    return true;
  });
  if(toSend.length===0)return;
  var trainerName=profile.nome||(profile.email.split('@')[0]);
  for(var i=0;i<toSend.length;i++){
    var e=toSend[i];
    var result=await sendBrevoEmail(profile.email,trainerName,e.templateId);
    if(result.ok){
      sentEmails[e.key]=new Date().toISOString();
      console.log('Onboarding email sent:',e.key,'to',profile.email);
    }

  await fbDb.collection('users').doc(uid).update({onboardingSent:sentEmails});
};

<script>
var ttTimer=null;
document.addEventListener('mouseover',function(e){
  var wrap=e.target.closest('.tt');
  if(!wrap)return;
  var tp=wrap.querySelector('.tp');
  if(!tp)return;
  if(ttTimer)clearTimeout(ttTimer);
  ttTimer=setTimeout(function(){
    var rect=wrap.getBoundingClientRect();
    var tw=tp.offsetWidth||150;
    var th=tp.offsetHeight||28;
    var mg=8;
    var vw=window.innerWidth;
    var vh=window.innerHeight;
    var top=rect.bottom+mg;
    var left=rect.left+rect.width/2-tw/2;
    if(left+tw>vw-mg)left=vw-tw-mg;
    if(left<mg)left=mg;
    if(top+th>vh-mg)top=rect.top-th-mg;
    tp.style.top=top+'px';
    tp.style.left=left+'px';
    tp.style.opacity='1';
  },800);
});
document.addEventListener('mouseout',function(e){
  var wrap=e.target.closest('.tt');
  if(!wrap)return;
  if(ttTimer){clearTimeout(ttTimer);ttTimer=null;}
  var tp=wrap.querySelector('.tp');
  if(tp)tp.style.opacity='0';
});
</script>

  if(!profile) return false;
  if(profile.plan==='pro'||profile.plan==='team'||profile.plan==='admin') return false;
  if(!profile.trialStart) return false;
  const days=(Date.now()-profile.trialStart)/(1000*60*60*24);
  return days>TRIAL_DAYS;
};
const trialDaysLeft=(profile)=>{
  if(!profile?.trialStart) return TRIAL_DAYS;
  const used=(Date.now()-profile.trialStart)/(1000*60*60*24);
  return Math.max(0,Math.ceil(TRIAL_DAYS-used));
};

    const b=bmi(p.peso,p.altezza);
    const pr=profilo(p.test?.mwtDist,p.test?.stsRip,p.sesso,p.test,{biaFM:p.bia?.FM},p.annoNascita?new Date().getFullYear()-p.annoNascita:50);
    return [p.id,p.cognome,p.nome,p.sesso,p.ddn,p.altezza,p.peso,b||'',pr?.code||'',p.attivita,p.obiettivo,p.patologie,p.farmaci,p.test?.mwtDist,p.test?.stsRip,p.log?.length||0,p.dataValutazione].map(v=>{
      const s=String(v??'');
      return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.split('"').join('""')+'"':s;
    });
  });
  const csv=[headers.join(','),...rows.map(r=>r.join(','))].join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='clienti_ptboard_'+fmtDate().replace(/\//g,'-')+'.csv';
  a.click();URL.revokeObjectURL(url);
};

    normFumoNoneL:'Non fumatore',normFumoExL:'Ex fumatore',normFumoLightL:'Fumatore leggero (<10/die)',normFumoModL:'Fumatore moderato (10-20/die)',normFumoHeavyL:'Fumatore pesante (>20/die)',normFumoNoneCons:'Nessun impatto da fumo su VO2max e FC. Capacità aerobica non limitata da fattori tabagici.',normFumoExCons:'Benefici progressivi dopo cessazione: FC normalizzata in 2-12 settimane, VO2max +10-15% in 3-9 mesi, funzione polmonare migliorata in 1-9 mesi (AHA). Allenamento aerobico accelera il recupero. Progressione normale del programma.',normFumoLightCons:'Impatto: VO2max ridotto ~5-8%, FC a riposo +5-10 bpm (↑ attivazione simpatica), COHb 3-5% → ridotta capacità di trasporto O2. Soglia anaerobica anticipata. Adattamento: ridurre intensità aerobica attesa del 10%, allungare fasi di riscaldamento, monitorare SpO2. Motivare alla cessazione.',normFumoModCons:'Impatto significativo: VO2max ridotto ~10-15%, FC riposo +10-15 bpm, COHb 5-8%. Ridotta clearance mucociliare, maggiore dispnea da sforzo. Adattamento: FC target calcolata -10%, evitare esercizio intenso in ambienti freddi, pause più frequenti, monitorare SpO2 e sintomi. Forte raccomandazione cessazione — invio centro antifumo.',normFumoHeavyCons:'⚠️ Impatto severo: VO2max ridotto 15-25%, FC riposo +15-20 bpm, COHb >8%. Rischio eventi cardiaci aumentato durante esercizio. Adattamento: SOLO attività leggera (camminata, cyclette bassa intensità), RPE ≤4, monitoraggio PA/FC costante, evitare sforzi massimali. Clearance cardiologica consigliata. Cessazione fumo è la priorità clinica n.1.',normSmokeDefault:'Stato fumo registrato.',
    normAlcolNoneL:'Astemio',normAlcolOccL:'Bevitore occasionale (1-2/settimana)',normAlcolModL:'Bevitore moderato (3-7/settimana)',normAlcolHighL:'Consumo elevato (>7/settimana)',normAlcolNoneCons:'Nessun impatto da alcol su recupero e metabolismo. Ottimale per performance e composizione corporea.',normAlcolOccCons:'Impatto minimo se ≤2 unità/occasione. Evitare alcol nelle 24h post-allenamento intenso (riduce sintesi proteica muscolare del 24%, Parr 2014). Preferire giornate di riposo. Idratazione extra.',normAlcolModCons:'Impatto: riduzione sintesi proteica muscolare fino a 37% post-esercizio (Parr 2014), ↓ testosterone 6-10%, disturbo sonno REM → recupero compromesso, ~7 kcal/g (calorie vuote). Adattamento: pianificare allenamenti lontano da consumo, aumentare proteine +20%, non bere nelle 4h post-workout, conteggiare kcal da alcol nel bilancio. Obiettivo: ridurre a occasionale.',normAlcolHighCons:'⚠️ Impatto severo: ↓ sintesi proteica muscolare fino a 50%, ↓ testosterone 15-20%, ↓ GH notturno, steatosi epatica → metabolismo lipidico compromesso, disidratazione cronica, ↑ cortisolo. Recupero muscolare gravemente compromesso (Lakicevic 2019). Adattamento: ridurre intensità attesa, focus su volume basso, idratazione prioritaria. Forte raccomandazione riduzione/cessazione — invio a supporto se necessario.',normAlcolDefault:'Consumo alcol registrato.',
    normPhaLowL:'Critico — rischio sarcopenia',normPhaLowCons:'PhA {v}° molto basso (soglia critica {sarco}°). Indica perdita integrità cellulare, possibile sarcopenia o malnutrizione (Norman 2012). Priorità: screening nutrizionale completo, apporto proteico ≥1.5 g/kg/die, allenamento resistenza 3×/settimana. Consultare specialista.',normPhaBelowL:'Sotto la media',normPhaBelowCons:'PhA {v}° inferiore alla media per età/sesso (rif. {ref}°, Bosy-Westphal 2006). Possibile riduzione massa cellulare. Aumentare apporto proteico, allenamento di forza progressivo, verificare idratazione.',normPhaNormL:'Nella norma',normPhaNormCons:'PhA {v}° nella norma (rif. {ref}°). Buona integrità cellulare e stato nutrizionale. Mantenere allenamento e alimentazione bilanciata.',normPhaHighL:'Sopra la media',normPhaHighCons:'PhA {v}° eccellente (> media {ref}°). Indica alta massa cellulare e ottimo stato nutrizionale. Tipico di soggetti allenati.',
    normEcwOptL:'Ottimo — buona distribuzione idrica',normEcwOptCons:'ECW/TBW {v} indica ottima distribuzione idrica intracellulare. Tipico di soggetti ben idratati e con buona massa muscolare.',normEcwNormL:'Normale',normEcwNormCons:'ECW/TBW {v} nella norma (0.36-0.39, Kyle 2004). Equilibrio idrico adeguato.',normEcwMildL:'Lieve ritenzione',normEcwMildCons:'ECW/TBW {v} leggermente elevato. Possibile ritenzione idrica lieve. Ridurre sodio, aumentare potassio (frutta, verdura), camminata quotidiana 30 min, drenaggio linfatico se sedentario. Verificare apporto idrico ≥2L/die.',normEcwModL:'Ritenzione moderata',normEcwModCons:'ECW/TBW {v} elevato — ritenzione idrica moderata. Possibili cause: insufficienza venosa, dieta ipersodica, sedentarietà, farmaci. Elevare arti inferiori, compressione graduata, ridurre sodio <2g/die. Consultare medico se persistente.',normEcwSevL:'Ritenzione severa',normEcwSevCons:'⚠️ ECW/TBW {v} molto elevato (>0.45). Edema significativo — consultazione medica necessaria prima di programmare esercizio. Escludere cause cardiache, renali, epatiche.',
    normFmEssL:'Grasso essenziale',normFmAthL:'Atletico',normFmFitL:'Fitness',normFmAccL:'Accettabile',normFmExcL:'Eccesso',normFmMEssCons:'FM% sotto il minimo essenziale maschile (2-5%). Rischio ormonale (↓testosterone), immunitario e metabolico. Non sostenibile a lungo termine. Aumentare gradualmente intake calorico.',normFmMAthCons:'FM% da atleta (6-13% ACSM). Ottimo per performance. Mantenere con alimentazione bilanciata e monitoraggio periodico.',normFmMFitCons:'FM% nella fascia fitness (14-17% ACE). Eccellente per salute e performance. Composizione corporea ideale.',normFmMAccCons:'FM% accettabile (18-24%). Per migliorare: deficit calorico moderato (-300/400 kcal), allenamento di forza 3×/settimana + cardio LISS 150 min/settimana.',normFmMExcCons:'FM% {v}% elevata (>25% uomini). Rischio cardiometabolico aumentato. Piano: deficit calorico controllato, allenamento combinato forza+cardio, obiettivo -0.5 kg/settimana. Monitorare circonferenza vita.',normFmFEssCons:"FM% sotto il minimo essenziale femminile (10-13%). Rischio amenorrea, osteoporosi, triade dell'atleta. Aumentare intake calorico, consultare endocrinologo.",normFmFAthCons:'FM% da atleta (14-20% ACSM). Eccellente per performance sportiva. Monitorare ciclo mestruale e densità ossea.',normFmFFitCons:'FM% nella fascia fitness (21-24% ACE). Composizione corporea ideale per salute e performance.',normFmFAccCons:'FM% accettabile (25-31%). Per migliorare: deficit calorico moderato, allenamento di forza 3×/settimana + cardio 150 min/settimana.',normFmFExcCons:'FM% {v}% elevata (>32% donne). Rischio cardiometabolico. Piano: deficit calorico controllato, allenamento combinato, obiettivo -0.5 kg/settimana.',
    normParqLowL:'Rischio basso — clearance OK',normParqMidL:'Rischio moderato',normParqHighL:'Rischio elevato',normParqVeryHighL:'Rischio alto — clearance medica obbligatoria',normParqLowCons:'Nessuna risposta positiva al PAR-Q. Il cliente può iniziare un programma di attività fisica da lieve a moderata senza clearance medica aggiuntiva. Monitorare sintomi durante esercizio.',normParqMidConsSg:'1 risposta positiva al PAR-Q. Consigliata clearance medica prima di attività vigorosa (>6 METs). Può procedere con attività leggera-moderata sotto supervisione. Adattare intensità e monitorare PA e FC durante esercizio.',normParqMidConsPl:'{v} risposte positive al PAR-Q. Consigliata clearance medica prima di attività vigorosa (>6 METs). Può procedere con attività leggera-moderata sotto supervisione. Adattare intensità e monitorare PA e FC durante esercizio.',normParqHighCons:'{v} risposte positive al PAR-Q. Clearance medica obbligatoria prima di qualsiasi programma. Iniziare solo dopo autorizzazione scritta del medico. Preferire attività supervisionata, bassa intensità, con monitoraggio costante.',normParqVeryHighCons:"⚠️ {v} risposte positive al PAR-Q. NON iniziare esercizio senza clearance medica completa (ECG sforzo, visita cardiologica se indicato). Possibili controindicazioni assolute all'esercizio non supervisionato.",

    normColNormL:'Curve fisiologiche normali',normColNormCons:'Allineamento nella norma. Mantenere con: core stability (plank, dead bug, bird dog), mobilità toracica, stretching psoas e pettorali.',normColLordL:'Iperlordosi lombare',normColLordCons:'Lordosi lombare accentuata → compressione faccette articolari, rischio lombalgia. Cause comuni: debolezza core + glutei, accorciamento flessori anca. Correttivi: plank 3×30s, glute bridge 3×12, stretching psoas (Thomas stretch) 3×30s/lato, dead bug 3×8, evitare iperestensione in back squat.',normColKyphL:'Ipercifosi dorsale',normColKyphCons:'Cifosi toracica accentuata → spalle protratte, ridotta capacità respiratoria, rischio cervicalgia. Correttivi: foam roller estensione toracica 2×10, face pull 3×15, wall angel 3×10, stretching pettorali a muro 3×30s, rowing con focus retrazione scapolare.',normColFlatL:'Dorso piatto',normColFlatCons:'Riduzione curve fisiologiche → minore assorbimento impatti, rigidità. Correttivi: mobilità segmentale colonna (cat-cow 3×10), estensioni toraciche su foam roller, esercizi in flessione-estensione controllata, nuoto.',normColScol1L:'Scoliosi lieve',normColScol1Cons:'Deviazione laterale lieve → squilibri muscolari, carichi asimmetrici. Correttivi: esercizi simmetrici di rinforzo (plank, pallof press), allungamento lato concavo, side plank lato convesso, monitorare progressione. Evitare carichi assiali pesanti asimmetrici.',normColScol2L:'Scoliosi moderata',normColScol2Cons:'⚠️ Deviazione laterale significativa — necessaria valutazione ortopedica. Esercizio sotto supervisione: rinforzo simmetrico core, evitare carichi assiali elevati, preferire esercizi in scarico (nuoto, cyclette). Metodo Schroth se indicato.',normColDefault:'Valutazione posturale registrata. Monitorare nel tempo.',
    normShalNormL:'Allineamento normale',normShalNormCons:'Spalle allineate, buon equilibrio rotatori. Mantenere con: face pull, external rotation, band pull-apart regolari.',normShalProtL:'Spalle protratte (arrotondate)',normShalProtCons:'Accorciamento pettorali e subscapolare, debolezza trapezio medio/inferiore e romboidi. Rischio impingement e cervicalgia. Correttivi: stretching pettorali a muro 3×30s, face pull 3×15, band pull-apart 3×15, rowing con pausa in retrazione 3×10, prone Y-T-W 2×8, ridurre volume push a favore di pull (ratio 2:1 pull:push).',normShalRaisL:'Spalle elevate (trapezio ipertonico)',normShalRaisCons:'Ipertono trapezio superiore, spesso legato a stress/postura da scrivania. Rischio cefalea tensiva e cervicalgia. Correttivi: rilascio trapezio con pallina 2 min/lato, stretching scaleni e trapezio 3×30s, shrug inversi alla sbarra, respirazione diaframmatica 5 min/giorno, evitare shrug con carico.',normShalAsymL:'Asimmetria scapolare',normShalAsymCons:'Dislivello scapolare → possibile scoliosi, disfunzione scapolo-toracica. Correttivi: lavoro unilaterale (single-arm row, single-arm press), serratus punch 3×12, mobilità scapolare (wall slide), valutare se origine vertebrale o muscolare. Se marcata, invio a fisioterapista.',normShalDefault:'Postura spalle registrata. Monitorare nel tempo.',
    normMobOptL:'Ottima mobilità',normMobRedL:'Ridotta',normMobVeryRedL:'Molto ridotta',normAnkOptCons:'Dorsiflessione eccellente (≥12 cm wall test). Nessuna limitazione per squat profondo, corsa e salti.',normAnkNormCons:'Mobilità caviglia nella norma (≥10 cm). Sufficiente per squat e corsa. Mantenere con: calf stretch 3×30s, mobilità con banda elastica.',normAnkRedCons:'Mobilità caviglia ridotta (7-9 cm). Limita profondità squat e biomeccanica corsa (sovraccarico ginocchio/anca). Correttivi: calf stretch a muro 3×30s, banded ankle distraction 2×1min, squat con rialzo talloni temporaneo, foam roll polpacci 2 min.',normAnkVeryRedCons:'Mobilità caviglia molto ridotta (<7 cm). Impatto significativo su squat (compenso lombare), corsa (rischio periostite/tendinopatia achilleo), equilibrio. Correttivi quotidiani: mobilità articolare con banda, stretching soleo e gastrocnemio 4×30s, esercizi eccentrici polpacci. Usare rialzo talloni in squat. Valutare rigidità articolare (fisioterapista).',normHipOptCons:'Flessione anca completa (≥120°). Nessuna limitazione per squat, deadlift, corsa. Mantenere con: 90/90 stretch, pigeon pose.',normHipNormCons:'Mobilità anca buona (100-119°). Sufficiente per la maggior parte degli esercizi. Stretching psoas e piriforme regolare per mantenere.',normHipRedCons:'Mobilità anca ridotta (80-99°). Impatto su squat profondo e deadlift (compenso lombare = rischio ernia). Correttivi: psoas stretch half-kneeling 3×30s, piriforme 3×30s, 90/90 hip switch 2×8, frog stretch 3×30s, goblet squat con pausa 3×8. Rischio lombalgia aumentato (Ellison 1990).',normHipVeryRedCons:"Mobilità anca molto ridotta (<80°). Rischio elevato lombalgia cronica (hip-spine syndrome). Evitare: squat sotto parallelo, deadlift convenzionale pesante. Correttivi quotidiani: stretching flessori anca 4×30s, mobilità quadrupedia (rocking), piriforme con banda, Thomas stretch. Valutare FAI — ortopedico se dolore.",

    normFumoNoneL:'Non-smoker',normFumoExL:'Ex-smoker',normFumoLightL:'Light smoker (<10/day)',normFumoModL:'Moderate smoker (10-20/day)',normFumoHeavyL:'Heavy smoker (>20/day)',normFumoNoneCons:'No smoking impact on VO2max and HR. Aerobic capacity not limited by tobacco factors.',normFumoExCons:'Progressive benefits after cessation: HR normalised in 2-12 weeks, VO2max +10-15% in 3-9 months, lung function improved in 1-9 months (AHA). Aerobic training accelerates recovery. Normal programme progression.',normFumoLightCons:'Impact: VO2max reduced ~5-8%, resting HR +5-10 bpm (↑ sympathetic activation), COHb 3-5% → reduced O2 transport capacity. Anaerobic threshold earlier. Adaptation: reduce expected aerobic intensity by 10%, extend warm-up phases, monitor SpO2. Motivate towards cessation.',normFumoModCons:'Significant impact: VO2max reduced ~10-15%, resting HR +10-15 bpm, COHb 5-8%. Reduced mucociliary clearance, greater exertional dyspnoea. Adaptation: calculated target HR -10%, avoid intense exercise in cold environments, more frequent breaks, monitor SpO2 and symptoms. Strong cessation recommendation — referral to smoking cessation centre.',normFumoHeavyCons:'⚠️ Severe impact: VO2max reduced 15-25%, resting HR +15-20 bpm, COHb >8%. Increased risk of cardiac events during exercise. Adaptation: ONLY light activity (walking, low-intensity cycling), RPE ≤4, constant BP/HR monitoring, avoid maximal efforts. Cardiology clearance advised. Smoking cessation is clinical priority #1.',normSmokeDefault:'Smoking status recorded.',
    normAlcolNoneL:'Non-drinker',normAlcolOccL:'Occasional drinker (1-2/week)',normAlcolModL:'Moderate drinker (3-7/week)',normAlcolHighL:'High consumption (>7/week)',normAlcolNoneCons:'No alcohol impact on recovery and metabolism. Optimal for performance and body composition.',normAlcolOccCons:'Minimal impact if ≤2 units/occasion. Avoid alcohol within 24h after intense training (reduces muscle protein synthesis by 24%, Parr 2014). Prefer rest days. Extra hydration.',normAlcolModCons:'Impact: reduction in muscle protein synthesis up to 37% post-exercise (Parr 2014), ↓ testosterone 6-10%, REM sleep disruption → compromised recovery, ~7 kcal/g (empty calories). Adaptation: schedule training away from consumption, increase protein +20%, no drinking within 4h post-workout, count alcohol kcal in balance. Goal: reduce to occasional.',normAlcolHighCons:'⚠️ Severe impact: ↓ muscle protein synthesis up to 50%, ↓ testosterone 15-20%, ↓ nocturnal GH, hepatic steatosis → compromised lipid metabolism, chronic dehydration, ↑ cortisol. Muscle recovery severely compromised (Lakicevic 2019). Adaptation: reduce expected intensity, focus on low volume, hydration priority. Strong reduction/cessation recommendation — referral to support if needed.',normAlcolDefault:'Alcohol consumption recorded.',
    normPhaLowL:'Critical — sarcopaenia risk',normPhaLowCons:'PhA {v}° very low (critical threshold {sarco}°). Indicates loss of cell integrity, possible sarcopaenia or malnutrition (Norman 2012). Priority: full nutritional screening, protein intake ≥1.5 g/kg/day, resistance training 3×/week. Consult specialist.',normPhaBelowL:'Below average',normPhaBelowCons:'PhA {v}° below average for age/sex (ref. {ref}°, Bosy-Westphal 2006). Possible reduction in cell mass. Increase protein intake, progressive strength training, verify hydration.',normPhaNormL:'Within normal range',normPhaNormCons:'PhA {v}° within normal range (ref. {ref}°). Good cell integrity and nutritional status. Maintain training and balanced diet.',normPhaHighL:'Above average',normPhaHighCons:'PhA {v}° excellent (> average {ref}°). Indicates high cell mass and excellent nutritional status. Typical of trained individuals.',
    normEcwOptL:'Excellent — good water distribution',normEcwOptCons:'ECW/TBW {v} indicates excellent intracellular water distribution. Typical of well-hydrated individuals with good muscle mass.',normEcwNormL:'Normal',normEcwNormCons:'ECW/TBW {v} within normal range (0.36-0.39, Kyle 2004). Adequate water balance.',normEcwMildL:'Mild retention',normEcwMildCons:'ECW/TBW {v} slightly elevated. Possible mild water retention. Reduce sodium, increase potassium (fruit, vegetables), 30 min daily walk, lymphatic drainage if sedentary. Verify fluid intake ≥2L/day.',normEcwModL:'Moderate retention',normEcwModCons:'ECW/TBW {v} elevated — moderate water retention. Possible causes: venous insufficiency, high-sodium diet, sedentary lifestyle, medications. Elevate lower limbs, graduated compression, reduce sodium <2g/day. Consult doctor if persistent.',normEcwSevL:'Severe retention',normEcwSevCons:'⚠️ ECW/TBW {v} very high (>0.45). Significant oedema — medical consultation required before scheduling exercise. Rule out cardiac, renal, hepatic causes.',
    normFmEssL:'Essential fat',normFmAthL:'Athletic',normFmFitL:'Fitness',normFmAccL:'Acceptable',normFmExcL:'Excess',normFmMEssCons:'FM% below male essential minimum (2-5%). Hormonal risk (↓testosterone), immune and metabolic. Not sustainable long-term. Gradually increase caloric intake.',normFmMAthCons:'Athlete FM% (6-13% ACSM). Excellent for performance. Maintain with balanced nutrition and periodic monitoring.',normFmMFitCons:'Fitness range FM% (14-17% ACE). Excellent for health and performance. Ideal body composition.',normFmMAccCons:'Acceptable FM% (18-24%). To improve: moderate caloric deficit (-300/400 kcal), strength training 3×/week + LISS cardio 150 min/week.',normFmMExcCons:'FM% {v}% elevated (>25% men). Increased cardiometabolic risk. Plan: controlled caloric deficit, combined strength+cardio training, target -0.5 kg/week. Monitor waist circumference.',normFmFEssCons:"FM% below female essential minimum (10-13%). Risk of amenorrhoea, osteoporosis, female athlete triad. Increase caloric intake, consult endocrinologist.",normFmFAthCons:'Athlete FM% (14-20% ACSM). Excellent for sports performance. Monitor menstrual cycle and bone density.',normFmFFitCons:'Fitness range FM% (21-24% ACE). Ideal body composition for health and performance.',normFmFAccCons:'Acceptable FM% (25-31%). To improve: moderate caloric deficit, strength training 3×/week + cardio 150 min/week.',normFmFExcCons:'FM% {v}% elevated (>32% women). Cardiometabolic risk. Plan: controlled caloric deficit, combined training, target -0.5 kg/week.',
    normParqLowL:'Low risk — clearance OK',normParqMidL:'Moderate risk',normParqHighL:'High risk',normParqVeryHighL:'Very high risk — medical clearance required',normParqLowCons:'No positive responses on the PAR-Q. Client may start a light-to-moderate activity programme without additional medical clearance. Monitor symptoms during exercise.',normParqMidConsSg:'1 positive response on the PAR-Q. Medical clearance recommended before vigorous activity (>6 METs). May proceed with light-to-moderate activity under supervision. Adjust intensity and monitor BP and HR during exercise.',normParqMidConsPl:'{v} positive responses on the PAR-Q. Medical clearance recommended before vigorous activity (>6 METs). May proceed with light-to-moderate activity under supervision. Adjust intensity and monitor BP and HR during exercise.',normParqHighCons:'{v} positive responses on the PAR-Q. Medical clearance required before any exercise programme. Begin only after written authorisation from a doctor. Prefer supervised, low-intensity activity with constant monitoring.',normParqVeryHighCons:'⚠️ {v} positive responses on the PAR-Q. Do NOT start exercise without full medical clearance (stress ECG, cardiology referral if indicated). Possible absolute contraindications to unsupervised exercise.',

    normColNormL:'Normal physiological curves',normColNormCons:'Alignment within normal range. Maintain with: core stability (plank, dead bug, bird dog), thoracic mobility, psoas and pectoral stretching.',normColLordL:'Lumbar hyperlordosis',normColLordCons:'Accentuated lumbar lordosis → facet joint compression, low back pain risk. Common causes: weak core + glutes, shortened hip flexors. Correctives: plank 3×30s, glute bridge 3×12, psoas stretch (Thomas stretch) 3×30s/side, dead bug 3×8, avoid hyperextension in back squat.',normColKyphL:'Thoracic hyperkyphosis',normColKyphCons:'Accentuated thoracic kyphosis → protracted shoulders, reduced respiratory capacity, neck pain risk. Correctives: foam roller thoracic extension 2×10, face pull 3×15, wall angel 3×10, wall pectoral stretch 3×30s, rows with scapular retraction focus.',normColFlatL:'Flat back',normColFlatCons:'Reduced physiological curves → less impact absorption, stiffness. Correctives: spinal segmental mobility (cat-cow 3×10), thoracic extensions on foam roller, controlled flexion-extension exercises, swimming.',normColScol1L:'Mild scoliosis',normColScol1Cons:'Mild lateral deviation → muscular imbalances, asymmetric loading. Correctives: symmetric strengthening (plank, pallof press), concave side lengthening, convex side plank, monitor progression. Avoid heavy asymmetric axial loads.',normColScol2L:'Moderate scoliosis',normColScol2Cons:'⚠️ Significant lateral deviation — orthopaedic assessment required. Exercise under supervision: symmetric core strengthening, avoid high axial loads, prefer unloaded exercises (swimming, cycling). Schroth method if indicated.',normColDefault:'Postural assessment recorded. Monitor over time.',

    normMobOptL:'Excellent mobility',normMobRedL:'Reduced',normMobVeryRedL:'Very reduced',normAnkOptCons:'Excellent dorsiflexion (≥12 cm wall test). No restriction for deep squat, running or jumping.',normAnkNormCons:'Ankle mobility within normal range (≥10 cm). Sufficient for squat and running. Maintain with: calf stretch 3×30s, band mobility.',normAnkRedCons:'Reduced ankle mobility (7-9 cm). Limits squat depth and running biomechanics (knee/hip overload). Correctives: wall calf stretch 3×30s, banded ankle distraction 2×1min, temporary heel raise in squat, calf foam roll 2 min.',normAnkVeryRedCons:'Very reduced ankle mobility (<7 cm). Significant impact on squat (lumbar compensation), running (shin splint/Achilles tendinopathy risk), balance. Daily correctives: banded joint mobility, soleus and gastrocnemius stretch 4×30s, eccentric calf exercises. Use heel raise in squat. Assess joint stiffness (physiotherapist).',normHipOptCons:'Full hip flexion (≥120°). No restriction for squat, deadlift, running. Maintain with: 90/90 stretch, pigeon pose.',normHipNormCons:'Good hip mobility (100-119°). Sufficient for most exercises. Regular psoas and piriformis stretching to maintain.',normHipRedCons:'Reduced hip mobility (80-99°). Impact on deep squat and deadlift (lumbar compensation = herniation risk). Correctives: psoas stretch half-kneeling 3×30s, piriformis 3×30s, 90/90 hip switch 2×8, frog stretch 3×30s, goblet squat with pause 3×8. Increased low back pain risk (Ellison 1990).',normHipVeryRedCons:'Very reduced hip mobility (<80°). High risk of chronic low back pain and movement dysfunction (hip-spine syndrome). Avoid: below-parallel squat, heavy conventional deadlift. Daily correctives: hip flexor stretch 4×30s, quadruped rocking mobility, banded piriformis, Thomas stretch. Assess FAI — orthopaedic referral if painful.',

    progRpeTarget:'RPE cible',progZonaFC:'Zone FC',progRazionale:'Raisonnement scientifique',progSplit:'Split',progDurata:'Durée',progFrequenza:'Fréquence',progIntensita:'Intensité',progModulatori:'Modulateurs',progSerieExtra:'+1 série sur les composés ({s}×{r})',progSerieInv:'Séries inchangées',progNoteForza:'Force — méthode linéaire. +{p}%/sem (modulé sur {n} séances/sem). Décharge W4: -30%.',progNoteIpert:'Hypertrophie — double progression. +{p}% charge{extra}. {n} séances/sem → récupération {rec}.',progNoteIpertSerie:' + +1 série en W3',progRecAmpio:'ample, incréments plus grands',progRecRidotto:'réduite, incréments conservateurs',progNoteMetab:'Métabolique — +{p}% charge ou -5s récupération. Avec {n} séances : volume {vol}.',progVolElevato:'élevé, priorité à la récupération',progVolModerato:'modéré, marge pour la progression',progNoteResist:'Endurance — +{p}% charge ou +1 rép chaque semaine. {n} séances/sem.',progNoteSalute:'Santé générale — +{p}% en semaines alternées. Adapter selon RPE.',progW1:'W1 — Plan {split} · {s}×{r} · Charge : {c}% 1RM perçu · Repos : {rec}s · Focus technique et enregistrement charges.',progW2:'W2 — Même plan · Charge +{p}% sur tous les composés · Séries/rép inchangées · RPE cible : {rpe1}-{rpe2}. ({n} séances/sem → taux de progression calibré)',progW3:'W3 — Même plan · {label} · Charge +{p}% supplémentaire · Pic de volume.',progW4:'W4 — DÉCHARGE · {s}×{r} · Charge -25% · Repos +20s · {note}',progWarnForza:'Pour des résultats optimaux en force, au moins 3–4 séances/semaine sont recommandées.',progWarnIpert:'Pour des résultats optimaux en hypertrophie, au moins 3–4 séances/semaine sont recommandées.',progWarnDeficit:'Pour un déficit calorique efficace, au moins 3 séances/semaine sont recommandées.',

    normFumoNoneL:'Non-fumeur',normFumoExL:'Ex-fumeur',normFumoLightL:'Fumeur léger (<10/jour)',normFumoModL:'Fumeur modéré (10-20/jour)',normFumoHeavyL:'Fumeur intense (>20/jour)',normFumoNoneCons:"Aucun impact du tabac sur le VO2max et la FC. Capacité aérobie non limitée par des facteurs tabagiques.",normFumoExCons:"Bénéfices progressifs après l'arrêt : FC normalisée en 2-12 semaines, VO2max +10-15% en 3-9 mois, fonction pulmonaire améliorée en 1-9 mois (AHA). L'entraînement aérobie accélère la récupération. Progression normale du programme.",normFumoLightCons:"Impact : VO2max réduit ~5-8%, FC au repos +5-10 bpm (↑ activation sympathique), COHb 3-5% → capacité de transport O2 réduite. Seuil anaérobie anticipé. Adaptation : réduire l'intensité aérobie attendue de 10%, prolonger les phases d'échauffement, surveiller SpO2. Encourager l'arrêt.",normFumoModCons:"Impact significatif : VO2max réduit ~10-15%, FC repos +10-15 bpm, COHb 5-8%. Clairance mucociliaire réduite, plus grande dyspnée à l'effort. Adaptation : FC cible calculée -10%, éviter l'exercice intense dans les environnements froids, pauses plus fréquentes, surveiller SpO2 et symptômes. Forte recommandation d'arrêt — orientation vers centre antitabac.",normFumoHeavyCons:"⚠️ Impact sévère : VO2max réduit 15-25%, FC repos +15-20 bpm, COHb >8%. Risque accru d'événements cardiaques pendant l'exercice. Adaptation : SEULEMENT activité légère (marche, vélo basse intensité), RPE ≤4, surveillance TA/FC constante, éviter les efforts maximaux. Bilan cardiologique conseillé. L'arrêt du tabac est la priorité clinique n°1.",normSmokeDefault:'État tabagique enregistré.',
    normAlcolNoneL:'Abstème',normAlcolOccL:'Buveur occasionnel (1-2/semaine)',normAlcolModL:'Buveur modéré (3-7/semaine)',normAlcolHighL:'Consommation élevée (>7/semaine)',normAlcolNoneCons:"Aucun impact de l'alcool sur la récupération et le métabolisme. Optimal pour les performances et la composition corporelle.",normAlcolOccCons:"Impact minimal si ≤2 unités/occasion. Éviter l'alcool dans les 24h post-entraînement intense (réduit la synthèse protéique musculaire de 24%, Parr 2014). Préférer les jours de repos. Hydratation supplémentaire.",normAlcolModCons:"Impact : réduction de la synthèse protéique musculaire jusqu'à 37% post-exercice (Parr 2014), ↓ testostérone 6-10%, perturbation du sommeil REM → récupération compromise, ~7 kcal/g (calories vides). Adaptation : planifier les entraînements loin de la consommation, augmenter les protéines +20%, ne pas boire dans les 4h post-workout, comptabiliser les kcal d'alcool dans le bilan. Objectif : réduire à occasionnel.",normAlcolHighCons:"⚠️ Impact sévère : ↓ synthèse protéique musculaire jusqu'à 50%, ↓ testostérone 15-20%, ↓ GH nocturne, stéatose hépatique → métabolisme lipidique compromis, déshydratation chronique, ↑ cortisol. Récupération musculaire gravement compromise (Lakicevic 2019). Adaptation : réduire l'intensité attendue, focus sur faible volume, hydratation prioritaire. Forte recommandation de réduction/arrêt — orientation vers soutien si nécessaire.",normAlcolDefault:"Consommation d'alcool enregistrée.",
    normPhaLowL:'Critique — risque de sarcopénie',normPhaLowCons:"PhA {v}° très bas (seuil critique {sarco}°). Indique une perte d'intégrité cellulaire, possible sarcopénie ou malnutrition (Norman 2012). Priorité : bilan nutritionnel complet, apport protéique ≥1,5 g/kg/jour, entraînement en résistance 3×/semaine. Consulter un spécialiste.",normPhaBelowL:'En dessous de la moyenne',normPhaBelowCons:"PhA {v}° inférieur à la moyenne pour l'âge/sexe (réf. {ref}°, Bosy-Westphal 2006). Possible réduction de la masse cellulaire. Augmenter l'apport protéique, entraînement en force progressif, vérifier l'hydratation.",normPhaNormL:'Dans la norme',normPhaNormCons:"PhA {v}° dans la norme (réf. {ref}°). Bonne intégrité cellulaire et état nutritionnel. Maintenir l'entraînement et une alimentation équilibrée.",normPhaHighL:'Au-dessus de la moyenne',normPhaHighCons:"PhA {v}° excellent (> moyenne {ref}°). Indique une masse cellulaire élevée et un excellent état nutritionnel. Typique des sujets entraînés.",
    normEcwOptL:'Excellent — bonne distribution hydrique',normEcwOptCons:'ECW/TBW {v} indique une excellente distribution hydrique intracellulaire. Typique des sujets bien hydratés avec une bonne masse musculaire.',normEcwNormL:'Normal',normEcwNormCons:'ECW/TBW {v} dans la norme (0,36-0,39, Kyle 2004). Équilibre hydrique adéquat.',normEcwMildL:'Rétention légère',normEcwMildCons:"ECW/TBW {v} légèrement élevé. Possible rétention hydrique légère. Réduire le sodium, augmenter le potassium (fruits, légumes), marche quotidienne 30 min, drainage lymphatique si sédentaire. Vérifier l'apport hydrique ≥2L/jour.",normEcwModL:'Rétention modérée',normEcwModCons:"ECW/TBW {v} élevé — rétention hydrique modérée. Causes possibles : insuffisance veineuse, régime hypersodé, sédentarité, médicaments. Élever les membres inférieurs, compression graduée, réduire sodium <2g/jour. Consulter un médecin si persistant.",normEcwSevL:'Rétention sévère',normEcwSevCons:"⚠️ ECW/TBW {v} très élevé (>0,45). Œdème significatif — consultation médicale nécessaire avant de planifier l'exercice. Exclure causes cardiaques, rénales, hépatiques.",
    normFmEssL:'Graisse essentielle',normFmAthL:'Athlétique',normFmFitL:'Fitness',normFmAccL:'Acceptable',normFmExcL:'Excès',normFmMEssCons:"FM% sous le minimum essentiel masculin (2-5%). Risque hormonal (↓testostérone), immunitaire et métabolique. Non durable à long terme. Augmenter progressivement l'apport calorique.",normFmMAthCons:"FM% d'athlète (6-13% ACSM). Excellent pour la performance. Maintenir avec une alimentation équilibrée et un suivi périodique.",normFmMFitCons:'FM% dans la plage fitness (14-17% ACE). Excellent pour la santé et la performance. Composition corporelle idéale.',normFmMAccCons:"FM% acceptable (18-24%). Pour améliorer : déficit calorique modéré (-300/400 kcal), musculation 3×/semaine + cardio LISS 150 min/semaine.",normFmMExcCons:"FM% {v}% élevé (>25% hommes). Risque cardiométabolique accru. Plan : déficit calorique contrôlé, entraînement combiné force+cardio, objectif -0,5 kg/semaine. Surveiller le périmètre abdominal.",normFmFEssCons:"FM% sous le minimum essentiel féminin (10-13%). Risque d'aménorrhée, d'ostéoporose, triade de l'athlète féminine. Augmenter l'apport calorique, consulter un endocrinologue.",normFmFAthCons:"FM% d'athlète (14-20% ACSM). Excellent pour la performance sportive. Surveiller le cycle menstruel et la densité osseuse.",normFmFFitCons:"FM% dans la plage fitness (21-24% ACE). Composition corporelle idéale pour la santé et la performance.",normFmFAccCons:"FM% acceptable (25-31%). Pour améliorer : déficit calorique modéré, musculation 3×/semaine + cardio 150 min/semaine.",normFmFExcCons:"FM% {v}% élevé (>32% femmes). Risque cardiométabolique. Plan : déficit calorique contrôlé, entraînement combiné, objectif -0,5 kg/semaine.",
    normParqLowL:'Risque faible — bilan OK',normParqMidL:'Risque modéré',normParqHighL:'Risque élevé',normParqVeryHighL:'Risque très élevé — bilan médical obligatoire',normParqLowCons:"Aucune réponse positive au PAR-Q. Le client peut commencer un programme d'activité légère à modérée sans bilan médical supplémentaire. Surveiller les symptômes pendant l'exercice.",normParqMidConsSg:"1 réponse positive au PAR-Q. Bilan médical recommandé avant une activité vigoureuse (>6 METs). Peut procéder avec activité légère-modérée sous supervision. Adapter l'intensité, surveiller TA et FC.",normParqMidConsPl:"{v} réponses positives au PAR-Q. Bilan médical recommandé avant une activité vigoureuse (>6 METs). Peut procéder avec activité légère-modérée sous supervision. Adapter l'intensité, surveiller TA et FC.",normParqHighCons:"{v} réponses positives au PAR-Q. Bilan médical obligatoire avant tout programme. Commencer seulement après autorisation écrite du médecin. Préférer activité supervisée, basse intensité, avec surveillance constante.",normParqVeryHighCons:"⚠️ {v} réponses positives au PAR-Q. NE PAS commencer l'exercice sans bilan médical complet (ECG d'effort, cardiologie si indiqué). Possibles contre-indications absolues à l'exercice non supervisé.",
    days:['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'],months:['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'],
    normColNormL:'Courbes physiologiques normales',normColNormCons:"Alignement dans la norme. Maintenir avec : stabilité du core (plank, dead bug, bird dog), mobilité thoracique, étirement psoas et pectoraux.",normColLordL:'Hyperlordose lombaire',normColLordCons:"Lordose lombaire accentuée → compression des facettes articulaires, risque lombalgie. Causes fréquentes : core + fessiers faibles, fléchisseurs de hanche raccourcis. Correctifs : plank 3×30s, glute bridge 3×12, étirement psoas (Thomas stretch) 3×30s/côté, dead bug 3×8, éviter l'hyperextension au back squat.",normColKyphL:'Hypercyphose dorsale',normColKyphCons:"Cyphose thoracique accentuée → épaules projetées, capacité respiratoire réduite, risque cervicalgie. Correctifs : roller extension thoracique 2×10, face pull 3×15, wall angel 3×10, étirement pectoraux au mur 3×30s, rowing avec rétraction scapulaire.",normColFlatL:'Dos plat',normColFlatCons:"Réduction des courbes physiologiques → moindre absorption des chocs, rigidité. Correctifs : mobilité segmentaire rachis (cat-cow 3×10), extensions thoraciques sur roller, exercices flexion-extension contrôlée, natation.",normColScol1L:'Scoliose légère',normColScol1Cons:"Déviation latérale légère → déséquilibres musculaires, charges asymétriques. Correctifs : renforcement symétrique (plank, pallof press), allongement côté concave, side plank côté convexe, surveiller progression. Éviter charges axiales lourdes asymétriques.",normColScol2L:'Scoliose modérée',normColScol2Cons:"⚠️ Déviation latérale significative — bilan orthopédique nécessaire. Exercice sous supervision : renforcement symétrique core, éviter charges axiales élevées, préférer exercices en décharge (natation, vélo). Méthode Schroth si indiqué.",normColDefault:'Évaluation posturale enregistrée. Surveiller dans le temps.',

// ── TABELLE NORMATIVE PER ETÀ E SESSO ────────────────────────────────────────
// Bohannon & Crouch 2017 — 6MWT distanza media attesa (m)
var mwtNorms={
  M:{20:695,30:669,40:643,50:617,60:591,65:578,70:553,75:528,80:503},
  F:{20:660,30:634,40:608,50:582,60:556,65:543,70:518,75:493,80:468}
};
// Rikli & Jones 1999 — STS 30s ripetizioni medie
var stsNorms={
  M:{25:20,30:19,35:18,40:17,45:16,50:15,55:14,60:14,65:13,70:12,75:11,80:10,85:9},
  F:{25:18,30:17,35:16,40:15,45:15,50:14,55:13,60:13,65:12,70:11,75:10,80:9,85:8}
};
// Dodds 2014 — Handgrip forza media (kg)
var hgNorms={
  M:{25:50,30:51,35:51,40:50,45:48,50:46,55:44,60:42,65:39,70:36,75:33,80:30},
  F:{25:31,30:32,35:32,40:31,45:30,50:28,55:27,60:25,65:23,70:22,75:20,80:18}
};
// Bohannon 2006 — TUG tempo medio (s)
var tugNorms={20:8.0,30:8.0,40:8.0,50:9.0,60:9.5,65:10.0,70:11.0,75:12.0,80:13.5};

function getNormInterp(norms,eta){
  var ages=Object.keys(norms).map(Number).sort(function(a,b){return a-b;});
  if(eta<=ages[0])return norms[ages[0]];
  if(eta>=ages[ages.length-1])return norms[ages[ages.length-1]];
  for(var i=0;i<ages.length-1;i++){
    if(eta>=ages[i]&&eta<=ages[i+1]){
      var ratio=(eta-ages[i])/(ages[i+1]-ages[i]);
      return norms[ages[i]]+ratio*(norms[ages[i+1]]-norms[ages[i]]);
    }
  }
  return norms[ages[Math.floor(ages.length/2)]];
}
function getMwtNorm(sesso,eta){return getNormInterp((mwtNorms[sesso]||mwtNorms['M']),eta);}
function getStsNorm(sesso,eta){return getNormInterp((stsNorms[sesso]||stsNorms['M']),eta);}
function getHgNorm(sesso,eta){return getNormInterp((hgNorms[sesso]||hgNorms['M']),eta);}
function getTugNorm(eta){return getNormInterp(tugNorms,eta);}

// ── STIMA AUTOMATICA TEST da dati anagrafici ─────────────────────────────────
// Stima i valori di tutti i test partendo da {eta, sesso, peso, altezza, attivita}
// Formule: 6MWT Enright & Sherrill 1998, STS Jones 1999, Push-up ACSM, Plank norme medie,
// Handgrip Dodds 2014 (getHgNorm), TUG Bohannon 2006 (getTugNorm).
function stimaTest(params){
  var eta=+params.eta||40;
  var sesso=params.sesso==='F'?'F':'M';
  var peso=+params.peso||70;
  var altezza=+params.altezza||170;
  var att=params.attivita||'Moderata';
  // Normalizza attività: gestisci sia "Moderata" che "Moderatamente attiva"
  if(att==='Moderatamente attiva')att='Moderata';
  // Fattori moltiplicativi per livello attività
  var f6={Sedentaria:0.85,'Poco attiva':0.92,Moderata:1.0,Attiva:1.08,'Molto attiva':1.15}[att]||1.0;
  var fSts={Sedentaria:0.75,'Poco attiva':0.9,Moderata:1.0,Attiva:1.15,'Molto attiva':1.3}[att]||1.0;
  var fHg={Sedentaria:0.85,'Poco attiva':0.95,Moderata:1.0,Attiva:1.1,'Molto attiva':1.15}[att]||1.0;
  var fTug={Sedentaria:1.2,'Poco attiva':1.1,Moderata:1.0,Attiva:0.85,'Molto attiva':0.8}[att]||1.0;
  // 6MWT — Enright & Sherrill 1998 (in metri)
  var mwt;
  if(sesso==='M')mwt=(7.57*altezza)-(5.02*eta)-(1.76*peso)-309;
  else mwt=(2.11*altezza)-(2.29*peso)-(5.78*eta)+667;
  mwt=Math.round(mwt*f6);
  if(mwt<200)mwt=200;
  if(mwt>800)mwt=800;
  // STS 30s — Jones 1999 (ripetizioni)
  var stsTbl={
    M:{20:20,30:18,40:16,50:14,60:12,70:10,80:8},
    F:{20:17,30:16,40:14,50:13,60:11,70:9,80:7}
  };
  var bandSts=eta<30?20:eta<40?30:eta<50?40:eta<60?50:eta<70?60:eta<80?70:80;
  var sts=Math.round((stsTbl[sesso][bandSts]||10)*fSts);
  if(sts<4)sts=4;
  // Push-up — norme ACSM (ripetizioni)
  var pushTbl={
    M:{20:28,30:22,40:17,50:13,60:10,70:8},
    F:{20:20,30:16,40:12,50:9,60:6,70:5}
  };
  var bandPush=eta<30?20:eta<40?30:eta<50?40:eta<60?50:eta<70?60:70;
  var push=Math.round((pushTbl[sesso][bandPush]||5)*fSts);
  if(push<2)push=2;
  // Plank — norme medie per età (secondi); donne -15%
  var plankTbl={20:75,30:65,40:55,50:45,60:35,70:25,80:18};
  var bandPlank=eta<30?20:eta<40?30:eta<50?40:eta<60?50:eta<70?60:eta<80?70:80;
  var plank=plankTbl[bandPlank]||30;
  plank=Math.round(plank*fSts*(sesso==='F'?0.85:1));
  if(plank<10)plank=10;
  // Handgrip — Dodds 2014 (kg)
  var hg=Math.round(getHgNorm(sesso,eta)*fHg);
  // TUG — Bohannon 2006 (secondi, meno è meglio)
  var tug=+(getTugNorm(eta)*fTug).toFixed(1);
  return {mwtDist:mwt,stsRip:sts,pushupRip:push,plankSec:plank,handgrip:hg,tugSec:tug};
}

// ── CLASSIFICAZIONE PESATA SCIENTIFICA ────────────────────────────────────────
const calcScore=(test,sesso,extra,eta)=>{
  // test = {mwtDist, stsRip, handgrip, tugSec, biaFM/massaGrassa, ...}
  // extra = {biaFM} from bia object or massaGrassa from test
  // eta = età del cliente (default 50)
  if(!eta||eta<10||eta>120)eta=50;
  const m=sesso==='M';
  const components=[];
  // 1. CAPACITÀ AEROBICA (peso 40%) — 6MWT — Bohannon & Crouch 2017
  // Scoring granulare per discriminare meglio la fascia alta
  if(test?.mwtDist&&+test.mwtDist>0){
    const d=+test.mwtDist;
    const norm=getMwtNorm(sesso,eta);
    const ratio=d/norm;
    const s=ratio>=1.3?100:ratio>=1.2?95:ratio>=1.1?90:ratio>=1.0?80:ratio>=0.9?70:ratio>=0.8?55:ratio>=0.7?40:ratio>=0.5?25:10;
    components.push({id:'aerobica',label:'Capacita aerobica (6MWT)',w:40,score:s,val:d+'m (norma '+Math.round(norm)+'m per '+(m?'uomo':'donna')+' '+eta+' anni)',icon:'🚶'});
  }
  // 2. FORZA (peso 30%) — media STS + Handgrip
  // STS — Rikli & Jones 1999
  let stsS=null;
  if(test?.stsRip&&+test.stsRip>0){
    const rip=+test.stsRip;
    const norm=getStsNorm(sesso,eta);
    const ratio=rip/norm;
    stsS=ratio>=1.3?100:ratio>=1.2?95:ratio>=1.1?90:ratio>=1.0?80:ratio>=0.8?60:ratio>=0.6?40:20;
  }
  // Handgrip — Dodds 2014
  const hg=test?.handgrip&&+test.handgrip>0?+test.handgrip:null;
  let hgS=null;
  if(hg!==null){
    const norm=getHgNorm(sesso,eta);
    const ratio=hg/norm;
    hgS=ratio>=1.3?100:ratio>=1.2?95:ratio>=1.1?90:ratio>=1.0?80:ratio>=0.8?60:ratio>=0.6?40:20;
  }
  let forzaScore=null,forzaVal='';
  if(stsS!==null&&hgS!==null){forzaScore=Math.round((stsS+hgS)/2);forzaVal='STS '+test.stsRip+' rip + HG '+hg+'kg';}
  else if(stsS!==null){forzaScore=stsS;forzaVal='STS '+test.stsRip+' rip';}
  else if(hgS!==null){forzaScore=hgS;forzaVal='HG '+hg+'kg';}
  if(forzaScore!==null) components.push({id:'forza',label:'Forza (STS + Handgrip)',w:30,score:forzaScore,val:forzaVal,icon:'💪'});
  // 3. COMPOSIZIONE CORPOREA (peso 20%) — FM% — ACSM/ACE con modulazione età
  // Scoring più granulare per la fascia fitness
  const fm=extra?.biaFM?+extra.biaFM:(test?.massaGrassa?+test.massaGrassa:(test?.biaFM?+test.biaFM:null));
  if(fm!==null&&fm>0){
    let cs;
    const fmAdjust=Math.max(0,Math.floor((eta-30)/10));
    if(m){cs=fm<6+fmAdjust?100:fm<10+fmAdjust?95:fm<14+fmAdjust?85:fm<18+fmAdjust?70:fm<25+fmAdjust?50:25;}
    else{cs=fm<14+fmAdjust?100:fm<18+fmAdjust?95:fm<21+fmAdjust?85:fm<25+fmAdjust?70:fm<32+fmAdjust?50:25;}
    components.push({id:'corpo',label:'Composizione corporea (FM%)',w:20,score:cs,val:fm+'%',icon:'📏'});
  }
  // 4. EQUILIBRIO (peso 10%) — TUG — Bohannon 2006 (meno è meglio)
  if(test?.tugSec&&+test.tugSec>0){
    const t=+test.tugSec;
    const norm=getTugNorm(eta);
    const ratio=t/norm;
    const ts=ratio<=0.7?100:ratio<=0.8?95:ratio<=0.85?90:ratio<=1.0?80:ratio<=1.3?55:ratio<=1.6?30:10;
    components.push({id:'equilibrio',label:'Equilibrio (TUG)',w:10,score:ts,val:t+'s (norma '+norm.toFixed(1)+'s per '+eta+' anni)',icon:'⏱'});
  }
  // Minimo: almeno 6MWT o STS
  if(components.length===0)return null;
  if(!components.find(c=>c.id==='aerobica')&&!components.find(c=>c.id==='forza'))return null;
  // Calcolo media pesata normalizzata
  const totalW=components.reduce((a,c)=>a+c.w,0);
  const score=Math.round(components.reduce((a,c)=>a+c.score*(c.w/totalW),0));
  // Componenti mancanti
  const allIds=['aerobica','forza','corpo','equilibrio'];
  const missing=allIds.filter(id=>!components.find(c=>c.id===id));
  const missingLabels={aerobica:'6MWT',forza:'STS o Handgrip',corpo:'FM% (BIA o plicometria)',equilibrio:'TUG'};
  // Risultato — soglie aggiornate per norme età, con livello C+ per atleti
  let code,l,c,bg;
  if(score>=90){code='C+';l=gT().profileExcellent;c='#3b82f6';bg='#dbeafe';}
  else if(score>=75){code='C';l=gT().profileGood;c=C.green;bg='#d1fae5';}
  else if(score>=45){code='B';l=gT().profileMed;c=C.yellow;bg='#fef3c7';}
  else{code='A';l=gT().profileLow;c=C.red;bg='#fee2e2';}
  return{code,l,c,bg,score,components,missing:missing.map(id=>missingLabels[id])};
};

// ── SCORE ANAMNESTICO (fallback senza test fisici) ────────────────────────────
// Usato quando calcScore() restituisce null (test non eseguiti).
// Stima profilo da dati anamnestici con pesi dinamici per obiettivo.
// Output: stesso formato di calcScore() con isEstimated:true
const calcScoreAnamnestico=(d,eta)=>{
  if(!d)return null;
  var T2=gT();
  var sesso=d.sesso||'M';
  var m=sesso==='M';
  var ob=d.obiettivo||'';
  var patologie=(d.patologie||'').toLowerCase();
  var att=d.attivita||'Sedentaria';
  var expLiv=d.esperienzaLiv||'Principiante';
  var expAnni=+(d.esperienzaAnni||0)||0;
  var fumo=d.fumo||'Non fumatore';
  var stress=d.stress||'Medio';
  var sonno=+(d.sonno||7)||7;
  var motivazione=+(d.motivazione||5)||5;
  var sintomi=d.sintomiSforzo&&d.sintomiSforzo!=='NO';
  var gravidanza=d.gravidanza&&d.gravidanza!=='NO';

  // ── 1. SCORE AEROBICA (proxy: attività + fumo) ──
  var aerScore={
    'Sedentaria':20,'Poco attiva':38,'Moderata':58,'Attiva':74,'Molto attiva':90
  }[att]||40;
  // decadimento età (Fitzgerald 1997: ~1%/anno dopo 25)
  if(eta>25)aerScore=Math.round(aerScore*(1-Math.min(0.3,(eta-25)*0.008)));
  if(fumo==='Fumatore regolare')aerScore=Math.round(aerScore*0.82);
  else if(fumo==='Fumatore occasionale')aerScore=Math.round(aerScore*0.92);
  aerScore=Math.max(5,Math.min(100,aerScore));

  // ── 2. SCORE FORZA (proxy: esperienza livello + anni) ──
  var forzaBase={
    'Principiante':25,'Intermedio':58,'Avanzato':82,'Esperto':95
  }[expLiv]||25;
  // anni di esperienza amplificano (cap a 5 anni)
  var anniBonus=Math.min(expAnni,5)*3;
  var forzaScore=Math.min(100,forzaBase+anniBonus);
  // decadimento età forza più accentuato dopo 50 (Dodds 2014)
  if(eta>50)forzaScore=Math.round(forzaScore*(1-Math.min(0.25,(eta-50)*0.012)));
  forzaScore=Math.max(5,Math.min(100,forzaScore));

  // ── 3. SCORE COMPOSIZIONE (FM% stimata — Deurenberg 1991) ──
  var corpoScore=50; // default neutro se mancano peso/altezza
  var peso=+(d.peso||0);
  var altezza=+(d.altezza||0);
  if(peso>0&&altezza>0&&eta>0){
    var bmiV=peso/Math.pow(altezza/100,2);
    var fmEst=(1.2*bmiV)+(0.23*eta)-(10.8*(m?1:0))-5.4;
    fmEst=Math.max(3,Math.min(60,fmEst));
    var fmAdj=Math.max(0,Math.floor((eta-30)/10));
    if(m){
      corpoScore=fmEst<6+fmAdj?100:fmEst<10+fmAdj?90:fmEst<14+fmAdj?78:fmEst<18+fmAdj?62:fmEst<25+fmAdj?44:20;
    }else{
      corpoScore=fmEst<14+fmAdj?100:fmEst<18+fmAdj?90:fmEst<21+fmAdj?78:fmEst<25+fmAdj?62:fmEst<32+fmAdj?44:20;
    }
  }

  // ── 4. SCORE EQUILIBRIO (proxy: età + patologie) ──
  var equScore=eta<40?90:eta<50?80:eta<60?68:eta<70?52:eta<80?36:22;
  if(patologie.includes('artrosi')||patologie.includes('artrite'))equScore=Math.round(equScore*0.82);
  if(patologie.includes('osteoporosi'))equScore=Math.round(equScore*0.88);
  equScore=Math.max(5,Math.min(100,equScore));

  // ── 5. PESI DINAMICI per obiettivo ──
  var wA,wF,wC,wE;
  if(ob==='Forza'){             wA=0.20;wF=0.50;wC=0.20;wE=0.10;}
  else if(ob==='Aumentare massa'){wA=0.20;wF=0.45;wC=0.25;wE=0.10;}
  else if(ob==='Perdere peso'){  wA=0.40;wF=0.20;wC=0.30;wE=0.10;}
  else if(ob==='Resistenza'||ob==='Performance'){wA=0.55;wF=0.20;wC=0.15;wE=0.10;}
  else{                          wA=0.40;wF=0.30;wC=0.20;wE=0.10;}

  var score=Math.round(aerScore*wA+forzaScore*wF+corpoScore*wC+equScore*wE);

  // ── 6. MODULATORI FINALI ──
  if(sonno<6)score=Math.round(score*0.93);
  if(stress==='Alto'||stress==='Molto alto')score=Math.round(score*0.95);
  // motivazione alta → lieve bonus volontà (±5 pt)
  var motivBonus=Math.round((motivazione-5)*0.8);
  score=Math.max(5,Math.min(100,score+motivBonus));

  // ── 7. ABBATTIMENTO PATOLOGIE ──
  if(patologie.includes('cardiopatia'))score=Math.round(score*0.78);
  else if(patologie.includes('bpco')||patologie.includes('asma'))score=Math.round(score*0.85);
  else if(patologie.includes('ipertensione'))score=Math.round(score*0.92);
  else if(patologie.includes('diabete'))score=Math.round(score*0.90);
  else if(patologie.includes('obesita'))score=Math.round(score*0.88);
  score=Math.max(5,Math.min(100,score));

  // ── 8. OVERRIDE SICUREZZA ──
  if(gravidanza)score=Math.min(score,44); // max profilo A
  if(sintomi)score=Math.min(score,54);    // max profilo B basso
  if(ob==='Riabilitazione')score=Math.min(score,44);

  // ── 9. PROFILO ──
  var code,l,c,bg;
  if(score>=90){code='C+';l=gT().profileExcellent;c='#3b82f6';bg='#dbeafe';}
  else if(score>=75){code='C';l=gT().profileGood;c=C.green;bg='#d1fae5';}
  else if(score>=45){code='B';l=gT().profileMed;c=C.yellow;bg='#fef3c7';}
  else{code='A';l=gT().profileLow;c=C.red;bg='#fee2e2';}

  // ── 10. COMPONENTS (per UI dettaglio) ──
  var obLabel=ob||'Salute generale';
  var components=[
    {id:'aerobica',label:'Capacità aerobica (stimata)',w:Math.round(wA*100),score:aerScore,
      val:att+(fumo!=='Non fumatore'?' · '+fumo:''),icon:'🚶'},
    {id:'forza',label:'Forza (stimata)',w:Math.round(wF*100),score:forzaScore,
      val:expLiv+(expAnni>0?' · '+expAnni+' anni esperienza':''),icon:'💪'},
    {id:'corpo',label:'Composizione corporea (stimata)',w:Math.round(wC*100),score:corpoScore,
      val:(peso>0&&altezza>0?'BMI '+Math.round(peso/Math.pow(altezza/100,2)*10)/10:'dati insufficienti'),icon:'📏'},
    {id:'equilibrio',label:'Equilibrio (stimato)',w:Math.round(wE*100),score:equScore,
      val:eta+' anni',icon:'⚖️'},
  ];

  return{code,l,c,bg,score,components,missing:[],isEstimated:true,
    estimatedNote:'Score stimato da anamnesi (obiettivo: '+obLabel+'). Esegui i test fisici per uno score preciso.'};
};

  const t=test||{mwtDist:mwt,stsRip:sts};
  const r=calcScore(t,sesso||'M',extra,eta||50);
  return r;
};
const calcNutrizione=(p)=>{
  if(!p)return null;
  var T=gT();

    var ffm=peso*(1-(+p.bia.FM)/100);

    if(!eta||!peso||!altezza)return null;
    if(p.sesso==='M')bmr=(10*peso)+(6.25*altezza)-(5*eta)+5;

  }
  if(!eta&&peso&&altezza){eta=50;}
  if(p.patologie){var pat0=p.patologie.toLowerCase();if(pat0.includes('tiroidea')||pat0.includes('ipotiroidismo'))bmr*=0.90;}

  var fattori={'Sedentaria':1.2,'Poco attiva':1.375,'Moderata':1.55,'Attiva':1.725,'Molto attiva':1.9};

  var obiettivoMap={
    'Perdere peso':{molt:0.80,note:T.nutObPesoNote},
    'Aumentare massa':{molt:1.15,note:T.nutObMassaNote},
    'Resistenza':{molt:1.05,note:T.nutObResNote},
    'Forza':{molt:1.10,note:T.nutObForzaNote},
    'Salute':{molt:1.0,note:T.nutObSaluteNote},
    'Riabilitazione':{molt:1.0,note:T.nutObRiabNote},
    'Performance':{molt:1.10,note:T.nutObPerfNote},
    'Benessere':{molt:1.0,note:T.nutObBenNote}
  };
  var obInfo=obiettivoMap[p.obiettivo]||{molt:1.0,note:T.nutObBenNote};
  var molt=obInfo.molt;
  var kcal=Math.round(tdee*molt);

  if(p.obiettivoStrutturato&&p.obiettivoStrutturato.kcalTargetCalcolato&&p.obiettivoStrutturato.kcalTargetCalcolato!==0){kcal=Math.round(tdee+p.obiettivoStrutturato.kcalTargetCalcolato);}
  if(p.stressPercepito==='Alto'||p.stressPercepito==='Molto alto')kcal=Math.round(kcal*1.05);
  // Cap sul deficit: mai sotto BMR * 1.2
  if(kcal<bmr*1.2)kcal=Math.round(bmr*1.2);
  // STEP 4 — Macros (ISSN Position Stand 2017)
  var protMap={
    'Perdere peso':{perKg:2.3,ref:T.nutProtPesoRef},
    'Aumentare massa':{perKg:1.8,ref:T.nutProtMassaRef},
    'Resistenza':{perKg:1.4,ref:T.nutProtResRef},
    'Forza':{perKg:2.0,ref:T.nutProtForzaRef},
    'Salute':{perKg:1.2,ref:T.nutProtSaluteRef},
    'Riabilitazione':{perKg:1.6,ref:T.nutProtRiabRef},
    'Performance':{perKg:1.8,ref:T.nutProtPerfRef},
    'Benessere':{perKg:1.2,ref:T.nutProtBenRef}
  };
  var protInfo=protMap[p.obiettivo]||{perKg:1.6,ref:''};
  var protPerKg=protInfo.perKg;
  // Aggiusta per età: sarcopenia prevention (Bauer 2013)

  if(p.sesso==='F')protPerKg-=0.1;

  var bmiVal=altezza&&peso?peso/((altezza/100)**2):null;
  if(bmiVal&&bmiVal>30)pesoCalcolo=24.9*((altezza/100)**2);
  var proteine=Math.round(protPerKg*pesoCalcolo);
  var kcalProt=proteine*4;
  // Grassi (ISSN + ACSM)
  var grassiMap={
    'Perdere peso':{pct:0.25,ref:T.nutFatPesoRef},
    'Aumentare massa':{pct:0.28,ref:T.nutFatMassaRef},
    'Resistenza':{pct:0.25,ref:T.nutFatResRef},
    'Forza':{pct:0.30,ref:T.nutFatForzaRef},
    'Salute':{pct:0.30,ref:T.nutFatSaluteRef},
    'Riabilitazione':{pct:0.28,ref:T.nutFatRiabRef},
    'Performance':{pct:0.25,ref:T.nutFatPerfRef},
    'Benessere':{pct:0.30,ref:T.nutFatBenRef}
  };
  var grassiInfo=grassiMap[p.obiettivo]||{pct:0.28,ref:''};
  var pctG=grassiInfo.pct;
  if(p.patologie){var pat1=p.patologie.toLowerCase();if(pat1.includes('dislipidemia')||pat1.includes('cardiopatia'))pctG=0.20;}
  // Mai sotto 20% (minimo per vitamine liposolubili)

  var grassi=Math.round((kcal*pctG)/9);
  var kcalGrassi=grassi*9;
  var carboidrati=Math.round((kcal-kcalProt-kcalGrassi)/4);
  if(carboidrati<0)carboidrati=0;
  // Minimo carboidrati per endurance/performance: 3 g/kg
  if((p.obiettivo==='Resistenza'||p.obiettivo==='Performance')&&peso){
    var minCarbo=Math.round(3*peso);
    if(carboidrati<minCarbo)carboidrati=minCarbo;
  }
  // Minimo 130g carboidrati in deficit (fabbisogno cerebrale)
  if(p.obiettivo==='Perdere peso'&&carboidrati<130)carboidrati=130;
  if(p.patologie){
    var pat2=p.patologie.toLowerCase();
    if(pat2.includes('diabete tipo 2')){var maxCarbo=Math.round((kcal*0.40)/4);if(carboidrati>maxCarbo){var diff=carboidrati-maxCarbo;carboidrati=maxCarbo;grassi+=Math.round((diff*4)/9);}}
    if(pat2.includes('diabete tipo 1')){if(carboidrati<130)carboidrati=130;}
  }
  // STEP 5 — Note
  var note=[];
  if(+p.sonno<6)note.push(T.nutNoteSleep);
  if(p.patologie){
    var pat3=p.patologie.toLowerCase();
    if(pat3.includes('ipertensione'))note.push(T.nutPatIpertNote);
    if(pat3.includes('diabete tipo 2'))note.push(T.nutPatDiabT2Note);
    if(pat3.includes('diabete tipo 1'))note.push(T.nutPatDiabT1Note);
    if(pat3.includes('dislipidemia'))note.push(T.nutPatDislipNote);
    if(pat3.includes('cardiopatia'))note.push(T.nutPatCardioNote);
    if(pat3.includes('osteoporosi'))note.push(T.nutPatOsteoNote);
    if(pat3.includes('artrosi')||pat3.includes('artrite'))note.push(T.nutPatArtrosiNote);
    if(pat3.includes('depressione')||pat3.includes('ansia'))note.push(T.nutPatDepressioneNote);
    if(pat3.includes('obesita'))note.push(T.nutPatObesitaNote);
    if(pat3.includes('tiroidea'))note.push(T.nutPatTiroideaNote);
  }
  if(p.allergie){
    var all=p.allergie.toLowerCase();
    if(all.includes('lattosio'))note.push(T.nutAllLattoNote);
    if(all.includes('glutine')||all.includes('celiachia'))note.push(T.nutAllGlutineNote);
    if(all.includes('nichel'))note.push(T.nutAllNichelNote);
  }
  if(p.alcol&&(p.alcol.includes('8-14')||p.alcol.includes('>14')))note.push(T.nutNoteAlcol);
  if(p.stressPercepito==='Alto'||p.stressPercepito==='Molto alto')note.push(T.nutNoteStress);
  // Note automatiche per età, BMI, obiettivo, FC, motivazione
  if(eta&&eta>65)note.push(T.nutNoteOver65.replace('{p}',protPerKg.toFixed(1)));
  if(p.obiettivo==='Perdere peso'&&bmiVal&&bmiVal>30)note.push(T.nutNotePesoIdeale.replace('{p}',pesoCalcolo.toFixed(0)));
  if(p.obiettivo==='Perdere peso'&&bmiVal&&bmiVal>=25&&bmiVal<=30)note.push(T.nutNoteDeficitMod);
  if(p.obiettivo==='Aumentare massa')note.push(T.nutNoteSurplus);
  if(p.fc&&+p.fc>80)note.push(T.nutNoteFcAlta);
  if(p.motivazione&&+p.motivazione<5)note.push(T.nutNoteMotBassa);
  note.push(T.nutNoteRefs+(p.bia?.FM?T.nutNoteRefsBia:'')+'.');
  note.push(T.nutNoteDisclaimer);
  return{kcal,proteine,carboidrati,grassi,note:note.join('\n'),formula:p.bia?.FM?'Katch-McArdle (BIA)':'Mifflin-St Jeor',protRef:protInfo.ref,grassiRef:grassiInfo.ref};
};
// Push-up YMCA norme per fascia d'età (Golding 2000) [veryLow, low, avg, good, excellent]
const PUSHUP_NORME={

  else{l=T.excellent;c='#10b981';cons=T.consPushupAdv;}
  // Età sul risultato
  var etaLabel=eta?' ('+eta+' anni)':'';
  return{l,c,cons,etaLabel,norma:norme[2]+' rip. norma fascia età'+etaLabel};
};

// ── 2. Handgrip — normativi Dodds 2014 (kg) ─────────────────────────────────
const interpHandgrip=(kg,sesso,eta)=>{
  if(!kg)return null;const T=gT();const v=+kg,m=sesso==='M',a=+eta||50;
  // Soglie basate su Dodds RM et al. (2014) "Grip strength across the life course" + cut-off sarcopenia EWGSOP2 2019
  if(m){
    const sarco=a<65?30:27; // EWGSOP2: <27 kg uomini anziani, <30 giovani adulti
    const ref=a<30?50:a<40?51:a<50?50:a<60?46:a<70?42:a<80?36:30; // mediane Dodds
    if(v<sarco)return{l:T.hgSarco,c:'#ef4444',cons:T.consHgSarcoMale.replace('{v}',v).replace('{sarco}',sarco)};
    if(v<ref*0.8)return{l:T.hgUnder,c:'#f59e0b',cons:T.consHgUnderMale.replace('{ref}',ref)};
    if(v<ref*1.1)return{l:T.average,c:'#10b981',cons:T.consHgAvgMale.replace('{ref}',ref)};
    return{l:T.hgAbove,c:'#3b82f6',cons:T.consHgAboveMale.replace('{ref}',ref)};
  }else{
    const sarco=a<65?20:16; // EWGSOP2: <16 kg donne anziane
    const ref=a<30?31:a<40?32:a<50?31:a<60?28:a<70?25:a<80?22:18;
    if(v<sarco)return{l:T.hgSarco,c:'#ef4444',cons:T.consHgSarcoFemale.replace('{v}',v).replace('{sarco}',sarco)};
    if(v<ref*0.8)return{l:T.hgUnder,c:'#f59e0b',cons:T.consHgUnderFemale.replace('{ref}',ref)};
    if(v<ref*1.1)return{l:T.average,c:'#10b981',cons:T.consHgAvgFemale.replace('{ref}',ref)};
    return{l:T.hgAbove,c:'#3b82f6',cons:T.consHgAboveFemale.replace('{ref}',ref)};
  }
};

// ── 3. Sit-and-Reach — flessibilità ACSM (cm) ──────────────────────────────
const interpSitReach=(cm,sesso)=>{
  if(cm===''||cm===null||cm===undefined)return null;const T=gT();const v=+cm,m=sesso==='M';
  // ACSM Guidelines for Exercise Testing and Prescription (11th ed.)
  if(m){

    if(v<0)return{l:T.hgUnder,c:'#f59e0b',cons:T.consSrUnderMale};

    return{l:T.excellent,c:'#3b82f6',cons:T.consSrExcFemale};
  }
};

// ── 4. BIA — Angolo di Fase (PhA) — Bosy-Westphal 2006 ─────────────────────
const interpPhA=(pha,sesso,eta)=>{
  if(!pha)return null;const v=+pha,m=sesso==='M',a=+eta||50;
  const T=gT();
  const refM=a<30?7.5:a<40?7.3:a<50?7.1:a<60?6.8:a<70?6.3:5.8;
  const refF=a<30?6.6:a<40?6.4:a<50?6.2:a<60?5.9:a<70?5.5:5.1;
  const ref=m?refM:refF;
  const sarcoThresh=m?4.5:3.8;
  if(v<sarcoThresh)return{l:T.normPhaLowL,c:'#ef4444',cons:T.normPhaLowCons.replace('{v}',v).replace('{sarco}',sarcoThresh)};
  if(v<ref*0.85)return{l:T.normPhaBelowL,c:'#f59e0b',cons:T.normPhaBelowCons.replace('{v}',v).replace('{ref}',ref)};
  if(v<ref*1.15)return{l:T.normPhaNormL,c:'#10b981',cons:T.normPhaNormCons.replace('{v}',v).replace('{ref}',ref)};
  return{l:T.normPhaHighL,c:'#3b82f6',cons:T.normPhaHighCons.replace('{v}',v).replace('{ref}',ref)};
};

  }
};
function muscoliLocale(muscoli,lang){
  if(!muscoli||lang==='it')return muscoli||'';
  var trans=MUSCOLI_TRANS[lang];
  if(!trans)return muscoli;
  return muscoli.split(',').map(function(m){
    var t=m.trim();
    return trans[t]||t;
  }).join(', ');
}
function livelloLocale(livello,lang){
  if(!livello||lang==='it')return livello||'';
  var map={en:{base:'beginner',intermedio:'intermediate',avanzato:'advanced'},
           fr:{base:'débutant',intermedio:'intermédiaire',avanzato:'avancé'}};
  return (map[lang]&&map[lang][livello])||livello;
}

// ── TOAST SYSTEM ──────────────────────────────────────────────────────────────
let _toastDispatch=null;
function showToast(msg,type='success',duration=4000){if(_toastDispatch)_toastDispatch({msg,type,duration});}
function showConfirmToast(msg,action,duration=5000){if(_toastDispatch)_toastDispatch({msg,type:'confirm',action,duration});}
function showAskToast(msg,onConfirm,duration=8000){if(_toastDispatch)_toastDispatch({msg,type:'ask',action:onConfirm,duration});}

function ToastItem({item,onRemove}){
  const [exiting,setExiting]=React.useState(false);
  const [progress,setProgress]=React.useState(100);
  const isConfirm=item.type==='confirm';
  const isAsk=item.type==='ask';
  const cancelled=React.useRef(false);
  React.useEffect(()=>{
    const start=Date.now();
    const total=item.duration;
    const tick=setInterval(()=>{const elapsed=Date.now()-start;setProgress(Math.max(0,100-(elapsed/total)*100));},50);
    const timer=setTimeout(()=>{
      clearInterval(tick);
      if(isConfirm&&!cancelled.current)item.action();
      setExiting(true);
      setTimeout(()=>onRemove(item.id),300);
    },total);
    return()=>{clearInterval(tick);clearTimeout(timer);};
  },[]);
  const handleCancel=()=>{
    cancelled.current=true;
    onRemove(item.id);
    showToast(gT().toastUndone,'success');
  };
  const closeToast=()=>{setExiting(true);setTimeout(()=>onRemove(item.id),300);};
  const bg=item.type==='error'?C.red:item.type==='warning'?'#f59e0b':item.type==='confirm'?'#f59e0b':isAsk?C.blue:C.green;
  const icon=item.type==='error'?'✕':item.type==='warning'?'⚠':isAsk?'📧':'✓';
  return(
    <div style={{background:C.card,border:`1px solid ${C.border2}`,borderRadius:12,padding:'12px 16px',boxShadow:'0 8px 32px #0004',minWidth:260,maxWidth:360,animation:exiting?'fadeOut .3s ease forwards':'fadeInUp .3s ease',position:'relative',overflow:'hidden'}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <div style={{width:28,height:28,borderRadius:'50%',background:bg+'20',border:`1px solid ${bg}40`,display:'flex',alignItems:'center',justifyContent:'center',color:bg,fontWeight:700,fontSize:14,flexShrink:0}}>{icon}</div>
        <div style={{flex:1,fontSize:13,color:C.text,lineHeight:1.4}}>{item.msg}</div>
        {isConfirm&&<button onClick={handleCancel} style={{background:'#ef444420',color:C.red,border:'1px solid #ef444440',borderRadius:7,padding:'4px 10px',fontSize:12,fontWeight:700,cursor:'pointer',flexShrink:0}}>{gT().cancel}</button>}
        {isAsk&&<div style={{display:'flex',gap:6,flexShrink:0}}>
          <button onClick={()=>{cancelled.current=true;closeToast();item.action();}} style={{background:C.blue,color:'#fff',border:'none',borderRadius:7,padding:'4px 10px',fontSize:12,fontWeight:700,cursor:'pointer'}}>{gT().toastSend}</button>
          <button onClick={()=>{cancelled.current=true;closeToast();}} style={{background:'transparent',color:C.muted,border:`1px solid ${C.border2}`,borderRadius:7,padding:'4px 10px',fontSize:12,fontWeight:700,cursor:'pointer'}}>No</button>
        </div>}
        {!isConfirm&&!isAsk&&<button onClick={closeToast} style={{background:'transparent',border:'none',cursor:'pointer',color:C.muted,fontSize:16,padding:'0 2px',lineHeight:1}}>✕</button>}
      </div>
      <div style={{position:'absolute',bottom:0,left:0,height:3,background:bg,width:progress+'%',transition:'width 50ms linear',borderRadius:'0 0 0 12px'}}/>
    </div>
  );
}

function ToastContainer(){
  const [toasts,setToasts]=React.useState([]);
  _toastDispatch=React.useCallback((item)=>{setToasts(t=>[...t,{...item,id:Date.now()+Math.random()}]);},[]);
  const remove=React.useCallback((id)=>setToasts(t=>t.filter(x=>x.id!==id)),[]);
  if(!toasts.length)return null;
  return ReactDOM.createPortal(
    <div style={{position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',zIndex:9999,display:'flex',flexDirection:'column',gap:8,alignItems:'center',pointerEvents:'none'}}>
      {toasts.map(t=><div key={t.id} style={{pointerEvents:'all'}}><ToastItem item={t} onRemove={remove}/></div>)}
    </div>,
    document.body
  );
}

// ── DATE MASK HELPER (GG/MM/AAAA) ──
function dateMaskHandle(raw, prev) {
  var digits = raw.replace(/\D/g, '').slice(0, 8);
  var out = '';
  for (var i = 0; i < digits.length; i++) {
    if (i === 2 || i === 4) out += '/';
    out += digits[i];
  }
  return out;
}
function dateMaskValidate(val) {
  if (!val) return null;
  var T = gT();
  if (val.length > 0 && val.length < 10) return T.errDateFormat;
  if (val.length === 10) {
    var p = val.split('/');
    var dd = +p[0], mm = +p[1], yyyy = +p[2];
    if (dd < 1 || dd > 31) return T.errDayInvalid;
    if (mm < 1 || mm > 12) return T.errMonthInvalid;
    if (yyyy < 1900 || yyyy > new Date().getFullYear()) return T.errYearInvalid + ' (1900-' + new Date().getFullYear() + ')';
    var date = new Date(yyyy, mm - 1, dd);
    if (date.getDate() !== dd || date.getMonth() !== mm - 1 || date.getFullYear() !== yyyy) return T.errDateNonExistent;
    if (date >= new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate() + 1)) return T.errDateFuture;
  }
  return null;
}

function StatCard({label,value,sub,color=C.blue,icon,delay,onClick}){
  var numVal=typeof value==='number'?value:parseInt(value,10);
  var isNum=!isNaN(numVal)&&typeof value==='number';
  var ref2=useRef(null);
  var counted=useRef(false);
  var hoverRef=useRef(null);
  useEffect(function(){
    if(!isNum||counted.current||!ref2.current)return;
    counted.current=true;
    var start=0;var end=numVal;var duration=600;var startTime=null;
    function animate(ts){
      if(!startTime)startTime=ts;
      var progress=Math.min((ts-startTime)/duration,1);
      var current=Math.round(progress*end);
      if(ref2.current)ref2.current.textContent=current;
      if(progress<1)requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  },[numVal,isNum]);
  var dl=delay||0;
  return(
    <div ref={hoverRef} onClick={onClick||undefined} onMouseEnter={function(){if(onClick&&hoverRef.current)hoverRef.current.style.borderColor=C.blue;}} onMouseLeave={function(){if(onClick&&hoverRef.current)hoverRef.current.style.borderColor='';}} style={{...S.kpi(color),background:'linear-gradient(135deg,'+color+'08,'+color+'15)',borderLeft:'3px solid '+color,animation:'fadeInUp .3s ease both',animationDelay:dl+'s',cursor:onClick?'pointer':'default',transition:'all .2s'}}>
      {icon&&<div style={{position:'absolute',top:8,right:10,fontSize:32,opacity:0.15,lineHeight:1}}>{icon}</div>}
      <div style={{position:'absolute',top:0,right:0,width:44,height:44,borderRadius:'0 11px 0 44px',background:color+'15'}}/>
      <div style={{fontSize:10,color:C.muted,fontWeight:600,textTransform:'uppercase',letterSpacing:.8,marginBottom:5}}>{label}</div>
      <div ref={ref2} style={{fontSize:28,fontWeight:900,color:C.strong,lineHeight:1}}>{value}</div>
      {sub&&<div style={{fontSize:11,color:color,fontWeight:600,marginTop:3}}>{sub}</div>}
    </div>
  );
}

function Dashboard({patients,bookings,T,onNavigate,trainerProfile,onboardingStep,onCreateClient,onStartWizard,onOpenPatient,onValuta}){
  const [metricsOpen,setMetricsOpen]=useState(false);
  const today=fmtDate();
  const todayBookings=bookings.filter(b=>new Date(b.data).toLocaleDateString('it-IT')===today);
  const totSedute=patients.reduce((a,p)=>a+(p.log?.length||0),0);
  var nextAppt=todayBookings.sort(function(a,b2){return(a.ora||'').localeCompare(b2.ora||'')})[0];
  var nextApptLabel=T.dashNextSession;
  var nextApptVal=nextAppt?nextAppt.ora:'--:--';
  var nextApptSub=nextAppt?(function(){var pp=patients.find(function(x){return x.id===nextAppt.patientId});return pp?(pp.nome+' '+pp.cognome):'';})():T.dashNoneToday;
  var hasAssessment=function(p){return !!(p&&p.test&&(p.test.mwtDist||p.test.stsRip));};
  var hasProgram=function(p){return !!(p&&p.programma&&p.programma.sedute);};
  var fullName=function(p){return p?(p.nome+' '+p.cognome).trim():'';};
  var parseItDate=function(s){if(!s)return 0;var m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s);if(m)return new Date(+m[3],+m[2]-1,+m[1]).getTime();var t=Date.parse(s);return isNaN(t)?0:t;};

  var showOnboarding=typeof onboardingStep==='number'&&onboardingStep<4;
  var onbIcon='',onbMsg='',onbBtn='',onbAction=null;
  if(showOnboarding){
    var tpName=trainerProfile&&(trainerProfile.nome||trainerProfile.displayName)||'';
    if(onboardingStep===0){
      onbIcon='👤';
      onbMsg=T.onbWelcome+(tpName?' '+tpName:'')+'! '+T.onbCreateClientMsg;
      onbBtn=T.onbCreateClientBtn+' →';
      onbAction=function(){if(onCreateClient)onCreateClient();else if(onNavigate)onNavigate('patients');};
    }else if(onboardingStep===1){
      var pNoEval=patients.find(function(p){return !hasAssessment(p);});
      var nmEval=fullName(pNoEval);
      onbIcon='📋';
      onbMsg=T.onbEvaluateMsg+(nmEval?' '+nmEval:'');
      onbBtn=T.onbEvaluateBtn+(nmEval?' '+nmEval:'')+' →';
      onbAction=function(){if(onStartWizard)onStartWizard();};
    }else if(onboardingStep===2){
      var pNoProg=patients.find(function(p){return hasAssessment(p)&&!hasProgram(p);});
      var nmProg=fullName(pNoProg);
      onbIcon='🏆';
      onbMsg=T.onbGenerateMsg+(nmProg?' '+nmProg:'');
      onbBtn=T.onbGenerateBtn+' →';
      onbAction=function(){if(onOpenPatient&&pNoProg)onOpenPatient(pNoProg.id);};
    }else if(onboardingStep===3){
      var pWithProg=patients.find(hasProgram);
      var nmPdf=fullName(pWithProg);
      onbIcon='📄';
      onbMsg=T.onbExportMsg+(nmPdf?' '+nmPdf:'');
      onbBtn=T.onbExportBtn+' →';
      onbAction=function(){if(onOpenPatient&&pWithProg)onOpenPatient(pWithProg.id);};
    }
  }
  var topNudge=null;
  if(onboardingStep===4&&patients.length>0){
    var nowTs=Date.now();
    var in7=nowTs+7*86400000;
    var cutoff30=nowTs-30*86400000;
    var sortedByOld=patients.slice().sort(function(a,b2){return(a.id||0)-(b2.id||0);});
    var nudgeRules=[
      {icon:'📋',msgKey:'nudgeNoEval',btnKey:'nudgeEvalNow',
        match:function(p){return !hasAssessment(p);},
        act:function(p){if(onValuta)onValuta(p);else if(onStartWizard)onStartWizard();}},
      {icon:'🏆',msgKey:'nudgeGenProg',btnKey:'nudgeGenNow',
        match:function(p){return hasAssessment(p)&&!hasProgram(p);},
        act:function(p){if(onOpenPatient)onOpenPatient(p.id);}},
      {icon:'📅',msgKey:'nudgeBookSession',btnKey:'nudgeBookNow',
        match:function(p){if(!hasProgram(p))return false;var hasUpcoming=(bookings||[]).some(function(b2){if(b2.patientId!==p.id)return false;var t=new Date(b2.data).getTime();return !isNaN(t)&&t>=nowTs&&t<=in7;});return !hasUpcoming;},
        act:function(){if(onNavigate)onNavigate('calendar');}},
      {icon:'🔄',msgKey:'nudgeReeval',btnKey:'nudgeReevalNow',
        match:function(p){if(!hasAssessment(p))return false;var ts=parseItDate(p.dataValutazione);return ts>0&&ts<cutoff30;},
        act:function(p){if(onValuta)onValuta(p);else if(onStartWizard)onStartWizard();}},
    ];
    for(var ri=0;ri<nudgeRules.length&&!topNudge;ri++){
      var rule=nudgeRules[ri];
      var matched=sortedByOld.find(rule.match);
      if(matched){
        var nm=fullName(matched);
        topNudge={icon:rule.icon,name:nm,msg:T[rule.msgKey].replace('{name}',nm),btn:T[rule.btnKey],action:(function(r,p){return function(){r.act(p);};})(rule,matched)};
      }
    }
  }
  return(
    <div style={{animation:'fadeInUp .3s ease'}}>
      {showOnboarding&&<div style={{background:'linear-gradient(135deg,rgba(59,130,246,.10),rgba(139,92,246,.08))',border:'1px solid rgba(59,130,246,.2)',borderRadius:16,padding:isMobile?24:32,textAlign:'center',marginBottom:16}}>
        <div style={{fontSize:isMobile?44:56,lineHeight:1,marginBottom:12}}>{onbIcon}</div>
        <div style={{fontSize:isMobile?16:20,fontWeight:800,color:C.strong,marginBottom:18,lineHeight:1.35}}>{onbMsg}</div>

        <div style={{marginTop:18,display:'flex',alignItems:'center',justifyContent:'center',gap:10,fontSize:11,color:C.muted}}>
          <span>{T.onbStep} {onboardingStep+1} {T.onbOf} 4</span>
          <div style={{display:'flex',gap:5}}>
            {[0,1,2,3].map(function(i){return <div key={i} style={{width:8,height:8,borderRadius:'50%',background:i<=onboardingStep?C.blue:(C.border2||'#374151')}}/>;})}
          </div>
        </div>
      </div>}
      {topNudge&&<div style={{background:C.card,border:'1px solid '+C.border2,borderRadius:14,padding:isMobile?16:20,display:'flex',alignItems:'center',gap:isMobile?12:16,marginBottom:16,flexWrap:isMobile?'wrap':'nowrap'}}>
        <div style={{fontSize:isMobile?24:28,lineHeight:1,flexShrink:0}}>{topNudge.icon}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:isMobile?13:14,fontWeight:800,color:C.strong,marginBottom:2}}>{topNudge.name}</div>
