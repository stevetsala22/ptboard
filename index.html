var checkOnboardingEmails=async function(uid,profile){
  if(!profile||!profile.email)return;
  if(!profile.createdAt)return;
  var created=profile.createdAt;
  if(typeof created==='string')created=new Date(created);
  if(created.toDate)created=created.toDate();
  var now=new Date();
  var daysSinceReg=Math.floor((now-created)/(1000*60*60*24));
  var sentEmails=profile.onboardingSent||{};
  var hasActivePlan=profile.plan&&profile.plan!=='trial'&&profile.planExpiresAt&&new Date(profile.planExpiresAt)>now;
  var toSend=ONBOARDING_EMAILS.filter(function(e){
    if(daysSinceReg<e.day||sentEmails[e.key])return false;
    if(e.requireNoActivePlan&&hasActivePlan)return false;
    return true;
  });
  if(toSend.length===0)return;
  var trainerName=profile.nome||(profile.email.split('@')[0]);
  for(var i=0;i<toSend.length;i++){
    var e=toSend[i];
    var result=await sendBrevoEmail(profile.email,trainerName,e.templateId);
    if(result.ok){
      sentEmails[e.key]=new Date().toISOString();
      console.log('Onboarding email sent:',e.key,'to',profile.email);
    }
  }
  await fbDb.collection('users').doc(uid).update({onboardingSent:sentEmails});
};

<script>
var ttTimer=null;
document.addEventListener('mouseover',function(e){
  var wrap=e.target.closest('.tt');
  if(!wrap)return;
  var tp=wrap.querySelector('.tp');
  if(!tp)return;
  if(ttTimer)clearTimeout(ttTimer);
  ttTimer=setTimeout(function(){
    var rect=wrap.getBoundingClientRect();
    var tw=tp.offsetWidth||150;
    var th=tp.offsetHeight||28;
    var mg=8;
    var vw=window.innerWidth;
    var vh=window.innerHeight;
    var top=rect.bottom+mg;
    var left=rect.left+rect.width/2-tw/2;
    if(left+tw>vw-mg)left=vw-tw-mg;
    if(left<mg)left=mg;
    if(top+th>vh-mg)top=rect.top-th-mg;
    tp.style.top=top+'px';
    tp.style.left=left+'px';
    tp.style.opacity='1';
  },800);
});
document.addEventListener('mouseout',function(e){
  var wrap=e.target.closest('.tt');
  if(!wrap)return;
  if(ttTimer){clearTimeout(ttTimer);ttTimer=null;}
  var tp=wrap.querySelector('.tp');
  if(tp)tp.style.opacity='0';
});
</script>

<script type="text/babel" data-presets="react">
(function(){
const {useState,useMemo,useEffect,useRef,useCallback}=React;
const TRIAL_DAYS=window.TRIAL_DAYS||15;
const isTrialExpired=(profile)=>{
  if(!profile) return false;
  if(profile.plan==='pro'||profile.plan==='team'||profile.plan==='admin') return false;
  if(!profile.trialStart) return false;
  const days=(Date.now()-profile.trialStart)/(1000*60*60*24);
  return days>TRIAL_DAYS;
};
const trialDaysLeft=(profile)=>{
  if(!profile?.trialStart) return TRIAL_DAYS;
  const used=(Date.now()-profile.trialStart)/(1000*60*60*24);
  return Math.max(0,Math.ceil(TRIAL_DAYS-used));
};

const SK='fitmanager_v4';
const load=()=>{try{const s=localStorage.getItem(SK);return s?JSON.parse(s):null}catch{return null}};
const save=(d)=>{try{localStorage.setItem(SK,JSON.stringify(d))}catch{}};

// ── HTML SANITIZATION (anti-XSS) ────────────────────────────────────────────
const esc=(s)=>{
  if(s===null||s===undefined)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
};

// ── CSV EXPORT ──────────────────────────────────────────────────────────────
const exportCSV=(patients)=>{
  const headers=['ID','Cognome','Nome','Sesso','Data nascita','Altezza (cm)','Peso (kg)','BMI','Profilo','Attività','Obiettivo','Patologie','Farmaci','6MWT (m)','STS 30s (rip)','Sedute totali','Data valutazione'];
  const rows=patients.map(p=>{
    const b=bmi(p.peso,p.altezza);
    const pr=profilo(p.test?.mwtDist,p.test?.stsRip,p.sesso,p.test,{biaFM:p.bia?.FM},p.annoNascita?new Date().getFullYear()-p.annoNascita:50);
    return [p.id,p.cognome,p.nome,p.sesso,p.ddn,p.altezza,p.peso,b||'',pr?.code||'',p.attivita,p.obiettivo,p.patologie,p.farmaci,p.test?.mwtDist,p.test?.stsRip,p.log?.length||0,p.dataValutazione].map(v=>{
      const s=String(v??'');
      return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.split('"').join('""')+'"':s;
    });
  });
  const csv=[headers.join(','),...rows.map(r=>r.join(','))].join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='clienti_ptboard_'+fmtDate().replace(/\//g,'-')+'.csv';
  a.click();URL.revokeObjectURL(url);
};

const exportPDFLista=(patients,trainerProfile)=>{
  const pdfC=trainerProfile?.primaryColor||'#3b82f6';
  const nomeStudio=trainerProfile?.nomeStudio||'PT Board';
  const logoHtml=trainerProfile?.logo?'<img src="'+trainerProfile.logo+'" alt="logo" style="max-height:50px;object-fit:contain"/>':'<div style="font-size:22px;font-weight:900;color:'+pdfC+'">PT Board</div>';
  const dataOggi=new Date().toLocaleDateString('it-IT');
  const totSedute=patients.reduce((a,p)=>a+(p.log?.length||0),0);
  const righe=patients.map((p,i)=>{
    const b=p.peso&&p.altezza?(p.peso/(p.altezza/100)**2).toFixed(1):'—';
    const pr=profilo(p.test?.mwtDist,p.test?.stsRip,p.sesso,p.test,{biaFM:p.bia?.FM},p.annoNascita?new Date().getFullYear()-p.annoNascita:50);
    const bg=i%2===0?'#f8fafc':'#ffffff';
    return '<tr style="background:'+bg+'">'+
      '<td style="padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:12px;color:#1e293b;font-weight:600">'+esc(p.nome)+' '+esc(p.cognome)+'</td>'+
      '<td style="padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:12px;color:#64748b">'+esc(p.sesso||'—')+'</td>'+
      '<td style="padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:12px;color:#1e293b">'+(p.peso?p.peso+' kg':'—')+'</td>'+
      '<td style="padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:12px;color:#1e293b">'+b+'</td>'+
      '<td style="padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:12px;text-align:center">'+(pr?'<span style="background:'+(pr.c)+'20;color:'+pr.c+';padding:2px 8px;border-radius:10px;font-weight:700;font-size:11px">'+pr.code+'</span>':'—')+'</td>'+
      '<td style="padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:12px;color:#64748b">'+esc(p.obiettivo||'—')+'</td>'+
      '<td style="padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:12px;color:#64748b">'+esc(p.patologie||'—')+'</td>'+
      '<td style="padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:12px;color:#1e293b;text-align:center">'+(p.log?.length||0)+'</td>'+
      '<td style="padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:12px;color:#64748b">'+esc(p.dataValutazione||'—')+'</td>'+
    '</tr>';
  }).join('');
  const html='<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Lista Clienti — '+nomeStudio+'</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Segoe UI",Arial,sans-serif;background:#fff;color:#1e293b}@media print{.no-print{display:none!important}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body>'+
    '<div class="no-print" style="position:sticky;top:0;background:#1e293b;padding:12px 16px;display:flex;gap:10px;justify-content:center;border-bottom:2px solid '+pdfC+'">'+
    '<button onclick="window.close()" style="background:#334155;color:#fff;border:1px solid #475569;padding:11px 22px;border-radius:9px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit">← Torna all\'app</button>'+
    '<button onclick="window.print()" style="background:'+pdfC+';color:#fff;border:none;padding:11px 22px;border-radius:9px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit">🖨️ Stampa / Salva PDF</button>'+
    '</div>'+
    '<div style="max-width:1100px;margin:0 auto;padding:40px">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid '+pdfC+';padding-bottom:20px;margin-bottom:24px">'+
    '<div>'+logoHtml+'<div style="font-size:11px;color:#64748b;margin-top:8px">Lista clienti — '+dataOggi+'</div></div>'+
    '<div style="text-align:right"><div style="font-size:20px;font-weight:800;color:#1e293b">'+patients.length+' Clienti</div><div style="font-size:13px;color:#64748b;margin-top:4px">'+totSedute+' sedute totali</div></div>'+
    '</div>'+
    '<table style="width:100%;border-collapse:collapse">'+
    '<thead><tr style="background:'+pdfC+'">'+
    '<th style="text-align:left;color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;padding:10px">Cliente</th>'+
    '<th style="text-align:left;color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;padding:10px">Sesso</th>'+
    '<th style="text-align:left;color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;padding:10px">Peso</th>'+
    '<th style="text-align:left;color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;padding:10px">BMI</th>'+
    '<th style="text-align:center;color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;padding:10px">Profilo</th>'+
    '<th style="text-align:left;color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;padding:10px">Obiettivo</th>'+
    '<th style="text-align:left;color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;padding:10px">Patologie</th>'+
    '<th style="text-align:center;color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;padding:10px">Sedute</th>'+
    '<th style="text-align:left;color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;padding:10px">Ultima val.</th>'+
    '</tr></thead>'+
    '<tbody>'+righe+'</tbody>'+
    '</table>'+
    '<div style="margin-top:40px;padding-top:16px;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between"><div style="font-size:10px;color:#94a3b8">'+nomeStudio+' · Lista clienti generata il '+dataOggi+'</div><div style="font-size:10px;color:#94a3b8">'+patients.length+' clienti</div></div>'+
    '</div></body></html>';
  const w=window.open('','_blank');
  w.document.write(html);
  w.document.close();
};

// ── TABELLE NORMATIVE PER ETÀ E SESSO ────────────────────────────────────────
// Bohannon & Crouch 2017 — 6MWT distanza media attesa (m)
var mwtNorms={
  M:{20:695,30:669,40:643,50:617,60:591,65:578,70:553,75:528,80:503},
  F:{20:660,30:634,40:608,50:582,60:556,65:543,70:518,75:493,80:468}
};
// Rikli & Jones 1999 — STS 30s ripetizioni medie
var stsNorms={
  M:{25:20,30:19,35:18,40:17,45:16,50:15,55:14,60:14,65:13,70:12,75:11,80:10,85:9},
  F:{25:18,30:17,35:16,40:15,45:15,50:14,55:13,60:13,65:12,70:11,75:10,80:9,85:8}
};
// Dodds 2014 — Handgrip forza media (kg)
var hgNorms={
  M:{25:50,30:51,35:51,40:50,45:48,50:46,55:44,60:42,65:39,70:36,75:33,80:30},
  F:{25:31,30:32,35:32,40:31,45:30,50:28,55:27,60:25,65:23,70:22,75:20,80:18}
};
// Bohannon 2006 — TUG tempo medio (s)
var tugNorms={20:8.0,30:8.0,40:8.0,50:9.0,60:9.5,65:10.0,70:11.0,75:12.0,80:13.5};

function getNormInterp(norms,eta){
  var ages=Object.keys(norms).map(Number).sort(function(a,b){return a-b;});
  if(eta<=ages[0])return norms[ages[0]];
  if(eta>=ages[ages.length-1])return norms[ages[ages.length-1]];
  for(var i=0;i<ages.length-1;i++){
    if(eta>=ages[i]&&eta<=ages[i+1]){
      var ratio=(eta-ages[i])/(ages[i+1]-ages[i]);
      return norms[ages[i]]+ratio*(norms[ages[i+1]]-norms[ages[i]]);
    }
  }
  return norms[ages[Math.floor(ages.length/2)]];
}
function getMwtNorm(sesso,eta){return getNormInterp((mwtNorms[sesso]||mwtNorms['M']),eta);}
function getStsNorm(sesso,eta){return getNormInterp((stsNorms[sesso]||stsNorms['M']),eta);}
function getHgNorm(sesso,eta){return getNormInterp((hgNorms[sesso]||hgNorms['M']),eta);}
function getTugNorm(eta){return getNormInterp(tugNorms,eta);}

// ── STIMA AUTOMATICA TEST da dati anagrafici ─────────────────────────────────
// Stima i valori di tutti i test partendo da {eta, sesso, peso, altezza, attivita}
// Formule: 6MWT Enright & Sherrill 1998, STS Jones 1999, Push-up ACSM, Plank norme medie,
// Handgrip Dodds 2014 (getHgNorm), TUG Bohannon 2006 (getTugNorm).
function stimaTest(params){
  var eta=+params.eta||40;
  var sesso=params.sesso==='F'?'F':'M';
  var peso=+params.peso||70;
  var altezza=+params.altezza||170;
  var att=params.attivita||'Moderata';
  // Normalizza attività: gestisci sia "Moderata" che "Moderatamente attiva"
  if(att==='Moderatamente attiva')att='Moderata';
  // Fattori moltiplicativi per livello attività
  var f6={Sedentaria:0.85,'Poco attiva':0.92,Moderata:1.0,Attiva:1.08,'Molto attiva':1.15}[att]||1.0;
  var fSts={Sedentaria:0.75,'Poco attiva':0.9,Moderata:1.0,Attiva:1.15,'Molto attiva':1.3}[att]||1.0;
  var fHg={Sedentaria:0.85,'Poco attiva':0.95,Moderata:1.0,Attiva:1.1,'Molto attiva':1.15}[att]||1.0;
  var fTug={Sedentaria:1.2,'Poco attiva':1.1,Moderata:1.0,Attiva:0.85,'Molto attiva':0.8}[att]||1.0;
  // 6MWT — Enright & Sherrill 1998 (in metri)
  var mwt;
  if(sesso==='M')mwt=(7.57*altezza)-(5.02*eta)-(1.76*peso)-309;
  else mwt=(2.11*altezza)-(2.29*peso)-(5.78*eta)+667;
  mwt=Math.round(mwt*f6);
  if(mwt<200)mwt=200;
  if(mwt>800)mwt=800;
  // STS 30s — Jones 1999 (ripetizioni)
  var stsTbl={
    M:{20:20,30:18,40:16,50:14,60:12,70:10,80:8},
    F:{20:17,30:16,40:14,50:13,60:11,70:9,80:7}
  };
  var bandSts=eta<30?20:eta<40?30:eta<50?40:eta<60?50:eta<70?60:eta<80?70:80;
  var sts=Math.round((stsTbl[sesso][bandSts]||10)*fSts);
  if(sts<4)sts=4;
  // Push-up — norme ACSM (ripetizioni)
  var pushTbl={
    M:{20:28,30:22,40:17,50:13,60:10,70:8},
    F:{20:20,30:16,40:12,50:9,60:6,70:5}
  };
  var bandPush=eta<30?20:eta<40?30:eta<50?40:eta<60?50:eta<70?60:70;
  var push=Math.round((pushTbl[sesso][bandPush]||5)*fSts);
  if(push<2)push=2;
  // Plank — norme medie per età (secondi); donne -15%
  var plankTbl={20:75,30:65,40:55,50:45,60:35,70:25,80:18};
  var bandPlank=eta<30?20:eta<40?30:eta<50?40:eta<60?50:eta<70?60:eta<80?70:80;
  var plank=plankTbl[bandPlank]||30;
  plank=Math.round(plank*fSts*(sesso==='F'?0.85:1));
  if(plank<10)plank=10;
  // Handgrip — Dodds 2014 (kg)
  var hg=Math.round(getHgNorm(sesso,eta)*fHg);
  // TUG — Bohannon 2006 (secondi, meno è meglio)
  var tug=+(getTugNorm(eta)*fTug).toFixed(1);
  return {mwtDist:mwt,stsRip:sts,pushupRip:push,plankSec:plank,handgrip:hg,tugSec:tug};
}

// ── CLASSIFICAZIONE PESATA SCIENTIFICA ────────────────────────────────────────
const calcScore=(test,sesso,extra,eta)=>{
  // test = {mwtDist, stsRip, handgrip, tugSec, biaFM/massaGrassa, ...}
  // extra = {biaFM} from bia object or massaGrassa from test
  // eta = età del cliente (default 50)
  if(!eta||eta<10||eta>120)eta=50;
  const m=sesso==='M';
  const components=[];
  // 1. CAPACITÀ AEROBICA (peso 40%) — 6MWT — Bohannon & Crouch 2017
  // Scoring granulare per discriminare meglio la fascia alta
  if(test?.mwtDist&&+test.mwtDist>0){
    const d=+test.mwtDist;
    const norm=getMwtNorm(sesso,eta);
    const ratio=d/norm;
    const s=ratio>=1.3?100:ratio>=1.2?95:ratio>=1.1?90:ratio>=1.0?80:ratio>=0.9?70:ratio>=0.8?55:ratio>=0.7?40:ratio>=0.5?25:10;
    components.push({id:'aerobica',label:'Capacita aerobica (6MWT)',w:40,score:s,val:d+'m (norma '+Math.round(norm)+'m per '+(m?'uomo':'donna')+' '+eta+' anni)',icon:'🚶'});
  }
  // 2. FORZA (peso 30%) — media STS + Handgrip
  // STS — Rikli & Jones 1999
  let stsS=null;
  if(test?.stsRip&&+test.stsRip>0){
    const rip=+test.stsRip;
    const norm=getStsNorm(sesso,eta);
    const ratio=rip/norm;
    stsS=ratio>=1.3?100:ratio>=1.2?95:ratio>=1.1?90:ratio>=1.0?80:ratio>=0.8?60:ratio>=0.6?40:20;
  }
  // Handgrip — Dodds 2014
  const hg=test?.handgrip&&+test.handgrip>0?+test.handgrip:null;
  let hgS=null;
  if(hg!==null){
    const norm=getHgNorm(sesso,eta);
    const ratio=hg/norm;
    hgS=ratio>=1.3?100:ratio>=1.2?95:ratio>=1.1?90:ratio>=1.0?80:ratio>=0.8?60:ratio>=0.6?40:20;
  }
  let forzaScore=null,forzaVal='';
  if(stsS!==null&&hgS!==null){forzaScore=Math.round((stsS+hgS)/2);forzaVal='STS '+test.stsRip+' rip + HG '+hg+'kg';}
  else if(stsS!==null){forzaScore=stsS;forzaVal='STS '+test.stsRip+' rip';}
  else if(hgS!==null){forzaScore=hgS;forzaVal='HG '+hg+'kg';}
  if(forzaScore!==null) components.push({id:'forza',label:'Forza (STS + Handgrip)',w:30,score:forzaScore,val:forzaVal,icon:'💪'});
  // 3. COMPOSIZIONE CORPOREA (peso 20%) — FM% — ACSM/ACE con modulazione età
  // Scoring più granulare per la fascia fitness
  const fm=extra?.biaFM?+extra.biaFM:(test?.massaGrassa?+test.massaGrassa:(test?.biaFM?+test.biaFM:null));
  if(fm!==null&&fm>0){
    let cs;
    const fmAdjust=Math.max(0,Math.floor((eta-30)/10));
    if(m){cs=fm<6+fmAdjust?100:fm<10+fmAdjust?95:fm<14+fmAdjust?85:fm<18+fmAdjust?70:fm<25+fmAdjust?50:25;}
    else{cs=fm<14+fmAdjust?100:fm<18+fmAdjust?95:fm<21+fmAdjust?85:fm<25+fmAdjust?70:fm<32+fmAdjust?50:25;}
    components.push({id:'corpo',label:'Composizione corporea (FM%)',w:20,score:cs,val:fm+'%',icon:'📏'});
  }
  // 4. EQUILIBRIO (peso 10%) — TUG — Bohannon 2006 (meno è meglio)
  if(test?.tugSec&&+test.tugSec>0){
    const t=+test.tugSec;
    const norm=getTugNorm(eta);
    const ratio=t/norm;
    const ts=ratio<=0.7?100:ratio<=0.8?95:ratio<=0.85?90:ratio<=1.0?80:ratio<=1.3?55:ratio<=1.6?30:10;
    components.push({id:'equilibrio',label:'Equilibrio (TUG)',w:10,score:ts,val:t+'s (norma '+norm.toFixed(1)+'s per '+eta+' anni)',icon:'⏱'});
  }
  // Minimo: almeno 6MWT o STS
  if(components.length===0)return null;
  if(!components.find(c=>c.id==='aerobica')&&!components.find(c=>c.id==='forza'))return null;
  // Calcolo media pesata normalizzata
  const totalW=components.reduce((a,c)=>a+c.w,0);
  const score=Math.round(components.reduce((a,c)=>a+c.score*(c.w/totalW),0));
  // Componenti mancanti
  const allIds=['aerobica','forza','corpo','equilibrio'];
  const missing=allIds.filter(id=>!components.find(c=>c.id===id));
  const missingLabels={aerobica:'6MWT',forza:'STS o Handgrip',corpo:'FM% (BIA o plicometria)',equilibrio:'TUG'};
  // Risultato — soglie aggiornate per norme età, con livello C+ per atleti
  let code,l,c,bg;
  if(score>=90){code='C+';l=gT().profileExcellent;c='#3b82f6';bg='#dbeafe';}
  else if(score>=75){code='C';l=gT().profileGood;c=C.green;bg='#d1fae5';}
  else if(score>=45){code='B';l=gT().profileMed;c=C.yellow;bg='#fef3c7';}
  else{code='A';l=gT().profileLow;c=C.red;bg='#fee2e2';}
  return{code,l,c,bg,score,components,missing:missing.map(id=>missingLabels[id])};
};

// Wrapper retrocompatibile — stessa interfaccia {code,l,c,bg}
const profilo=(mwt,sts,sesso,test,extra,eta)=>{
  // Chiamata legacy con solo mwt,sts → costruisci test minimale
  const t=test||{mwtDist:mwt,stsRip:sts};
  const r=calcScore(t,sesso||'M',extra,eta||50);
  return r;
};
const calcNutrizione=(p)=>{
  if(!p)return null;
  var T=gT();
  var eta=p.annoNascita?(new Date().getFullYear()-p.annoNascita):null;
  var peso=p.peso?+p.peso:null;
  var altezza=p.altezza?+p.altezza:null;
  // STEP 1 — BMR
  var bmr;
  if(p.bia?.FM&&peso){
    var ffm=peso*(1-(+p.bia.FM)/100);
    bmr=370+(21.6*ffm);
  }else{
    if(!eta||!peso||!altezza)return null;
    if(p.sesso==='M')bmr=(10*peso)+(6.25*altezza)-(5*eta)+5;
    else bmr=(10*peso)+(6.25*altezza)-(5*eta)-161;
  }
  if(!eta&&peso&&altezza){eta=50;}
  if(p.patologie){var pat0=p.patologie.toLowerCase();if(pat0.includes('tiroidea')||pat0.includes('ipotiroidismo'))bmr*=0.90;}
  if(p.fumo==='Fumatore regolare')bmr+=200;else if(p.fumo==='Fumatore occasionale')bmr+=100;
  // FC max — Tanaka 2001
  var fcMaxCalc=eta?Math.round(208-(0.7*eta)):null;
  // STEP 2 — TDEE
  var fattori={'Sedentaria':1.2,'Poco attiva':1.375,'Moderata':1.55,'Attiva':1.725,'Molto attiva':1.9};
  var fattore=fattori[p.attivita]||1.4;
  var tdee=bmr*fattore;
  // STEP 3 — Calorie target (ISSN 2017, ACSM Position Stand)
  var obiettivoMap={
    'Perdere peso':{molt:0.80,note:T.nutObPesoNote},
    'Aumentare massa':{molt:1.15,note:T.nutObMassaNote},
    'Resistenza':{molt:1.05,note:T.nutObResNote},
    'Forza':{molt:1.10,note:T.nutObForzaNote},
    'Salute':{molt:1.0,note:T.nutObSaluteNote},
    'Riabilitazione':{molt:1.0,note:T.nutObRiabNote},
    'Performance':{molt:1.10,note:T.nutObPerfNote},
    'Benessere':{molt:1.0,note:T.nutObBenNote}
  };
  var obInfo=obiettivoMap[p.obiettivo]||{molt:1.0,note:T.nutObBenNote};
  var molt=obInfo.molt;
  var kcal=Math.round(tdee*molt);
  if(p.stressPercepito==='Alto'||p.stressPercepito==='Molto alto')kcal=Math.round(kcal*1.05);
  // Cap sul deficit: mai sotto BMR * 1.2
  if(kcal<bmr*1.2)kcal=Math.round(bmr*1.2);
  // STEP 4 — Macros (ISSN Position Stand 2017)
  var protMap={
    'Perdere peso':{perKg:2.3,ref:T.nutProtPesoRef},
    'Aumentare massa':{perKg:1.8,ref:T.nutProtMassaRef},
    'Resistenza':{perKg:1.4,ref:T.nutProtResRef},
    'Forza':{perKg:2.0,ref:T.nutProtForzaRef},
    'Salute':{perKg:1.2,ref:T.nutProtSaluteRef},
    'Riabilitazione':{perKg:1.6,ref:T.nutProtRiabRef},
    'Performance':{perKg:1.8,ref:T.nutProtPerfRef},
    'Benessere':{perKg:1.2,ref:T.nutProtBenRef}
  };
  var protInfo=protMap[p.obiettivo]||{perKg:1.6,ref:''};
  var protPerKg=protInfo.perKg;
  // Aggiusta per età: sarcopenia prevention (Bauer 2013)
  if(eta&&eta>60)protPerKg+=0.2;
  // Aggiusta per sesso: massa magra proporzionalmente minore
  if(p.sesso==='F')protPerKg-=0.1;
  var pesoCalcolo=peso||70;
  var bmiVal=altezza&&peso?peso/((altezza/100)**2):null;
  if(bmiVal&&bmiVal>30)pesoCalcolo=24.9*((altezza/100)**2);
  var proteine=Math.round(protPerKg*pesoCalcolo);
  var kcalProt=proteine*4;
  // Grassi (ISSN + ACSM)
  var grassiMap={
    'Perdere peso':{pct:0.25,ref:T.nutFatPesoRef},
    'Aumentare massa':{pct:0.28,ref:T.nutFatMassaRef},
    'Resistenza':{pct:0.25,ref:T.nutFatResRef},
    'Forza':{pct:0.30,ref:T.nutFatForzaRef},
    'Salute':{pct:0.30,ref:T.nutFatSaluteRef},
    'Riabilitazione':{pct:0.28,ref:T.nutFatRiabRef},
    'Performance':{pct:0.25,ref:T.nutFatPerfRef},
    'Benessere':{pct:0.30,ref:T.nutFatBenRef}
  };
  var grassiInfo=grassiMap[p.obiettivo]||{pct:0.28,ref:''};
  var pctG=grassiInfo.pct;
  if(p.patologie){var pat1=p.patologie.toLowerCase();if(pat1.includes('dislipidemia')||pat1.includes('cardiopatia'))pctG=0.20;}
  // Mai sotto 20% (minimo per vitamine liposolubili)
  if(pctG<0.20)pctG=0.20;
  var grassi=Math.round((kcal*pctG)/9);
  var kcalGrassi=grassi*9;
  var carboidrati=Math.round((kcal-kcalProt-kcalGrassi)/4);
  if(carboidrati<0)carboidrati=0;
  // Minimo carboidrati per endurance/performance: 3 g/kg
  if((p.obiettivo==='Resistenza'||p.obiettivo==='Performance')&&peso){
    var minCarbo=Math.round(3*peso);
    if(carboidrati<minCarbo)carboidrati=minCarbo;
  }
  // Minimo 130g carboidrati in deficit (fabbisogno cerebrale)
  if(p.obiettivo==='Perdere peso'&&carboidrati<130)carboidrati=130;
  if(p.patologie){
    var pat2=p.patologie.toLowerCase();
    if(pat2.includes('diabete tipo 2')){var maxCarbo=Math.round((kcal*0.40)/4);if(carboidrati>maxCarbo){var diff=carboidrati-maxCarbo;carboidrati=maxCarbo;grassi+=Math.round((diff*4)/9);}}
    if(pat2.includes('diabete tipo 1')){if(carboidrati<130)carboidrati=130;}
  }
  // STEP 5 — Note
  var note=[];
  if(+p.sonno<6)note.push(T.nutNoteSleep);
  if(p.patologie){
    var pat3=p.patologie.toLowerCase();
    if(pat3.includes('ipertensione'))note.push(T.nutPatIpertNote);
    if(pat3.includes('diabete tipo 2'))note.push(T.nutPatDiabT2Note);
    if(pat3.includes('diabete tipo 1'))note.push(T.nutPatDiabT1Note);
    if(pat3.includes('dislipidemia'))note.push(T.nutPatDislipNote);
    if(pat3.includes('cardiopatia'))note.push(T.nutPatCardioNote);
    if(pat3.includes('osteoporosi'))note.push(T.nutPatOsteoNote);
    if(pat3.includes('artrosi')||pat3.includes('artrite'))note.push(T.nutPatArtrosiNote);
    if(pat3.includes('depressione')||pat3.includes('ansia'))note.push(T.nutPatDepressioneNote);
    if(pat3.includes('obesita'))note.push(T.nutPatObesitaNote);
    if(pat3.includes('tiroidea'))note.push(T.nutPatTiroideaNote);
  }
  if(p.allergie){
    var all=p.allergie.toLowerCase();
    if(all.includes('lattosio'))note.push(T.nutAllLattoNote);
    if(all.includes('glutine')||all.includes('celiachia'))note.push(T.nutAllGlutineNote);
    if(all.includes('nichel'))note.push(T.nutAllNichelNote);
  }
  if(p.alcol&&(p.alcol.includes('8-14')||p.alcol.includes('>14')))note.push(T.nutNoteAlcol);
  if(p.stressPercepito==='Alto'||p.stressPercepito==='Molto alto')note.push(T.nutNoteStress);
  // Note automatiche per età, BMI, obiettivo, FC, motivazione
  if(eta&&eta>65)note.push(T.nutNoteOver65.replace('{p}',protPerKg.toFixed(1)));
  if(p.obiettivo==='Perdere peso'&&bmiVal&&bmiVal>30)note.push(T.nutNotePesoIdeale.replace('{p}',pesoCalcolo.toFixed(0)));
  if(p.obiettivo==='Perdere peso'&&bmiVal&&bmiVal>=25&&bmiVal<=30)note.push(T.nutNoteDeficitMod);
  if(p.obiettivo==='Aumentare massa')note.push(T.nutNoteSurplus);
  if(p.fc&&+p.fc>80)note.push(T.nutNoteFcAlta);
  if(p.motivazione&&+p.motivazione<5)note.push(T.nutNoteMotBassa);
  note.push(T.nutNoteRefs+(p.bia?.FM?T.nutNoteRefsBia:'')+'.');
  note.push(T.nutNoteDisclaimer);
  return{kcal,proteine,carboidrati,grassi,note:note.join('\n'),formula:p.bia?.FM?'Katch-McArdle (BIA)':'Mifflin-St Jeor',protRef:protInfo.ref,grassiRef:grassiInfo.ref};
};

// ── 2. Handgrip — normativi Dodds 2014 (kg) ─────────────────────────────────
const interpHandgrip=(kg,sesso,eta)=>{
  if(!kg)return null;const T=gT();const v=+kg,m=sesso==='M',a=+eta||50;
  // Soglie basate su Dodds RM et al. (2014) "Grip strength across the life course" + cut-off sarcopenia EWGSOP2 2019
  if(m){
    const sarco=a<65?30:27; // EWGSOP2: <27 kg uomini anziani, <30 giovani adulti
    const ref=a<30?50:a<40?51:a<50?50:a<60?46:a<70?42:a<80?36:30; // mediane Dodds
    if(v<sarco)return{l:T.hgSarco,c:'#ef4444',cons:T.consHgSarcoMale.replace('{v}',v).replace('{sarco}',sarco)};
    if(v<ref*0.8)return{l:T.hgUnder,c:'#f59e0b',cons:T.consHgUnderMale.replace('{ref}',ref)};
    if(v<ref*1.1)return{l:T.average,c:'#10b981',cons:T.consHgAvgMale.replace('{ref}',ref)};
    return{l:T.hgAbove,c:'#3b82f6',cons:T.consHgAboveMale.replace('{ref}',ref)};
  }else{
    const sarco=a<65?20:16; // EWGSOP2: <16 kg donne anziane
    const ref=a<30?31:a<40?32:a<50?31:a<60?28:a<70?25:a<80?22:18;
    if(v<sarco)return{l:T.hgSarco,c:'#ef4444',cons:T.consHgSarcoFemale.replace('{v}',v).replace('{sarco}',sarco)};
    if(v<ref*0.8)return{l:T.hgUnder,c:'#f59e0b',cons:T.consHgUnderFemale.replace('{ref}',ref)};
    if(v<ref*1.1)return{l:T.average,c:'#10b981',cons:T.consHgAvgFemale.replace('{ref}',ref)};
    return{l:T.hgAbove,c:'#3b82f6',cons:T.consHgAboveFemale.replace('{ref}',ref)};
  }
};

// ── 3. Sit-and-Reach — flessibilità ACSM (cm) ──────────────────────────────
const interpSitReach=(cm,sesso)=>{
  if(cm===''||cm===null||cm===undefined)return null;const T=gT();const v=+cm,m=sesso==='M';
  // ACSM Guidelines for Exercise Testing and Prescription (11th ed.)
  if(m){
    if(v<-8)return{l:T.srVeryLow,c:'#ef4444',cons:T.consSrVeryLowMale};
    if(v<0)return{l:T.hgUnder,c:'#f59e0b',cons:T.consSrUnderMale};
    if(v<17)return{l:T.average,c:'#10b981',cons:T.consSrAvgMale};
    return{l:T.excellent,c:'#3b82f6',cons:T.consSrExcMale};

    if(v<21)return{l:T.average,c:'#10b981',cons:T.consSrAvgFemale};

};

// ── 4. BIA — Angolo di Fase (PhA) — Bosy-Westphal 2006 ─────────────────────
const interpPhA=(pha,sesso,eta)=>{
  if(!pha)return null;const v=+pha,m=sesso==='M',a=+eta||50;
  // Ref: Bosy-Westphal A et al. (2006), Norman K et al. (2012)
  const refM=a<30?7.5:a<40?7.3:a<50?7.1:a<60?6.8:a<70?6.3:5.8;
  const refF=a<30?6.6:a<40?6.4:a<50?6.2:a<60?5.9:a<70?5.5:5.1;
  const ref=m?refM:refF;
  const sarcoThresh=m?4.5:3.8; // soglie associate a sarcopenia/malnutrizione
  if(v<sarcoThresh)return{l:'Critico — rischio sarcopenia',c:'#ef4444',cons:`PhA ${v}° molto basso (soglia critica ${sarcoThresh}°). Indica perdita integrità cellulare, possibile sarcopenia o malnutrizione (Norman 2012). Priorità: screening nutrizionale completo, apporto proteico ≥1.5 g/kg/die, allenamento resistenza 3×/settimana. Consultare specialista.`};
  if(v<ref*0.85)return{l:'Sotto la media',c:'#f59e0b',cons:`PhA ${v}° inferiore alla media per età/sesso (rif. ${ref}°, Bosy-Westphal 2006). Possibile riduzione massa cellulare. Aumentare apporto proteico, allenamento di forza progressivo, verificare idratazione.`};
  if(v<ref*1.15)return{l:'Nella norma',c:'#10b981',cons:`PhA ${v}° nella norma (rif. ${ref}°). Buona integrità cellulare e stato nutrizionale. Mantenere allenamento e alimentazione bilanciata.`};
  return{l:'Sopra la media',c:'#3b82f6',cons:`PhA ${v}° eccellente (> media ${ref}°). Indica alta massa cellulare e ottimo stato nutrizionale. Tipico di soggetti allenati.`};
};

// ── 5. BIA — ECW/TBW ratio — Kyle 2004 ─────────────────────────────────────
const interpECW_TBW=(ratio)=>{
  if(!ratio)return null;const v=+ratio;
  // Kyle UG et al. (2004) "Bioelectrical impedance analysis" — norma ECW/TBW 0.36-0.39
  if(v<0.36)return{l:'Ottimo — buona distribuzione idrica',c:'#3b82f6',cons:`ECW/TBW ${v} indica ottima distribuzione idrica intracellulare. Tipico di soggetti ben idratati e con buona massa muscolare.`};
  if(v<=0.39)return{l:'Normale',c:'#10b981',cons:`ECW/TBW ${v} nella norma (0.36-0.39, Kyle 2004). Equilibrio idrico adeguato.`};
  if(v<=0.42)return{l:'Lieve ritenzione',c:'#f59e0b',cons:`ECW/TBW ${v} leggermente elevato. Possibile ritenzione idrica lieve. Ridurre sodio, aumentare potassio (frutta, verdura), camminata quotidiana 30 min, drenaggio linfatico se sedentario. Verificare apporto idrico ≥2L/die.`};
  if(v<=0.45)return{l:'Ritenzione moderata',c:'#fb923c',cons:`ECW/TBW ${v} elevato — ritenzione idrica moderata. Possibili cause: insufficienza venosa, dieta ipersodica, sedentarietà, farmaci. Elevare arti inferiori, compressione graduata, ridurre sodio <2g/die. Consultare medico se persistente.`};
  return{l:'Ritenzione severa',c:'#ef4444',cons:`⚠️ ECW/TBW ${v} molto elevato (>0.45). Edema significativo — consultazione medica necessaria prima di programmare esercizio. Escludere cause cardiache, renali, epatiche.`};
};

// ── 9. Mobilità caviglia (dorsiflessione, gradi o cm wall test) ─────────────
const interpMobCaviglia=(cm)=>{

  if(v>=12)return{l:'Ottima mobilità',c:'#3b82f6',cons:'Dorsiflessione eccellente (≥12 cm wall test). Nessuna limitazione per squat profondo, corsa e salti.'};

  return{l:'Molto ridotta',c:'#ef4444',cons:'Mobilità caviglia molto ridotta (<7 cm). Impatto significativo su squat (compenso lombare), corsa (rischio periostite/tendinopatia achilleo), equilibrio. Correttivi quotidiani: mobilità articolare con banda, stretching soleo e gastrocnemio 4×30s, esercizi eccentrici polpacci. Usare rialzo talloni in squat. Valutare eventuale rigidità articolare (invio fisioterapista).'};
};

// ── 10. Mobilità anca (flessione + rotazioni, gradi) ────────────────────────

  if(v>=100)return{l:'Normale',c:'#10b981',cons:'Mobilità anca buona (100-119°). Sufficiente per la maggior parte degli esercizi. Stretching psoas e piriforme regolare per mantenere.'};
  if(v>=80)return{l:'Ridotta',c:'#f59e0b',cons:'Mobilità anca ridotta (80-99°). Impatto su squat profondo e deadlift (compenso lombare = rischio ernia). Correttivi: stretching psoas (half-kneeling) 3×30s, piriforme 3×30s, 90/90 hip switch 2×8, frog stretch 3×30s, goblet squat con pausa 3×8. Rischio aumentato lombalgia (Ellison 1990).'};

};

const fmtDateIT=(d)=>{if(!d)return d;const mesi=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];let dt;if(/^\d{4}-\d{2}-\d{2}/.test(d)){const[y,m,g]=d.split('-');dt=new Date(+y,+m-1,+g);}else if(/^\d{2}\/\d{2}\/\d{4}/.test(d)){const[g,m,y]=d.split('/');dt=new Date(+y,+m-1,+g);}else return d;if(isNaN(dt))return d;return dt.getDate()+' '+mesi[dt.getMonth()]+' '+dt.getFullYear();};

// ── TOAST SYSTEM ──────────────────────────────────────────────────────────────
let _toastDispatch=null;
function showToast(msg,type='success',duration=4000){if(_toastDispatch)_toastDispatch({msg,type,duration});}
function showConfirmToast(msg,action,duration=5000){if(_toastDispatch)_toastDispatch({msg,type:'confirm',action,duration});}
function showAskToast(msg,onConfirm,duration=8000){if(_toastDispatch)_toastDispatch({msg,type:'ask',action:onConfirm,duration});}

function ToastItem({item,onRemove}){
  const [exiting,setExiting]=React.useState(false);
  const [progress,setProgress]=React.useState(100);
  const isConfirm=item.type==='confirm';
  const isAsk=item.type==='ask';
  const cancelled=React.useRef(false);
  React.useEffect(()=>{
    const start=Date.now();
    const total=item.duration;
    const tick=setInterval(()=>{const elapsed=Date.now()-start;setProgress(Math.max(0,100-(elapsed/total)*100));},50);
    const timer=setTimeout(()=>{
      clearInterval(tick);
      if(isConfirm&&!cancelled.current)item.action();
      setExiting(true);
      setTimeout(()=>onRemove(item.id),300);
    },total);
    return()=>{clearInterval(tick);clearTimeout(timer);};
  },[]);
  const handleCancel=()=>{
    cancelled.current=true;
    onRemove(item.id);
    showToast('Azione annullata','success');
  };
  const closeToast=()=>{setExiting(true);setTimeout(()=>onRemove(item.id),300);};
  const bg=item.type==='error'?C.red:item.type==='warning'?'#f59e0b':item.type==='confirm'?'#f59e0b':isAsk?C.blue:C.green;
  const icon=item.type==='error'?'✕':item.type==='warning'?'⚠':isAsk?'📧':'✓';
  return(
    <div style={{background:C.card,border:`1px solid ${C.border2}`,borderRadius:12,padding:'12px 16px',boxShadow:'0 8px 32px #0004',minWidth:260,maxWidth:360,animation:exiting?'fadeOut .3s ease forwards':'fadeInUp .3s ease',position:'relative',overflow:'hidden'}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <div style={{width:28,height:28,borderRadius:'50%',background:bg+'20',border:`1px solid ${bg}40`,display:'flex',alignItems:'center',justifyContent:'center',color:bg,fontWeight:700,fontSize:14,flexShrink:0}}>{icon}</div>
        <div style={{flex:1,fontSize:13,color:C.text,lineHeight:1.4}}>{item.msg}</div>
        {isConfirm&&<button onClick={handleCancel} style={{background:'#ef444420',color:C.red,border:'1px solid #ef444440',borderRadius:7,padding:'4px 10px',fontSize:12,fontWeight:700,cursor:'pointer',flexShrink:0}}>Annulla</button>}
        {isAsk&&<div style={{display:'flex',gap:6,flexShrink:0}}>
          <button onClick={()=>{cancelled.current=true;closeToast();item.action();}} style={{background:C.blue,color:'#fff',border:'none',borderRadius:7,padding:'4px 10px',fontSize:12,fontWeight:700,cursor:'pointer'}}>Invia</button>
          <button onClick={()=>{cancelled.current=true;closeToast();}} style={{background:'transparent',color:C.muted,border:`1px solid ${C.border2}`,borderRadius:7,padding:'4px 10px',fontSize:12,fontWeight:700,cursor:'pointer'}}>No</button>
        </div>}
        {!isConfirm&&!isAsk&&<button onClick={closeToast} style={{background:'transparent',border:'none',cursor:'pointer',color:C.muted,fontSize:16,padding:'0 2px',lineHeight:1}}>✕</button>}
      </div>
      <div style={{position:'absolute',bottom:0,left:0,height:3,background:bg,width:progress+'%',transition:'width 50ms linear',borderRadius:'0 0 0 12px'}}/>
    </div>
  );
}

function ToastContainer(){
  const [toasts,setToasts]=React.useState([]);
  _toastDispatch=React.useCallback((item)=>{setToasts(t=>[...t,{...item,id:Date.now()+Math.random()}]);},[]);
  const remove=React.useCallback((id)=>setToasts(t=>t.filter(x=>x.id!==id)),[]);
  if(!toasts.length)return null;
  return ReactDOM.createPortal(
    <div style={{position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',zIndex:9999,display:'flex',flexDirection:'column',gap:8,alignItems:'center',pointerEvents:'none'}}>
      {toasts.map(t=><div key={t.id} style={{pointerEvents:'all'}}><ToastItem item={t} onRemove={remove}/></div>)}
    </div>,
    document.body
  );
}

// ── DATE MASK HELPER (GG/MM/AAAA) ──
function dateMaskHandle(raw, prev) {
  var digits = raw.replace(/\D/g, '').slice(0, 8);
  var out = '';
  for (var i = 0; i < digits.length; i++) {
    if (i === 2 || i === 4) out += '/';
    out += digits[i];
  }
  return out;
}
function dateMaskValidate(val) {
  if (!val) return null;
  var T = gT();
  if (val.length > 0 && val.length < 10) return T.errDateFormat;
  if (val.length === 10) {
    var p = val.split('/');
    var dd = +p[0], mm = +p[1], yyyy = +p[2];
    if (dd < 1 || dd > 31) return T.errDayInvalid;
    if (mm < 1 || mm > 12) return T.errMonthInvalid;
    if (yyyy < 1900 || yyyy > new Date().getFullYear()) return T.errYearInvalid + ' (1900-' + new Date().getFullYear() + ')';
    var date = new Date(yyyy, mm - 1, dd);
    if (date.getDate() !== dd || date.getMonth() !== mm - 1 || date.getFullYear() !== yyyy) return T.errDateNonExistent;
    if (date >= new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate() + 1)) return T.errDateFuture;
  }
  return null;
}

function StatCard({label,value,sub,color=C.blue,icon,delay,onClick}){
  var numVal=typeof value==='number'?value:parseInt(value,10);
  var isNum=!isNaN(numVal)&&typeof value==='number';
  var ref2=useRef(null);
  var counted=useRef(false);
  var hoverRef=useRef(null);
  useEffect(function(){
    if(!isNum||counted.current||!ref2.current)return;
    counted.current=true;
    var start=0;var end=numVal;var duration=600;var startTime=null;
    function animate(ts){
      if(!startTime)startTime=ts;
      var progress=Math.min((ts-startTime)/duration,1);
      var current=Math.round(progress*end);
      if(ref2.current)ref2.current.textContent=current;
      if(progress<1)requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  },[numVal,isNum]);
  var dl=delay||0;
  return(
    <div ref={hoverRef} onClick={onClick||undefined} onMouseEnter={function(){if(onClick&&hoverRef.current)hoverRef.current.style.borderColor=C.blue;}} onMouseLeave={function(){if(onClick&&hoverRef.current)hoverRef.current.style.borderColor='';}} style={{...S.kpi(color),background:'linear-gradient(135deg,'+color+'08,'+color+'15)',borderLeft:'3px solid '+color,animation:'fadeInUp .3s ease both',animationDelay:dl+'s',cursor:onClick?'pointer':'default',transition:'all .2s'}}>

  );

  var showOnboarding=typeof onboardingStep==='number'&&onboardingStep<4;

    var tpName=trainerProfile&&(trainerProfile.nome||trainerProfile.displayName)||'';
    if(onboardingStep===0){
      onbIcon='👤';
      onbMsg=T.onbWelcome+(tpName?' '+tpName:'')+'! '+T.onbCreateClientMsg;
      onbBtn=T.onbCreateClientBtn+' →';
      onbAction=function(){if(onCreateClient)onCreateClient();else if(onNavigate)onNavigate('patients');};
    }else if(onboardingStep===1){
      var pNoEval=patients.find(function(p){return !hasAssessment(p);});
      var nmEval=fullName(pNoEval);
      onbIcon='📋';
      onbMsg=T.onbEvaluateMsg+(nmEval?' '+nmEval:'');
      onbBtn=T.onbEvaluateBtn+(nmEval?' '+nmEval:'')+' →';
      onbAction=function(){if(onStartWizard)onStartWizard();};
    }else if(onboardingStep===2){
      var pNoProg=patients.find(function(p){return hasAssessment(p)&&!hasProgram(p);});
      var nmProg=fullName(pNoProg);
      onbIcon='🏆';
      onbMsg=T.onbGenerateMsg+(nmProg?' '+nmProg:'');
      onbBtn=T.onbGenerateBtn+' →';
      onbAction=function(){if(onOpenPatient&&pNoProg)onOpenPatient(pNoProg.id);};
    }else if(onboardingStep===3){
      var pWithProg=patients.find(hasProgram);
      var nmPdf=fullName(pWithProg);
      onbIcon='📄';
      onbMsg=T.onbExportMsg+(nmPdf?' '+nmPdf:'');
      onbBtn=T.onbExportBtn+' →';
      onbAction=function(){if(onOpenPatient&&pWithProg)onOpenPatient(pWithProg.id);};
    }
  }
  var topNudge=null;
  if(onboardingStep===4&&patients.length>0){
    var nowTs=Date.now();
    var in7=nowTs+7*86400000;
    var cutoff30=nowTs-30*86400000;
    var sortedByOld=patients.slice().sort(function(a,b2){return(a.id||0)-(b2.id||0);});
    var nudgeRules=[
      {icon:'📋',msgKey:'nudgeNoEval',btnKey:'nudgeEvalNow',
        match:function(p){return !hasAssessment(p);},
        act:function(p){if(onValuta)onValuta(p);else if(onStartWizard)onStartWizard();}},
      {icon:'🏆',msgKey:'nudgeGenProg',btnKey:'nudgeGenNow',
        match:function(p){return hasAssessment(p)&&!hasProgram(p);},
        act:function(p){if(onOpenPatient)onOpenPatient(p.id);}},
      {icon:'📅',msgKey:'nudgeBookSession',btnKey:'nudgeBookNow',
        match:function(p){if(!hasProgram(p))return false;var hasUpcoming=(bookings||[]).some(function(b2){if(b2.patientId!==p.id)return false;var t=new Date(b2.data).getTime();return !isNaN(t)&&t>=nowTs&&t<=in7;});return !hasUpcoming;},
        act:function(){if(onNavigate)onNavigate('calendar');}},
      {icon:'🔄',msgKey:'nudgeReeval',btnKey:'nudgeReevalNow',
        match:function(p){if(!hasAssessment(p))return false;var ts=parseItDate(p.dataValutazione);return ts>0&&ts<cutoff30;},
        act:function(p){if(onValuta)onValuta(p);else if(onStartWizard)onStartWizard();}},
    ];
    for(var ri=0;ri<nudgeRules.length&&!topNudge;ri++){
      var rule=nudgeRules[ri];
      var matched=sortedByOld.find(rule.match);
      if(matched){
        var nm=fullName(matched);
        topNudge={icon:rule.icon,name:nm,msg:T[rule.msgKey].replace('{name}',nm),btn:T[rule.btnKey],action:(function(r,p){return function(){r.act(p);};})(rule,matched)};
      }
    }
  }
  return(
    <div style={{animation:'fadeInUp .3s ease'}}>
      {showOnboarding&&<div style={{background:'linear-gradient(135deg,rgba(59,130,246,.10),rgba(139,92,246,.08))',border:'1px solid rgba(59,130,246,.2)',borderRadius:16,padding:isMobile?24:32,textAlign:'center',marginBottom:16}}>
        <div style={{fontSize:isMobile?44:56,lineHeight:1,marginBottom:12}}>{onbIcon}</div>
        <div style={{fontSize:isMobile?16:20,fontWeight:800,color:C.strong,marginBottom:18,lineHeight:1.35}}>{onbMsg}</div>
        <button onClick={onbAction} style={{background:C.blue,color:'#fff',border:'none',borderRadius:12,padding:isMobile?'12px 22px':'14px 28px',fontSize:isMobile?14:15,fontWeight:700,cursor:'pointer',fontFamily:'inherit',boxShadow:'0 8px 24px rgba(59,130,246,.35)'}}>{onbBtn}</button>
        <div style={{marginTop:18,display:'flex',alignItems:'center',justifyContent:'center',gap:10,fontSize:11,color:C.muted}}>
          <span>{T.onbStep} {onboardingStep+1} {T.onbOf} 4</span>
          <div style={{display:'flex',gap:5}}>
            {[0,1,2,3].map(function(i){return <div key={i} style={{width:8,height:8,borderRadius:'50%',background:i<=onboardingStep?C.blue:(C.border2||'#374151')}}/>;})}
          </div>
        </div>
      </div>}
      {topNudge&&<div style={{background:C.card,border:'1px solid '+C.border2,borderRadius:14,padding:isMobile?16:20,display:'flex',alignItems:'center',gap:isMobile?12:16,marginBottom:16,flexWrap:isMobile?'wrap':'nowrap'}}>
        <div style={{fontSize:isMobile?24:28,lineHeight:1,flexShrink:0}}>{topNudge.icon}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:isMobile?13:14,fontWeight:800,color:C.strong,marginBottom:2}}>{topNudge.name}</div>
          <div style={{fontSize:isMobile?12:13,color:C.muted,lineHeight:1.45}}>{topNudge.msg}</div>
        </div>
        <button onClick={topNudge.action} style={{...S.btn(),whiteSpace:'nowrap',flexShrink:0}}>{topNudge.btn}</button>
      </div>}
      <div style={{marginBottom:14,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div>
          <h1 style={{fontSize:isMobile?18:20,fontWeight:800,color:C.strong}}>{(function(){var h=new Date().getHours();var g=h>=5&&h<12?'Buongiorno':h>=12&&h<18?'Buon pomeriggio':'Buonasera';var n=trainerProfile?.nome||trainerProfile?.displayName||'';return n?g+', '+n+'!':'Dashboard';})()}</h1>
          <p style={{fontSize:13,color:C.muted,marginTop:3}}>{today}</p>
        </div>
        {patients.length>0&&<button onClick={()=>exportPDFLista(patients,trainerProfile)} style={{padding:'8px 14px',borderRadius:8,border:'1px solid '+C.border2,background:'transparent',color:C.dim,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:6}}>📄 Export PDF</button>}
      </div>
      <div style={{display:'grid',gridTemplateColumns:isMobile?'repeat(2,1fr)':'repeat(4,1fr)',gap:isMobile?8:14,marginBottom:14}}>

        <StatCard label={T.sessions} value={totSedute} color={C.green} icon="💪" delay={0.05} onClick={onNavigate?function(){onNavigate('calendar');}:undefined}/>
        <StatCard label={T.todayLabel} value={todayBookings.length} color={C.purple} icon="📅" delay={0.1} onClick={onNavigate?function(){onNavigate('calendar');}:undefined}/>
        <StatCard label={nextApptLabel} value={nextApptVal} color={C.cyan} icon="⏰" delay={0.15} sub={nextApptSub}/>
      </div>
      {(()=>{
        const now=new Date();
        const msDay=86400000;
        const parseDate=s=>{if(!s)return null;const p=s.split('/');if(p.length===3)return new Date(+p[2],+p[1]-1,+p[0]);return null;};
        const inRange=(s,daysAgo,daysAgoEnd=0)=>{const d=parseDate(s);if(!d)return false;const diff=(now-d)/msDay;return diff>=daysAgoEnd&&diff<daysAgo;};
        const active=patients.filter(p=>(p.log||[]).some(l=>inRange(l.data,30)));
        const totalSedute30=patients.reduce((a,p)=>a+(p.log||[]).filter(l=>inRange(l.data,30)).length,0);
        const mediaSedute=active.length?+(totalSedute30/active.length).toFixed(1):null;
        const retention=patients.length?Math.round(active.length/patients.length*100):null;
        const sedute7=patients.reduce((a,p)=>a+(p.log||[]).filter(l=>inRange(l.data,7)).length,0);
        const sedute714=patients.reduce((a,p)=>a+(p.log||[]).filter(l=>inRange(l.data,14,7)).length,0);
        const arrow=sedute7>sedute714?{s:'↑',c:C.green}:sedute7<sedute714?{s:'↓',c:C.red}:{s:'=',c:C.yellow};
        const prossimi7=bookings.filter(b=>{const d=b.data?new Date(b.data):null;if(!d)return false;const diff=(d-now)/msDay;return diff>=0&&diff<7;}).length;
        const noData=patients.length===0||patients.every(p=>!(p.log?.length));
        // Dati grafico ultime 8 settimane
        const weekData=Array.from({length:8},(_,i)=>{
          const daysAgo=(7-i)*7;const daysAgoEnd=(7-i-1)*7;
          const count=patients.reduce((a,p)=>a+(p.log||[]).filter(l=>inRange(l.data,daysAgo,daysAgoEnd)).length,0);
          const weekStart=new Date(now-(daysAgo-1)*msDay);
          const label=(weekStart.getDate())+' '+(weekStart.toLocaleString('it-IT',{month:'short'}));
          return{x:label,y:count};
        });
        return(
          <div style={{...S.card,marginTop:14}}>
            <button type="button" onClick={()=>setMetricsOpen(v=>!v)} aria-expanded={metricsOpen} style={{display:'flex',alignItems:'center',justifyContent:'space-between',width:'100%',background:'none',border:'none',padding:0,margin:0,cursor:'pointer',fontFamily:'inherit',color:'inherit',textAlign:'left'}}>

            </button>
            <div style={{overflow:'hidden',maxHeight:metricsOpen?2000:0,opacity:metricsOpen?1:0,transition:'max-height .35s ease, opacity .25s ease',marginTop:metricsOpen?12:0}}>
            {noData?(
              <div style={{textAlign:'center',padding:'24px 0',color:C.muted,fontSize:13}}>📈 Inizia ad aggiungere sedute per vedere le metriche</div>
            ):(
              <>
                <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'repeat(3,1fr)',gap:isMobile?8:12,marginBottom:16}}>
                  <StatCard label="Clienti attivi" value={active.length+' / '+patients.length} color={C.blue} icon="👥" delay={0}/>
                  <StatCard label="Media sedute/mese" value={mediaSedute!==null?mediaSedute:'—'} color={C.green} icon="📋" delay={0.05}/>
                  <StatCard label="Retention %" value={retention!==null?retention+'%':'—'} color={C.purple} icon="🔄" delay={0.1}/>
                  <StatCard label="Sedute settimana" value={<span>{sedute7} <span style={{color:arrow.c,fontWeight:800,fontSize:13}}>{arrow.s}</span></span>} color={C.cyan} icon="💪" delay={0.15}/>
                  <StatCard label="Prossimi 7gg" value={prossimi7} color={C.orange} icon="📅" delay={0.2}/>
                </div>
                <div style={S.st}>Sedute per settimana</div>
                <BarChartComp data={weekData} color={C.blue}/>
              </>
            )}
            </div>
          </div>
        );
      })()}
      <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'1fr 1fr',gap:isMobile?10:14,marginTop:14}}>
        <div style={S.card}>
          <div style={S.st}>{T.appointmentsToday}</div>
          {todayBookings.length===0&&<div style={{textAlign:'center',padding:'20px 0'}}><div style={{fontSize:36,marginBottom:8}}>&#9728;&#65039;</div><div style={{color:C.muted,fontSize:13,lineHeight:1.6}}>Nessun appuntamento oggi.<br/>Goditi la pausa!</div></div>}
          {todayBookings.map(b=>{
            const p=patients.find(x=>x.id===b.patientId);
            return(
              <div key={b.id} style={{...S.row,border:'1px solid '+C.border2,borderRadius:9,marginBottom:6}}>
                <div style={{width:6,height:36,borderRadius:3,background:C.blue,flexShrink:0}}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,color:C.strong,fontWeight:700,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}><span style={{color:C.blue,fontWeight:800}}>{b.ora}</span> · {p?.nome} {p?.cognome}</div>
                  <div style={{fontSize:11,color:C.muted,display:'flex',gap:6,alignItems:'center',marginTop:2}}>{b.durata} min · <span style={{...S.tag(C.cyan),padding:'1px 7px',fontSize:10}}>{b.tipo}</span></div>
                </div>
                <span style={S.tag(b.stato==='Confermato'?C.green:C.yellow)}>{b.stato==='Confermato'?gT().calConf:b.stato==='In attesa'?gT().calPend:gT().calCanc}</span>
              </div>
            );
          })}
        </div>
        <div style={S.card}>
          <div style={S.st}>{T.weightProgress}</div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {patients.filter(p=>p.progressi?.length>1).map(function(p){
              var prg=p.progressi;
              var diff=+(prg[prg.length-1].peso-prg[prg.length-2].peso).toFixed(1);
              return(
              React.createElement('div',{key:p.id},
                React.createElement('div',{style:{fontSize:13,color:C.strong,fontWeight:600,marginBottom:4,display:'flex',alignItems:'center',gap:8}},
                  p.nome+' '+p.cognome,
                  diff!==0&&React.createElement('span',{style:{fontSize:12,fontWeight:700,color:diff<0?C.green:C.orange}},
                    (diff<0?'\u2193 ':'\u2191 ')+Math.abs(diff)+' kg'
                  )
                ),
                React.createElement(LineChartComp,{data:prg.map(function(x){return{x:x.data.slice(0,5),y:x.peso}}),color:C.blue})
              ));
            })}
            {patients.filter(p=>p.progressi?.length>1).length===0&&<div style={{color:C.muted,fontSize:13}}>{T.noWeightData}</div>}
          </div>
        </div>
      </div>
    </div>
  );
}

      (p.programma&&p.programma.cardio?'<div style="background:#ffffff;border:1px solid #e2e8f0;border-left:5px solid #3b82f6;border-radius:10px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)"><div style="font-size:9px;font-weight:800;color:#3b82f6;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">'+T.pdfCardio+'</div><div style="font-size:12px;color:#0f172a;line-height:1.5">'+esc(p.programma.cardio)+'</div></div>':'')+
      (p.programma&&p.programma.forza?'<div style="background:#ffffff;border:1px solid #e2e8f0;border-left:5px solid #10b981;border-radius:10px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)"><div style="font-size:9px;font-weight:800;color:#10b981;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">'+T.pdfForza+'</div><div style="font-size:12px;color:#0f172a;line-height:1.5">'+esc(p.programma.forza)+'</div></div>':'')
    );
    var progKpiRows=p.programma?[[T.pdfProgStart,p.programma.dataInizio],[T.pdfProgSessions,p.programma.sedute],[T.pdfProgCardioMin,p.programma.minCardio?p.programma.minCardio+' min':'—'],[T.pdfProgForzaMin,p.programma.minForza?p.programma.minForza+' min':'—'],['RPE target',p.programma.rpeRange||'—'],['Zona FC',p.programma.zonaFC||'—']]:[];
    const html=`<!DOCTYPE html><html><head><meta charset="utf-8"/><title>Report – ${esc(p.nome)} ${esc(p.cognome)}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#0f172a;font-size:13px;background:#ffffff;-webkit-font-smoothing:antialiased}
.pg{max-width:820px;margin:0 auto;padding:40px 44px}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:18px;margin-bottom:6px;gap:20px}
.hdr-line{height:3px;background:linear-gradient(90deg,#3b82f6,#06b6d4,#10b981);border-radius:2px;margin-bottom:24px}
.client-name{font-size:22px;font-weight:800;color:#0f172a;letter-spacing:-.4px;line-height:1.1}
.client-meta{font-size:11px;color:#64748b;margin-top:6px;line-height:1.6}
.prof-badge{display:inline-block;padding:5px 14px;border-radius:100px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-top:8px}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.kpi{background:#ffffff;border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.kpi.bmi{border-left:4px solid #3b82f6;background:linear-gradient(135deg,#eff6ff,#ffffff)}
.kpi.peso{border-left:4px solid #10b981;background:linear-gradient(135deg,#f0fdf4,#ffffff)}
.kpi.target{border-left:4px solid #8b5cf6;background:linear-gradient(135deg,#faf5ff,#ffffff)}
.kpi-val{font-size:24px;font-weight:900;color:#0f172a;line-height:1}
.kpi-lbl{font-size:9px;color:#64748b;text-transform:uppercase;letter-spacing:.8px;margin-top:4px;font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sec{margin-bottom:22px}
.sec-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:#0f172a;text-transform:uppercase;letter-spacing:.8px;padding-bottom:8px;margin-bottom:10px;border-bottom:2px solid #e2e8f0}
.sec-title .ico{font-size:16px}
.prog-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.prog-kpi .kpi-val{font-size:18px;color:#3b82f6}
.nut-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.nut-card{background:#ffffff;border:1px solid #e2e8f0;border-radius:10px;padding:14px 10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.nut-card .ico{font-size:20px;display:block;margin-bottom:4px}
.nut-card .val{font-size:20px;font-weight:900;line-height:1}
.nut-card .lbl{font-size:9px;color:#64748b;text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-top:4px}
.nut-kcal{border-left:4px solid #f97316;background:linear-gradient(180deg,#fff7ed,#ffffff)} .nut-kcal .val{color:#f97316}
.nut-prot{border-left:4px solid #3b82f6;background:linear-gradient(180deg,#eff6ff,#ffffff)} .nut-prot .val{color:#3b82f6}
.nut-carb{border-left:4px solid #f59e0b;background:linear-gradient(180deg,#fffbeb,#ffffff)} .nut-carb .val{color:#f59e0b}
.nut-fat{border-left:4px solid #10b981;background:linear-gradient(180deg,#f0fdf4,#ffffff)} .nut-fat .val{color:#10b981}
.nut-note{background:#f8fafc;border-left:3px solid #3b82f6;padding:10px 14px;border-radius:0 6px 6px 0;font-size:11px;color:#475569;line-height:1.6;margin-top:10px;white-space:pre-wrap}
.log-item{display:flex;align-items:center;gap:12px;padding:9px 12px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.log-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px #ffffff,0 0 0 3px currentColor}
.log-info{flex:1;min-width:0;font-size:12px}
.log-info b{color:#0f172a;font-weight:700}
.log-info .meta{color:#64748b;font-size:11px}
.log-note{font-size:10px;color:#94a3b8;font-style:italic;margin-top:2px}
.weight-row{display:flex;gap:8px;flex-wrap:wrap}
.weight-card{background:#ffffff;border:1px solid #e2e8f0;border-left:4px solid #06b6d4;border-radius:8px;padding:10px 14px;min-width:90px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.weight-val{font-size:18px;font-weight:900;color:#06b6d4;line-height:1}
.weight-date{font-size:9px;color:#64748b;text-transform:uppercase;letter-spacing:.6px;margin-top:4px;font-weight:600}
.footer-line{height:2px;background:linear-gradient(90deg,#3b82f6,#06b6d4,#10b981);border-radius:1px;margin:28px 0 12px}
footer{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:#94a3b8;flex-wrap:wrap;gap:8px}
footer .center{flex:1;text-align:center;color:#64748b}
footer .center b{color:#3b82f6;font-weight:700}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}.no-print{display:none!important}.pg{padding:24px 28px}@page{margin:14mm 10mm}}
</style></head><body>
<div class="no-print" style="position:sticky;top:0;background:#1e293b;padding:12px 16px;display:flex;gap:10px;justify-content:center;z-index:99;border-bottom:2px solid #3b82f6;"><button onclick="window.close()" style="background:#334155;color:#fff;border:1px solid #475569;padding:11px 22px;border-radius:9px;font-size:14px;cursor:pointer;font-weight:700;">${T.pdfBackToApp}</button><button onclick="window.print()" style="background:#3b82f6;color:#fff;border:none;padding:11px 22px;border-radius:9px;font-size:14px;cursor:pointer;font-weight:700;">${T.pdfPrint}</button></div>
<div class="pg">

  <div class="hdr">
    ${brandHtml}
    <div style="text-align:right">
      <div class="client-name">${esc(p.nome)} ${esc(p.cognome)}</div>
      <div class="client-meta">${esc(p.id)} &middot; ${T.assessmentNum}: ${esc(p.dataValutazione)||'—'}</div>
      ${pr2?`<div class="prof-badge" style="background:${profGrad};color:${profBorder};border:1px solid ${profBorder}">${profLbl}${pr2.score?' &middot; '+pr2.score+'/100':''}</div>`:''}
    </div>
  </div>
  <div class="hdr-line"></div>

  <div class="kpi-row">
    <div class="kpi bmi"><div class="kpi-val">${b2||'—'}</div><div class="kpi-lbl">BMI &middot; ${bl2}</div></div>
    <div class="kpi peso"><div class="kpi-val">${p.peso||'—'} kg</div><div class="kpi-lbl">${T.pdfActualWeight}</div></div>
    <div class="kpi target"><div class="kpi-val">${pesoTarget||'—'} kg</div><div class="kpi-lbl">${T.pdfTargetWeight}</div></div>
  </div>

  <div class="g2" style="margin-bottom:24px">
    <div class="sec" style="margin-bottom:0">
      <div class="sec-title"><span class="ico">👤</span>${T.secAna}</div>
      ${renderRows(anaRows)}
    </div>
    <div class="sec" style="margin-bottom:0">
      <div class="sec-title"><span class="ico">🫀</span>${T.secClin}</div>
      ${renderRows(clinRows)}
    </div>
  </div>

  <div class="g2" style="margin-bottom:24px">
    <div class="sec" style="margin-bottom:0">
      <div class="sec-title"><span class="ico">🏃</span>${T.secTest}</div>
      ${renderRows(testRows)}
    </div>
    <div class="sec" style="margin-bottom:0">
      <div class="sec-title"><span class="ico">🎯</span>${T.secLife}</div>
      ${renderRows(lifeRows)}
    </div>
  </div>

  ${p.programma?.cardio||p.programma?.forza||(p.programma?.settimane&&p.programma.settimane.length>0)?`
  <div class="sec">
    <div class="sec-title"><span class="ico">💪</span>${T.secProg}</div>
    ${progKpiRows.length>0?`<div class="prog-kpi">
      ${progKpiRows.slice(0,3).map(function(kv){return '<div class="kpi" style="text-align:center"><div class="kpi-val">'+esc(kv[1])+'</div><div class="kpi-lbl">'+esc(kv[0])+'</div></div>';}).join('')}
    </div>`:''}
    ${weeksHtml}
  </div>`:''}

  ${p.nutrizione?.kcal?`
  <div class="sec">
    <div class="sec-title"><span class="ico">🥗</span>${T.pdfNutSection}</div>
    <div class="nut-row">
      <div class="nut-card nut-kcal"><span class="ico">🔥</span><div class="val">${esc(p.nutrizione.kcal)}</div><div class="lbl">${T.pdfNutKcal}</div></div>
      <div class="nut-card nut-prot"><span class="ico">🥩</span><div class="val">${esc(p.nutrizione.proteine)||0}g</div><div class="lbl">${T.pdfNutProt}</div></div>
      <div class="nut-card nut-carb"><span class="ico">🍞</span><div class="val">${esc(p.nutrizione.carboidrati)||0}g</div><div class="lbl">${T.pdfNutCarb}</div></div>
      <div class="nut-card nut-fat"><span class="ico">🥑</span><div class="val">${esc(p.nutrizione.grassi)||0}g</div><div class="lbl">${T.wizPdfNutFat||'Grassi'}</div></div>
    </div>
    ${p.nutrizione.note?`<div class="nut-note">${esc(p.nutrizione.note)}</div>`:''}
  </div>`:''}

  ${(p.log||[]).length>0?`
  <div class="sec">
    <div class="sec-title"><span class="ico">📋</span>${T.pdfLastSessions} (${Math.min(p.log.length,10)})</div>
    ${(p.log||[]).slice().reverse().slice(0,10).map(function(s){var rpeColor=s.rpe<=3?'#10b981':s.rpe<=6?'#f59e0b':s.rpe<=8?'#fb923c':'#ef4444';return '<div class="log-item"><span class="log-dot" style="background:'+rpeColor+';color:'+rpeColor+'"></span><div class="log-info"><b>'+esc(s.tipo)+'</b> <span class="meta">&middot; '+esc(s.data)+' &middot; '+esc(s.durata)+' min &middot; RPE '+esc(s.rpe)+'</span>'+(s.note?'<div class="log-note">'+esc(s.note)+'</div>':'')+'</div></div>';}).join('')}
  </div>`:''}

  ${(p.progressi||[]).length>1?`
  <div class="sec">
    <div class="sec-title"><span class="ico">📊</span>${T.pdfWeightHistory}</div>
    <div class="weight-row">
      ${p.progressi.map(function(x){return '<div class="weight-card"><div class="weight-val">'+x.peso+' kg</div><div class="weight-date">'+esc(x.data)+'</div></div>';}).join('')}
    </div>
  </div>`:''}

  <div class="footer-line"></div>
  <footer>
    <span>${esc(nomeStudio)}</span>
    <span class="center">${T.pdfGenerated||'Report'} <b>PT Board</b> &middot; personaltrainerboard.com</span>
    <span>${fmtDate()}</span>
  </footer>

</div>${'</body></html>'}`;
    const w=window.open('','_blank');
    w.document.write(html);
    w.document.close();
  };

  return(
    <div style={{animation:'fadeInUp .3s ease'}}>
      {/* Header cliente */}
      {isMobile?(
        <div style={{marginBottom:14}}>
          {/* Riga 1: indietro + nome + profilo */}
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
            <button style={{...S.btn('ghost',true),padding:'8px 12px',flexShrink:0}} onClick={onBack}>←</button>
            <Avatar nome={p.nome} cognome={p.cognome} size={42} foto={p.foto||''}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:17,fontWeight:800,color:C.strong,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.nome} {p.cognome}</div>
              <div style={{fontSize:11,color:C.muted,marginTop:2,display:'flex',alignItems:'center',gap:6}}>
                <span>{p.id}</span>
                {pr&&<span style={S.tag(pr.c,pr.bg)}>{pr.code==='A'?T.profileLowShort:pr.code==='B'?T.profileMedShort:pr.code==='C+'?T.profileExcellentShort:T.profileGoodShort}</span>}
              </div>
            </div>
          </div>
          {/* Riga 2: bottoni azione scrollabili */}
          <div className="hide-scrollbar" style={{display:'flex',gap:8,overflowX:'auto',whiteSpace:'nowrap',paddingBottom:4,WebkitOverflowScrolling:'touch',scrollbarWidth:'none',msOverflowStyle:'none'}}>
            <button style={{padding:'6px 12px',borderRadius:8,border:'1px solid #10b98140',background:'#10b98120',cursor:'pointer',color:'#6ee7b7',fontSize:12,fontWeight:600,fontFamily:'inherit',display:'flex',alignItems:'center',gap:4,flexShrink:0}} onClick={onValuta}>{T.valutaNow}</button>
            <button style={{padding:'6px 12px',borderRadius:8,border:'1px solid #10b98140',background:'#10b98120',cursor:'pointer',color:'#6ee7b7',fontSize:12,fontWeight:600,fontFamily:'inherit',display:'flex',alignItems:'center',gap:4,flexShrink:0}} onClick={generaPDF}>📄 PDF</button>
            <button style={{padding:'6px 12px',borderRadius:8,border:'1px solid '+C.border2,background:'transparent',cursor:'pointer',color:C.dim,fontSize:12,fontWeight:600,fontFamily:'inherit',display:'flex',alignItems:'center',gap:4,flexShrink:0}} onClick={onEdit}>{'✏️ '+T.edit}</button>
            {p.telefono&&<a href={'https://wa.me/'+p.telefono.replace(/[\s\-\(\)\+]/g,'')+'?text='+encodeURIComponent(T.waMessage.replace('{name}',p.nome))} target="_blank" rel="noreferrer" style={{padding:'6px 12px',borderRadius:8,border:'1px solid #25D36640',background:'#25D36620',cursor:'pointer',color:'#25D366',fontSize:12,fontWeight:600,fontFamily:'inherit',display:'flex',alignItems:'center',gap:4,flexShrink:0,textDecoration:'none'}}>💬 WhatsApp</a>}
          </div>
        </div>
      ):(
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
          <button style={{...S.btn('ghost',true),display:'flex',alignItems:'center',gap:4}} onClick={onBack}>← {T.back}</button>
          <Avatar nome={p.nome} cognome={p.cognome} size={44} foto={p.foto||''}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
              <h1 style={{fontSize:18,fontWeight:800,color:C.strong,margin:0}}>{p.nome} {p.cognome}</h1>
              {pr&&<span style={S.tag(pr.c,pr.bg)}>{pr.code==='A'?T.profileLowShort:pr.code==='B'?T.profileMedShort:pr.code==='C+'?T.profileExcellentShort:T.profileGoodShort}</span>}
            </div>
            <div style={{fontSize:11,color:C.muted,marginTop:2}}>{p.id} · {p.dataValutazione}</div>
          </div>
          <div className="tt"><button onMouseEnter={function(e){e.currentTarget.style.borderColor=C.blue;e.currentTarget.style.color=C.blue;}} onMouseLeave={function(e){e.currentTarget.style.borderColor=C.border2;e.currentTarget.style.color=C.text;}} style={{background:C.card,border:'1px solid '+C.border2,color:C.text,padding:'9px 16px',borderRadius:8,fontSize:13,fontWeight:600,cursor:'pointer',transition:'all .2s',display:'flex',alignItems:'center',gap:6}} onClick={onValuta}>{T.valutaNow}</button><span className="tp">{T.tooltipStartAssess}</span></div>
          <div className="tt"><button onMouseEnter={function(e){e.currentTarget.style.borderColor=C.blue;e.currentTarget.style.color=C.blue;}} onMouseLeave={function(e){e.currentTarget.style.borderColor=C.border2;e.currentTarget.style.color=C.text;}} style={{background:C.card,border:'1px solid '+C.border2,color:C.text,padding:'9px 16px',borderRadius:8,fontSize:13,fontWeight:600,cursor:'pointer',transition:'all .2s',display:'flex',alignItems:'center',gap:6}} onClick={generaPDF}>{T.reportPdf}</button><span className="tp">{T.tooltipDownloadReport}</span></div>

          {p.telefono&&<div className="tt"><a href={'https://wa.me/'+p.telefono.replace(/[\s\-\(\)\+]/g,'')+'?text='+encodeURIComponent(T.waMessage.replace('{name}',p.nome))} target="_blank" rel="noreferrer" onMouseEnter={function(e){e.currentTarget.style.borderColor='#25D366';e.currentTarget.style.color='#25D366';}} onMouseLeave={function(e){e.currentTarget.style.borderColor=C.border2;e.currentTarget.style.color=C.text;}} style={{background:C.card,border:'1px solid '+C.border2,color:C.text,padding:'9px 16px',borderRadius:8,fontSize:13,fontWeight:600,cursor:'pointer',transition:'all .2s',display:'flex',alignItems:'center',gap:6,textDecoration:'none'}}>💬 WhatsApp</a><span className="tp">{T.tooltipWhatsapp}</span></div>}
          <div className="tt"><button onMouseEnter={function(e){e.currentTarget.style.borderColor=C.blue;e.currentTarget.style.color=C.blue;}} onMouseLeave={function(e){e.currentTarget.style.borderColor=C.border2;e.currentTarget.style.color=C.text;}} style={{background:C.card,border:'1px solid '+C.border2,color:C.text,padding:'9px 16px',borderRadius:8,fontSize:13,fontWeight:600,cursor:'pointer',transition:'all .2s',display:'flex',alignItems:'center',gap:6}} onClick={onEdit}>✏ {T.edit}</button><span className="tp">{T.tooltipEditClient}</span></div>
          <div className="tt"><button onMouseEnter={function(e){e.currentTarget.style.borderColor=C.blue;e.currentTarget.style.color=C.blue;}} onMouseLeave={function(e){e.currentTarget.style.borderColor=C.border2;e.currentTarget.style.color=C.text;}} style={{background:C.card,border:'1px solid '+C.border2,color:C.text,padding:'9px 16px',borderRadius:8,fontSize:13,fontWeight:600,cursor:'pointer',transition:'all .2s',display:'flex',alignItems:'center',gap:6}} onClick={onDelete}>🗑</button><span className="tp">{T.tooltipDeleteClient}</span></div>
        </div>
      )}

      {/* Tabs scorrevoli */}
      <div className="hide-scrollbar" style={{display:'flex',gap:3,marginBottom:14,background:C.sidebar,borderRadius:9,padding:3,overflowX:'auto',whiteSpace:'nowrap',WebkitOverflowScrolling:'touch',scrollbarWidth:'none',msOverflowStyle:'none'}}>
        {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{...S.btn(tab===t.id?'primary':'ghost',true),borderRadius:6,border:'none',whiteSpace:'nowrap',fontSize:12,padding:isMobile?'6px 12px':'5px 12px',flexShrink:0}}>{t.l}</button>)}
      </div>

      {tab==='panoramica'&&(
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          {/* HERO ROW */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            {/* Card Peso */}
            <div style={{background:C.card,border:'1px solid '+C.border2,borderRadius:12,padding:isMobile?12:20,display:'flex',alignItems:'center',gap:isMobile?10:16}}>
              <div style={{width:isMobile?40:52,height:isMobile?40:52,borderRadius:'50%',border:'3px solid '+C.blue,background:C.blue+'15',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <span style={{fontSize:isMobile?10:11,fontWeight:600,color:C.muted}}>kg</span>
              </div>
              <div style={{minWidth:0}}>
                <div style={{fontSize:isMobile?22:36,fontWeight:900,color:C.strong,lineHeight:1}}>{p.peso||'—'}</div>
                <div style={{fontSize:isMobile?11:12,fontWeight:600,color:C.muted}}>{T.pdfActualWeight}</div>
                {p.altezza&&p.peso&&(()=>{const tgt=(24.9*Math.pow(p.altezza/100,2)).toFixed(1);const diff=(p.peso-tgt).toFixed(1);return <div style={{fontSize:isMobile?10:12,color:C.dim,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{diff<0?T.belowTarget:T.targetLabel+' '+tgt+' kg'}</div>;})()}
              </div>
            </div>
