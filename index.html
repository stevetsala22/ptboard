    const eta=p.annoNascita?new Date().getFullYear()-p.annoNascita:null;
    const profCode=scheda.config?.profilo||(pr?pr.code:'');
    const profBorder=profCode==='A'?'#ef4444':profCode==='B'?'#f59e0b':profCode==='C+'?'#3b82f6':profCode==='C'?'#10b981':'#64748b';
    const profGrad=profCode==='A'?'linear-gradient(135deg,#fef2f2,#fee2e2)':profCode==='B'?'linear-gradient(135deg,#fffbeb,#fef3c7)':profCode==='C+'?'linear-gradient(135deg,#eff6ff,#dbeafe)':profCode==='C'?'linear-gradient(135deg,#f0fdf4,#d1fae5)':'#f8fafc';
    const profLbl=profCode==='A'?T.profileLowShort:profCode==='B'?T.profileMedShort:profCode==='C+'?T.profileExcellentShort:profCode==='C'?T.profileGoodShort:'';
    const numEx=(scheda.esercizi||[]).length;
    const hasSezioni=(scheda.esercizi||[]).some(function(ex){return ex.sezione;});
    const equipVal=scheda.config?.equip||'gym';
    const equipLabel=equipVal==='gym'?T.equipGym:equipVal==='home'?T.equipHome:T.equipBody;
    // Colori sezioni (Upper / Lower / Push / Pull / Legs / Full Body) — no emoji
    const sectionIcon=function(name){
      var n=(name||'').toLowerCase();
      if(n.indexOf('upper')!==-1)return{color:'#3b82f6',grad:'linear-gradient(90deg,#eff6ff,#ffffff)'};
      if(n.indexOf('lower')!==-1)return{color:'#10b981',grad:'linear-gradient(90deg,#f0fdf4,#ffffff)'};
      // Push: English 'push', French 'pouss', Italian 'push'
      if(n.indexOf('push')!==-1||n.indexOf('pouss')!==-1)return{color:'#f97316',grad:'linear-gradient(90deg,#fff7ed,#ffffff)'};
      // Pull: English 'pull', French 'tirage', Italian 'pull'
      if(n.indexOf('pull')!==-1||n.indexOf('tirage')!==-1)return{color:'#8b5cf6',grad:'linear-gradient(90deg,#faf5ff,#ffffff)'};
      // Legs: English 'legs', French 'jambe', Italian 'gambe'
      if(n.indexOf('legs')!==-1||n.indexOf('jambe')!==-1||n.indexOf('gambe')!==-1)return{color:'#06b6d4',grad:'linear-gradient(90deg,#ecfeff,#ffffff)'};
      return{color:'#3b82f6',grad:'linear-gradient(90deg,#eff6ff,#ffffff)'};
    };
    var currentSezione='';
    // Raggruppa esercizi in blocchi: ogni blocco = una tabella (una sezione o tutto).
    // Costruiamo un array di {nome, righe:[...]} poi renderizziamo.
    var blocks=[];
    (scheda.esercizi||[]).forEach(function(ex,ei){
      const eInfo=exercises.find(function(e){return e.id===ex.eId;})||{};
      if(ex.sezione&&ex.sezione!==currentSezione){
        blocks.push({nome:ex.sezione,righe:[]});
        currentSezione=ex.sezione;
      } else if(!ex.sezione&&blocks.length===0){
        blocks.push({nome:null,righe:[]});
      }
      blocks[blocks.length-1].righe.push({ex:ex,eInfo:eInfo,ei:ei});
    });
    const buildTable=function(block,blockIdx){
      var header='';
      if(block.nome){
        var si=sectionIcon(block.nome);
        var pageBrk=blockIdx>0?'page-break-before:always;':'';
        header='<div class="section-hdr" style="'+pageBrk+'background:'+si.grad+';border-left:5px solid '+si.color+';color:'+si.color+'">'+esc(block.nome.toUpperCase())+'</div>';
      }
      var rowsHtml=block.righe.map(function(r){
        var ex=r.ex,eInfo=r.eInfo,ei=r.ei;
        var _pdfLang=getLang();
        var nome=exName(eInfo,_pdfLang)||ex.eId||'';
        var gruppo=muscoliLocale((eInfo.muscoli||eInfo.target||eInfo.gruppo||'').toString(),_pdfLang);
        var cat=(eInfo.cat||eInfo.categoria||'').toLowerCase();
        var primary=(eInfo.primary||'').toLowerCase();
        var isCardio=cat==='cardio'||primary==='cardio';
        var isCore=cat==='core'||primary==='core';
        var livelloRaw=eInfo.livello||'';
        var livello=livelloLocale(livelloRaw,_pdfLang);
        var livBg=livelloRaw==='base'?'#d1fae5':livelloRaw==='intermedio'?'#fef3c7':livelloRaw==='avanzato'?'#fee2e2':'#f1f5f9';
        var livClr=livelloRaw==='base'?'#10b981':livelloRaw==='intermedio'?'#f59e0b':livelloRaw==='avanzato'?'#ef4444':'#64748b';
        var ripCol=ex.reps||'—';
        var recCol=ex.rec?ex.rec+'s':'—';
        if(isCardio){ripCol=String(ex.reps||'15').indexOf('min')!==-1?ex.reps:(ex.reps||'15')+' min';recCol='—';}
        if(isCore&&String(ex.reps).indexOf('s')!==-1){ripCol=ex.reps;}
        var rowBg=ei%2===0?'#f8fafc':'#ffffff';
        var rowClass='';
        if(isCardio){rowBg='#ecfeff';rowClass='cardio-row';}
        else if(isCore){rowBg='#faf5ff';rowClass='core-row';}
        return '<tr class="'+rowClass+'" style="background:'+rowBg+'">'+
          '<td class="num-cell"><div class="num-circle">'+String(ei+1)+'</div></td>'+
          '<td class="ex-cell"><b>'+esc(nome)+'</b>'+(ex.note?'<div class="ex-note">'+esc(ex.note)+'</div>':'')+'</td>'+
          '<td class="grp-cell">'+esc(gruppo)+'</td>'+
          '<td class="lv-cell">'+(livello?'<span class="lv-badge" style="background:'+livBg+';color:'+livClr+'">'+esc(livello)+'</span>':'—')+'</td>'+

@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}.no-print{display:none!important}.pg{padding:18mm 20mm}@page{margin:0}}

  ${p.programma?.cardio||p.programma?.forza||(p.programma?.settimane&&p.programma.settimane.length>0)?`

  ${p.nutrizione?.kcal?`
  <div class="sec">
    <div class="sec-title"><span class="ico">🥗</span>${T.pdfNutSection}</div>
    <div class="nut-row">
      <div class="nut-card nut-kcal"><span class="ico">🔥</span><div class="val">${esc(p.nutrizione.kcal)}</div><div class="lbl">${T.pdfNutKcal}</div></div>
      <div class="nut-card nut-prot"><span class="ico">🥩</span><div class="val">${esc(p.nutrizione.proteine)||0}g</div><div class="lbl">${T.pdfNutProt}</div></div>
      <div class="nut-card nut-carb"><span class="ico">🍞</span><div class="val">${esc(p.nutrizione.carboidrati)||0}g</div><div class="lbl">${T.pdfNutCarb}</div></div>
      <div class="nut-card nut-fat"><span class="ico">🥑</span><div class="val">${esc(p.nutrizione.grassi)||0}g</div><div class="lbl">${T.wizPdfNutFat||'Grassi'}</div></div>
    </div>
    ${p.nutrizione.note?`<div class="nut-note">${esc(p.nutrizione.note)}</div>`:''}
  </div>`:''}

  ${(p.log||[]).length>0?`
  <div class="sec">
    <div class="sec-title"><span class="ico">📋</span>${T.pdfLastSessions} (${Math.min(p.log.length,10)})</div>
    ${(p.log||[]).slice().reverse().slice(0,10).map(function(s){var rpeColor=s.rpe<=3?'#10b981':s.rpe<=6?'#f59e0b':s.rpe<=8?'#fb923c':'#ef4444';return '<div class="log-item"><span class="log-dot" style="background:'+rpeColor+';color:'+rpeColor+'"></span><div class="log-info"><b>'+esc(s.tipo)+'</b> <span class="meta">&middot; '+esc(s.data)+' &middot; '+esc(s.durata)+' min &middot; RPE '+esc(s.rpe)+'</span>'+(s.note?'<div class="log-note">'+esc(s.note)+'</div>':'')+'</div></div>';}).join('')}
  </div>`:''}

  ${(p.progressi||[]).length>1?`
  <div class="sec">
    <div class="sec-title"><span class="ico">📊</span>${T.pdfWeightHistory}</div>
    <div class="weight-row">
      ${p.progressi.map(function(x){return '<div class="weight-card"><div class="weight-val">'+x.peso+' kg</div><div class="weight-date">'+esc(x.data)+'</div></div>';}).join('')}
    </div>
  </div>`:''}

  ${prog2?.precauzioni?.length>0?`<div style="background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fcd34d;border-radius:10px;padding:14px 16px;margin-bottom:18px"><div style="font-size:11px;font-weight:800;color:#b45309;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px">${T.wizPrecCliniche||'Precauzioni cliniche'}</div>${prog2.precauzioni.map(function(pc){return '<div style="font-size:11px;color:#78350f;line-height:1.6;padding:3px 0">'+esc(pc)+'</div>';}).join('')}</div>`:''}

  ${prog2?.riferimenti?`<div style="font-size:9px;color:#94a3b8;font-style:italic;margin-bottom:14px;line-height:1.5">${prog2.riferimenti}</div>`:''}

  <div class="footer-line"></div>
  <footer>
    <span>${esc(nomeStudio)}</span>
    <span class="center">${T.pdfGenerated||'Report'} <b>PT Board</b> &middot; personaltrainerboard.com</span>
    <span>${fmtDate()}</span>
  </footer>

</div>${'</body></html>'}`;
    const w=window.open('','_blank');
    w.document.write(html);
    w.document.close();
  };

  return(
    <div style={{animation:'fadeInUp .3s ease'}}>
      {/* Header cliente */}
      {isMobile?(
        <div style={{marginBottom:14}}>
          {/* Riga 1: indietro + nome + profilo */}
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
            <button style={{...S.btn('ghost',true),padding:'8px 12px',flexShrink:0}} onClick={onBack}>←</button>
            <Avatar nome={p.nome} cognome={p.cognome} size={42} foto={p.foto||''}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:17,fontWeight:800,color:C.strong,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.nome} {p.cognome}</div>
              <div style={{fontSize:11,color:C.muted,marginTop:2,display:'flex',alignItems:'center',gap:6}}>
                <span>{p.id}</span>
                {pr&&<span style={S.tag(pr.c,pr.bg)}>{pr.code==='A'?T.profileLowShort:pr.code==='B'?T.profileMedShort:pr.code==='C+'?T.profileExcellentShort:T.profileGoodShort}</span>}
              </div>
            </div>
          </div>
          {/* Riga 2: bottoni azione scrollabili */}
          <div className="hide-scrollbar" style={{display:'flex',gap:8,overflowX:'auto',whiteSpace:'nowrap',paddingBottom:4,WebkitOverflowScrolling:'touch',scrollbarWidth:'none',msOverflowStyle:'none'}}>
            <button style={{padding:'6px 12px',borderRadius:8,border:'1px solid #10b98140',background:'#10b98120',cursor:'pointer',color:'#6ee7b7',fontSize:12,fontWeight:600,fontFamily:'inherit',display:'flex',alignItems:'center',gap:4,flexShrink:0}} onClick={onValuta}>{T.valutaNow}</button>
            <button style={{padding:'6px 12px',borderRadius:8,border:'1px solid #10b98140',background:'#10b98120',cursor:'pointer',color:'#6ee7b7',fontSize:12,fontWeight:600,fontFamily:'inherit',display:'flex',alignItems:'center',gap:4,flexShrink:0}} onClick={generaPDF}>📄 PDF</button>
            <button style={{padding:'6px 12px',borderRadius:8,border:'1px solid '+C.border2,background:'transparent',cursor:'pointer',color:C.dim,fontSize:12,fontWeight:600,fontFamily:'inherit',display:'flex',alignItems:'center',gap:4,flexShrink:0}} onClick={onEdit}>{'✏️ '+T.edit}</button>
            {p.telefono&&<a href={'https://wa.me/'+p.telefono.replace(/[\s\-\(\)\+]/g,'')+'?text='+encodeURIComponent(T.waMessage.replace('{name}',p.nome))} target="_blank" rel="noreferrer" style={{padding:'6px 12px',borderRadius:8,border:'1px solid #25D36640',background:'#25D36620',cursor:'pointer',color:'#25D366',fontSize:12,fontWeight:600,fontFamily:'inherit',display:'flex',alignItems:'center',gap:4,flexShrink:0,textDecoration:'none'}}>💬 WhatsApp</a>}
          </div>
        </div>
      ):(
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
          <button style={{...S.btn('ghost',true),display:'flex',alignItems:'center',gap:4}} onClick={onBack}>← {T.back}</button>
          <Avatar nome={p.nome} cognome={p.cognome} size={44} foto={p.foto||''}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
              <h1 style={{fontSize:18,fontWeight:800,color:C.strong,margin:0}}>{p.nome} {p.cognome}</h1>
              {pr&&<span style={S.tag(pr.c,pr.bg)}>{pr.code==='A'?T.profileLowShort:pr.code==='B'?T.profileMedShort:pr.code==='C+'?T.profileExcellentShort:T.profileGoodShort}</span>}
            </div>
            <div style={{fontSize:11,color:C.muted,marginTop:2}}>{p.id} · {p.dataValutazione}</div>
          </div>
          <div className="tt"><button onMouseEnter={function(e){e.currentTarget.style.borderColor=C.blue;e.currentTarget.style.color=C.blue;}} onMouseLeave={function(e){e.currentTarget.style.borderColor=C.border2;e.currentTarget.style.color=C.text;}} style={{background:C.card,border:'1px solid '+C.border2,color:C.text,padding:'9px 16px',borderRadius:8,fontSize:13,fontWeight:600,cursor:'pointer',transition:'all .2s',display:'flex',alignItems:'center',gap:6}} onClick={onValuta}>{T.valutaNow}</button><span className="tp">{T.tooltipStartAssess}</span></div>
          <div className="tt"><button onMouseEnter={function(e){e.currentTarget.style.borderColor=C.blue;e.currentTarget.style.color=C.blue;}} onMouseLeave={function(e){e.currentTarget.style.borderColor=C.border2;e.currentTarget.style.color=C.text;}} style={{background:C.card,border:'1px solid '+C.border2,color:C.text,padding:'9px 16px',borderRadius:8,fontSize:13,fontWeight:600,cursor:'pointer',transition:'all .2s',display:'flex',alignItems:'center',gap:6}} onClick={generaPDF}>{T.reportPdf}</button><span className="tp">{T.tooltipDownloadReport}</span></div>

          {p.telefono&&<div className="tt"><a href={'https://wa.me/'+p.telefono.replace(/[\s\-\(\)\+]/g,'')+'?text='+encodeURIComponent(T.waMessage.replace('{name}',p.nome))} target="_blank" rel="noreferrer" onMouseEnter={function(e){e.currentTarget.style.borderColor='#25D366';e.currentTarget.style.color='#25D366';}} onMouseLeave={function(e){e.currentTarget.style.borderColor=C.border2;e.currentTarget.style.color=C.text;}} style={{background:C.card,border:'1px solid '+C.border2,color:C.text,padding:'9px 16px',borderRadius:8,fontSize:13,fontWeight:600,cursor:'pointer',transition:'all .2s',display:'flex',alignItems:'center',gap:6,textDecoration:'none'}}>💬 WhatsApp</a><span className="tp">{T.tooltipWhatsapp}</span></div>}
          <div className="tt"><button onMouseEnter={function(e){e.currentTarget.style.borderColor=C.blue;e.currentTarget.style.color=C.blue;}} onMouseLeave={function(e){e.currentTarget.style.borderColor=C.border2;e.currentTarget.style.color=C.text;}} style={{background:C.card,border:'1px solid '+C.border2,color:C.text,padding:'9px 16px',borderRadius:8,fontSize:13,fontWeight:600,cursor:'pointer',transition:'all .2s',display:'flex',alignItems:'center',gap:6}} onClick={onEdit}>✏ {T.edit}</button><span className="tp">{T.tooltipEditClient}</span></div>
          <div className="tt"><button onMouseEnter={function(e){e.currentTarget.style.borderColor=C.blue;e.currentTarget.style.color=C.blue;}} onMouseLeave={function(e){e.currentTarget.style.borderColor=C.border2;e.currentTarget.style.color=C.text;}} style={{background:C.card,border:'1px solid '+C.border2,color:C.text,padding:'9px 16px',borderRadius:8,fontSize:13,fontWeight:600,cursor:'pointer',transition:'all .2s',display:'flex',alignItems:'center',gap:6}} onClick={onDelete}>🗑</button><span className="tp">{T.tooltipDeleteClient}</span></div>
        </div>
      )}

      {/* Tabs scorrevoli */}
      <div className="hide-scrollbar" style={{display:'flex',gap:3,marginBottom:14,background:C.sidebar,borderRadius:9,padding:3,overflowX:'auto',whiteSpace:'nowrap',WebkitOverflowScrolling:'touch',scrollbarWidth:'none',msOverflowStyle:'none'}}>
        {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{...S.btn(tab===t.id?'primary':'ghost',true),borderRadius:6,border:'none',whiteSpace:'nowrap',fontSize:12,padding:isMobile?'6px 12px':'5px 12px',flexShrink:0}}>{t.l}</button>)}
      </div>

      {tab==='panoramica'&&(
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          {(!p.sesso||p.sesso==='')&&(
            <div style={{background:'#FAEEDA',border:'1px solid #EF9F27',borderRadius:12,padding:'14px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
              <div style={{fontSize:13,color:'#633806',lineHeight:1.5}}>
                <strong style={{fontWeight:700,color:'#854F0B'}}>{T.missingSex}</strong><br/>
                {T.missingSexDesc}
              </div>
              <button onClick={onEdit} style={{background:'#EF9F27',color:'#fff',border:'none',padding:'8px 14px',borderRadius:8,fontSize:13,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>{T.addSex}</button>
            </div>
          )}
          {(()=>{
            var scad=p.screeningMedico?.dataScadenza;
            if(!scad) return null;
            var today=new Date().toISOString().split('T')[0];
            var d30=new Date();d30.setDate(d30.getDate()+30);
            var d30s=d30.toISOString().split('T')[0];
            var isExp=scad<today;
            var isSoon=!isExp&&scad<=d30s;
            if(!isExp&&!isSoon) return null;
            return(
              <div style={{background:isExp?C.red+'10':'#fef3c7',border:'1px solid '+(isExp?C.red:'#f59e0b')+'50',borderRadius:12,padding:'14px 16px',display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
                <span style={{fontSize:20}}>{isExp?'🔴':'🟠'}</span>
                <div style={{flex:1,fontSize:13,color:isExp?C.red:'#92400e',lineHeight:1.5}}>
                  <strong style={{fontWeight:700}}>{isExp?T.certExpiredTitle:T.certExpiringSoon}</strong><br/>
                  {isExp?T.certExpiredBody.replace('{date}',scad):T.certExpiringSoonBody.replace('{date}',scad)}
                </div>
                <button onClick={onEdit} style={{background:isExp?C.red:'#f59e0b',color:'#fff',border:'none',padding:'8px 14px',borderRadius:8,fontSize:13,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>{isExp?T.certRenew:T.certCheck}</button>
              </div>
            );
          })()}
          {/* Off-track alert */}
          {(function(){
            var os=p.obiettivoStrutturato;
            if(!os||!os.tassoAttesoSettimana)return null;
            if(!p.progressi||p.progressi.length<2)return null;
            var sorted=[...p.progressi].sort(function(a,b){return new Date(a.data)-new Date(b.data);});
            var primo=sorted[0];var ultimo=sorted[sorted.length-1];
            var settimane=Math.ceil((new Date(ultimo.data)-new Date(primo.data))/(1000*60*60*24*7));
            if(settimane<2)return null;
            var deltaOsservato=(parseFloat(ultimo.peso)-parseFloat(primo.peso))/settimane;
            var atteso=os.tassoAttesoSettimana;
            var ratio=Math.abs(atteso)>0?Math.abs(deltaOsservato)/Math.abs(atteso):1;
            if(ratio>=0.8&&ratio<=1.2)return null;
            var offTrack=ratio<0.8?'sotto':'sopra';
            return(
              <div style={{background:'#fef3c7',border:'1px solid #f59e0b50',borderRadius:12,padding:'14px 16px',display:'flex',alignItems:'flex-start',gap:12,flexWrap:'wrap'}}>
                <span style={{fontSize:20}}>📊</span>
                <div style={{flex:1,fontSize:13,color:'#92400e',lineHeight:1.5}}>
                  <strong style={{fontWeight:700,color:'#854F0B'}}>{offTrack==='sotto'?T.offTrackBelow:T.offTrackAbove}</strong><br/>
                  {T.offTrackLine1.replace('{obs}',deltaOsservato.toFixed(2)).replace('{exp}',atteso.toFixed(2)).replace('{pct}',Math.round(ratio*100))}<br/>
                  {offTrack==='sotto'?T.offTrackLow:T.offTrackHigh}
                </div>
              </div>
            );
          })()}
          {/* HERO ROW */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            {/* Card Peso */}
            <div style={{background:C.card,border:'1px solid '+C.border2,borderRadius:12,padding:isMobile?12:20,display:'flex',alignItems:'center',gap:isMobile?10:16}}>
              <div style={{width:isMobile?40:52,height:isMobile?40:52,borderRadius:'50%',border:'3px solid '+C.blue,background:C.blue+'15',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <span style={{fontSize:isMobile?10:11,fontWeight:600,color:C.muted}}>kg</span>
              </div>
              <div style={{minWidth:0}}>
                <div style={{fontSize:isMobile?22:36,fontWeight:900,color:C.strong,lineHeight:1}}>{p.peso||'—'}</div>
                <div style={{fontSize:isMobile?11:12,fontWeight:600,color:C.muted}}>{T.pdfActualWeight}</div>
                {p.altezza&&p.peso&&(()=>{const tgt=(24.9*Math.pow(p.altezza/100,2)).toFixed(1);const diff=(p.peso-tgt).toFixed(1);return <div style={{fontSize:isMobile?10:12,color:C.dim,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{diff<0?T.belowTarget:T.targetLabel+' '+tgt+' kg'}</div>;})()}
              </div>
            </div>
            {/* Card BMI */}
            <div style={{background:C.card,border:'1px solid '+C.border2,borderRadius:12,padding:isMobile?12:20,display:'flex',alignItems:'center',gap:isMobile?10:16}}>
              <div style={{width:isMobile?40:52,height:isMobile?40:52,borderRadius:'50%',border:'3px solid '+(bc||C.muted),background:(bc||C.muted)+'15',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <span style={{fontSize:isMobile?10:11,fontWeight:600,color:C.muted}}>BMI</span>
              </div>
              <div style={{minWidth:0}}>
                <div style={{fontSize:isMobile?22:36,fontWeight:900,color:C.strong,lineHeight:1}}>{b||'—'}</div>

          </div>
          {/* GRIGLIA COMPATTA */}
          <div style={{display:'grid',gridTemplateColumns:isMobile?'repeat(3, 1fr)':'repeat(5, 1fr)',gap:isMobile?8:10}}>

              {label:'PA',value:p.pa||'—',unit:''},
              {label:'6MWT',value:p.test?.mwtDist||'—',unit:'m'},

                <div style={{fontSize:isMobile?16:18,fontWeight:800,color:C.strong}}>{item.value}</div>
                {item.unit&&<div style={{fontSize:11,color:C.muted}}>{item.unit}</div>}
              </div>
            ))}
          </div>
          {/* INFO CLINICHE + TARGET FC */}
          <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'1fr 1fr',gap:12}}>
            <div style={{background:C.card,border:'1px solid '+C.border2,borderRadius:12,padding:isMobile?16:20}}>
              <div style={S.st}>{T.secInfoClinica}</div>
              {[[T.fPath,p.patologie],[T.fMeds,p.farmaci],[T.fGoal,p.obiettivo],[T.fActivity,p.attivita]].map(([k,v])=>(
                <div key={k} style={{display:'flex',justifyContent:'space-between',fontSize:13,padding:'5px 0',borderBottom:`1px solid ${C.border}`}}>
                  <span style={{color:C.muted}}>{k}</span><span style={{color:C.text,fontWeight:500}}>{v||'—'}</span>
                </div>
              ))}
            </div>
            <div style={{background:C.card,border:'1px solid '+C.border2,borderRadius:12,padding:isMobile?16:20}}>
              <div style={S.st}>{T.secTargetFC}</div>
              {[
                [T.pdfTargetWeight,p.altezza?`${(24.9*(p.altezza/100)**2).toFixed(1)} kg`:'—'],
                [T.weightLossNeeded,p.altezza&&p.peso?`${(p.peso-24.9*(p.altezza/100)**2).toFixed(1)} kg`:'—'],
                [T.pdfFCMax,fcMax?`${fcMax} bpm`:'—'],
                [T.pdfFCTarget60,fcMax?`${Math.round(fcMax*.6)} bpm`:'—'],
                [T.pdfFCTarget75,fcMax?`${Math.round(fcMax*.75)} bpm`:'—'],
              ].map(([k,v])=>(
                <div key={k} style={{display:'flex',justifyContent:'space-between',fontSize:13,padding:'5px 0',borderBottom:`1px solid ${C.border}`}}>
                  <span style={{color:C.muted}}>{k}</span><span style={{color:C.strong,fontWeight:600}}>{v}</span>
                </div>
              ))}
            </div>
          </div>
          {/* Statistiche (ex tab stats) */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4}}>
            <div style={S.st}>{T.secWeightProgress}</div>
            <button style={S.btn('',true)} onClick={()=>setShowPesoModal(true)}>{T.statMeasure}</button>
          </div>
          <div style={S.card}><LineChartComp data={(p.progressi||[]).map(x=>({x:x.data.slice(0,5),y:x.peso}))} color={C.blue} T={T}/></div>
          <div style={S.grid(2)}>
            <div style={S.card}><div style={S.st}>{T.statRpe}</div><BarChartComp data={(p.log||[]).slice(-10).map(s=>({x:s.data.slice(0,5),y:s.rpe}))} color={C.orange} T={T}/></div>
            <div style={S.card}><div style={S.st}>{T.statDuration}</div><BarChartComp data={(p.log||[]).slice(-10).map(s=>({x:s.data.slice(0,5),y:s.durata}))} color={C.green} T={T}/></div>
          </div>
          <div style={S.card}>
            <div style={S.st}>{T.secWeightHistory}</div>
            {(p.progressi||[]).map((x,i)=>(
              <div key={x.data+'-'+i} style={{display:'flex',justifyContent:'space-between',fontSize:13,padding:'6px 0',borderBottom:`1px solid ${C.border}`}}>
                <span style={{color:C.muted}}>{x.data}</span>
                <span style={{color:C.blue,fontWeight:700}}>{x.peso} kg</span>
                <span style={{color:C.muted}}>{x.nota}</span>
                <button style={{...S.btn('danger',true),padding:'2px 7px',fontSize:11}} onClick={()=>upd(x2=>({progressi:x2.progressi.filter((_,ii)=>ii!==i)}))}>✕</button>
              </div>
            ))}
          </div>
        </div>
      )}

      {tab==='profilo'&&(
        <div style={{display:'flex',flexDirection:'column',gap:4}}>
          {/* Sezione A: Anagrafica e contatti */}
          <div onClick={()=>setOpenSections(s=>({...s,ana:!s.ana}))} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 16px',background:C.card,border:'1px solid '+C.border2,borderRadius:10,cursor:'pointer',marginBottom:8}}>
            <span style={{fontSize:14,fontWeight:700,color:C.strong}}>{T.secAnaContact}</span>
            <span style={{fontSize:12,color:C.muted}}>{openSections.ana?'▲':'▼'}</span>
          </div>
          {openSections.ana&&(
            <div style={{animation:'fadeInUp .2s ease',marginBottom:8}}>
              <div style={{display:'flex',flexDirection:'column',gap:14}}>
                {[
                  {title:T.secAna,fields:[[T.lblID,p.id],[T.fSurname,p.cognome],[T.fName,p.nome],[T.lblDob,p.ddn],[T.fGender,p.sesso],[T.lblYearBirth,p.annoNascita]]},
                  {title:T.secAntropo,fields:[[T.fHeight,`${p.altezza} cm`],[T.fWeight,`${p.peso} kg`],[T.fBMI,`${b} — ${bl}`],[T.fWaist,`${p.vita} cm`],[T.fHips,`${p.fianchi} cm`],[T.fPA,p.pa],[T.fFC,`${p.fc} bpm`]]},
                  {title:T.secClinica,fields:[[T.fPath,p.patologie],[T.fMeds,p.farmaci],[T.fSymp,p.sintomiSforzo],[T.fAllerg,p.allergie]]},
                  {title:T.secLife,fields:[[T.fActivity,p.attivita],[T.fGoal,p.obiettivo],[T.fPref,p.preferenze],[T.fStress,p.stressPercepito],[T.fSleep,p.sonno]]},
                ].map(({title,fields})=>(
                  <div key={title} style={S.card}>
                    <div style={S.st}>{title}</div>
                    <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'repeat(3,1fr)',gap:'10px 20px'}}>
                      {fields.map(([k,v])=><div key={k}><div style={S.label}>{k}</div><div style={{fontSize:13,color:C.text,padding:'4px 0'}}>{v||'—'}</div></div>)}
                    </div>
                  </div>
                ))}
                {p.obiettivoStrutturato && (p.obiettivoStrutturato.pesoTarget || p.obiettivoStrutturato.rmTarget || p.obiettivoStrutturato.eventoTarget) && (
                  <div style={S.card}>
                    <div style={{fontSize:11,color:'#6B7280',letterSpacing:'0.5px',fontWeight:500,marginBottom:6,textTransform:'uppercase'}}>Dettagli Obiettivo</div>
                    {p.obiettivoStrutturato.pesoTarget && <div style={{fontSize:13,color:C.text}}>Peso target: <strong>{p.obiettivoStrutturato.pesoTarget} kg</strong> in {p.obiettivoStrutturato.tempoMesi} mesi</div>}
                    {p.obiettivoStrutturato.rmTarget && <div style={{fontSize:13,color:C.text}}>{p.obiettivoStrutturato.esercizioTarget}: <strong>{p.obiettivoStrutturato.rmAttuale} → {p.obiettivoStrutturato.rmTarget} kg</strong> in {p.obiettivoStrutturato.tempoMesi} mesi</div>}
                    {p.obiettivoStrutturato.eventoTarget && <div style={{fontSize:13,color:C.text}}>Evento: <strong>{p.obiettivoStrutturato.eventoTarget}</strong> ({p.obiettivoStrutturato.dataEvento})</div>}
                    {p.obiettivoStrutturato.tassoAttesoSettimana > 0 && <div style={{fontSize:12,color:'#6B7280',marginTop:4}}>Tasso atteso: {p.obiettivoStrutturato.tassoAttesoSettimana.toFixed(2)}/sett · Kcal delta: {p.obiettivoStrutturato.kcalTargetCalcolato}/die</div>}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Sezione B: Test funzionali e profilo fitness */}
          <div onClick={()=>setOpenSections(s=>({...s,test:!s.test}))} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 16px',background:C.card,border:'1px solid '+C.border2,borderRadius:10,cursor:'pointer',marginBottom:8}}>
            <span style={{fontSize:14,fontWeight:700,color:C.strong}}>{T.secTestFitness}</span>
            <span style={{fontSize:12,color:C.muted}}>{openSections.test?'▲':'▼'}</span>
          </div>
          {openSections.test&&(
            <div style={{animation:'fadeInUp .2s ease',marginBottom:8}}>
              <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {/* Profilo risultante */}
          <div style={{...S.card,border:'2px solid '+(pr?.c||C.border2)+'40',background:(pr?.c||C.border2)+'08'}}>
            <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:pr?12:0}}>
              {pr?<React.Fragment><span style={{fontSize:22,fontWeight:900,color:pr.c}}>{pr.code==='A'?T.profileLowShort:pr.code==='B'?T.profileMedShort:pr.code==='C+'?T.profileExcellentShort:T.profileGoodShort}</span><div style={{flex:1}}>
                <div style={{display:'flex',alignItems:'baseline',gap:8}}><div style={{fontSize:16,fontWeight:700,color:C.strong}}>{pr.l}</div><div style={{fontSize:20,fontWeight:900,color:pr.c}}>{pr.score}/100</div></div>
                <div style={{fontSize:12,color:C.muted,marginTop:3}}>{T.weightedScore} · {p.dataValutazione}</div>
              </div></React.Fragment>
              :<span style={{color:C.muted}}>{T.enterResults}</span>}
            </div>
            {pr&&<React.Fragment><ScoreBar score={pr.score} color={pr.c} height={12}/>
              <div style={{marginTop:12}}><ScoreBreakdown pr={pr} compact={true} T={T}/></div>
            </React.Fragment>}
          </div>

          {/* Test principali */}
          <div style={S.grid(2)}>
            <div style={{...S.card,borderLeft:`3px solid ${C.blue}`}}>
              <div style={{fontSize:11,fontWeight:700,color:C.blue,textTransform:'uppercase',marginBottom:8}}>{T.test6MWT}</div>
              {[[T.lblDistance,`${p.test?.mwtDist||'—'} m`],[T.lblRpe,p.test?.mwtRpe||'—'],[T.lblSymptoms,p.test?.mwtSintomi||'—']].map(([k,v])=>(
                <div key={k} style={{display:'flex',justifyContent:'space-between',fontSize:12,padding:'5px 0',borderBottom:`1px solid ${C.border}`}}><span style={{color:C.muted}}>{k}</span><span style={{color:C.text,fontWeight:600}}>{v}</span></div>
              ))}
              {p.test?.mwtDist&&<div style={{marginTop:8,fontSize:11,fontWeight:700,color:+p.test.mwtDist<300?C.red:+p.test.mwtDist<=450?C.yellow:C.green}}>{+p.test.mwtDist<300?T.capVeryLow:+p.test.mwtDist<=450?T.capMod:T.capGood}</div>}
            </div>
            <div style={{...S.card,borderLeft:`3px solid ${C.green}`}}>
              <div style={{fontSize:11,fontWeight:700,color:C.green,textTransform:'uppercase',marginBottom:8}}>{T.testSTS}</div>
              {[[T.lblReps,p.test?.stsRip||'—'],[T.fProgNote,p.test?.stsNote||'—']].map(([k,v])=>(
                <div key={k} style={{display:'flex',justifyContent:'space-between',fontSize:12,padding:'5px 0',borderBottom:`1px solid ${C.border}`}}><span style={{color:C.muted}}>{k}</span><span style={{color:C.text,fontWeight:600}}>{v}</span></div>
              ))}
              {p.test?.stsRip&&<div style={{marginTop:8,fontSize:11,fontWeight:700,color:+p.test.stsRip<10?C.red:+p.test.stsRip<=15?C.yellow:C.green}}>{+p.test.stsRip<10?T.strVeryLow:+p.test.stsRip<=15?T.strMod:T.strGood}</div>}
            </div>
          </div>

          {/* Test fisici aggiuntivi */}
          {(p.test?.pushupRip||p.test?.plankSec||p.test?.squatRip||p.test?.tugSec||p.test?.slbDx)&&(
            <div style={S.card}>
              <div style={S.st}>{T.physicalTests}</div>
              <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'1fr 1fr',gap:10}}>
                {p.test?.pushupRip&&(()=>{const i=interpPushup(p.test.pushupRip,p.sesso);return<div style={{background:i?.c+'12',border:`1px solid ${i?.c}30`,borderRadius:8,padding:'10px 12px'}}><div style={{fontSize:11,color:C.muted,marginBottom:4}}>Push-up</div><div style={{fontSize:16,fontWeight:800,color:i?.c}}>{p.test.pushupRip} rip.</div><div style={{fontSize:11,color:i?.c,fontWeight:600}}>{i?.l}</div><div style={{fontSize:10,color:C.muted,marginTop:3}}>💡 {i?.cons}</div></div>})()}
                {p.test?.plankSec&&(()=>{const i=interpPlank(p.test.plankSec);return<div style={{background:i?.c+'12',border:`1px solid ${i?.c}30`,borderRadius:8,padding:'10px 12px'}}><div style={{fontSize:11,color:C.muted,marginBottom:4}}>Plank</div><div style={{fontSize:16,fontWeight:800,color:i?.c}}>{p.test.plankSec}s</div><div style={{fontSize:11,color:i?.c,fontWeight:600}}>{i?.l}</div><div style={{fontSize:10,color:C.muted,marginTop:3}}>💡 {i?.cons}</div></div>})()}
                {p.test?.squatRip&&(()=>{const i=interpSquat(p.test.squatRip);return<div style={{background:i?.c+'12',border:`1px solid ${i?.c}30`,borderRadius:8,padding:'10px 12px'}}><div style={{fontSize:11,color:C.muted,marginBottom:4}}>Squat</div><div style={{fontSize:16,fontWeight:800,color:i?.c}}>{p.test.squatRip} rip.</div><div style={{fontSize:11,color:i?.c,fontWeight:600}}>{i?.l}</div><div style={{fontSize:10,color:C.muted,marginTop:3}}>💡 {i?.cons}</div></div>})()}
                {p.test?.tugSec&&(()=>{const i=interpTUG(p.test.tugSec);return<div style={{background:i?.c+'12',border:`1px solid ${i?.c}30`,borderRadius:8,padding:'10px 12px'}}><div style={{fontSize:11,color:C.muted,marginBottom:4}}>TUG</div><div style={{fontSize:16,fontWeight:800,color:i?.c}}>{p.test.tugSec}s</div><div style={{fontSize:11,color:i?.c,fontWeight:600}}>{i?.l}</div><div style={{fontSize:10,color:C.muted,marginTop:3}}>💡 {i?.cons}</div></div>})()}
                {(p.test?.slbDx||p.test?.slbSx)&&(()=>{const avg=((+p.test.slbDx||0)+(+p.test.slbSx||0))/((p.test.slbDx?1:0)+(p.test.slbSx?1:0));const i=interpSLB(avg);return<div style={{background:i?.c+'12',border:`1px solid ${i?.c}30`,borderRadius:8,padding:'10px 12px'}}><div style={{fontSize:11,color:C.muted,marginBottom:4}}>Single Leg Balance</div><div style={{fontSize:16,fontWeight:800,color:i?.c}}>dx {p.test.slbDx||'—'}s / sx {p.test.slbSx||'—'}s</div><div style={{fontSize:11,color:i?.c,fontWeight:600}}>{i?.l}</div><div style={{fontSize:10,color:C.muted,marginTop:3}}>💡 {i?.cons}</div></div>})()}
                {p.test?.fcPost&&p.test?.fcRecup&&(()=>{const delta=+p.test.fcPost-+p.test.fcRecup;const i=interpRecupFC(delta);return<div style={{background:i?.c+'12',border:`1px solid ${i?.c}30`,borderRadius:8,padding:'10px 12px'}}><div style={{fontSize:11,color:C.muted,marginBottom:4}}>Recupero FC</div><div style={{fontSize:16,fontWeight:800,color:i?.c}}>-{delta} bpm/min</div><div style={{fontSize:11,color:i?.c,fontWeight:600}}>{i?.l}</div><div style={{fontSize:10,color:C.muted,marginTop:3}}>💡 {i?.cons}</div></div>})()}
              </div>
            </div>
          )}

          {/* Composizione corporea */}
          {(p.test?.cirBraccio||p.test?.massaGrassa||p.test?.plicaSott)&&(
            <div style={S.card}>
              <div style={S.st}>{T.bodyComposition}</div>
              <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr 1fr':'repeat(4,1fr)',gap:8}}>
                {p.test?.cirBraccio&&<div style={{background:C.bg,borderRadius:8,padding:'8px',textAlign:'center'}}><div style={{fontSize:14,fontWeight:800,color:C.blue}}>{p.test.cirBraccio}cm</div><div style={{fontSize:10,color:C.muted}}>{T.lblArm}</div></div>}
                {p.test?.cirCoscia&&<div style={{background:C.bg,borderRadius:8,padding:'8px',textAlign:'center'}}><div style={{fontSize:14,fontWeight:800,color:C.blue}}>{p.test.cirCoscia}cm</div><div style={{fontSize:10,color:C.muted}}>{T.lblThigh}</div></div>}
                {p.test?.cirPolpaccio&&<div style={{background:C.bg,borderRadius:8,padding:'8px',textAlign:'center'}}><div style={{fontSize:14,fontWeight:800,color:C.blue}}>{p.test.cirPolpaccio}cm</div><div style={{fontSize:10,color:C.muted}}>{T.lblCalf}</div></div>}
                {p.test?.massaGrassa&&(()=>{const mg=+p.test.massaGrassa,m=p.sesso==='M';const ok=m?mg<25:mg<32;return<div style={{background:ok?C.green+'12':C.red+'12',borderRadius:8,padding:'8px',textAlign:'center',border:`1px solid ${ok?C.green:C.red}30`}}><div style={{fontSize:14,fontWeight:800,color:ok?C.green:C.red}}>{mg}%</div><div style={{fontSize:10,color:C.muted}}>{T.lblBodyFat}</div></div>})()}
              </div>
              {p.vita&&p.fianchi&&(()=>{const ratio=(+p.vita/+p.fianchi).toFixed(2);const alto=p.sesso==='M'?ratio>0.9:ratio>0.85;return<div style={{marginTop:8,background:alto?C.red+'12':C.green+'12',border:`1px solid ${alto?C.red:C.green}30`,borderRadius:8,padding:'8px 12px',fontSize:12,fontWeight:700,color:alto?C.red:C.green}}>{T.whRatio}: {ratio} — {alto?T.whRisk:T.whOk}</div>})()}
            </div>
          )}

          {/* Benessere psicofisico */}
          {(p.test?.gad7!==undefined&&p.test?.gad7!==''||p.sonno||p.test?.motivazione)&&(
            <div style={S.card}>
              <div style={S.st}>{T.wellnessSection}</div>
              <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'repeat(3,1fr)',gap:10}}>
                {p.test?.gad7!==undefined&&p.test?.gad7!==''&&(()=>{const i=interpGAD7(p.test.gad7);return<div style={{background:i?.c+'12',border:`1px solid ${i?.c}30`,borderRadius:8,padding:'10px 12px'}}><div style={{fontSize:11,color:C.muted,marginBottom:4}}>GAD-7 Ansia</div><div style={{fontSize:20,fontWeight:800,color:i?.c}}>{p.test.gad7}/21</div><div style={{fontSize:11,color:i?.c,fontWeight:600}}>{i?.l}</div><div style={{fontSize:10,color:C.muted,marginTop:3}}>💡 {i?.cons}</div></div>})()}
                {p.sonno&&(()=>{const i=interpSonno(p.sonno);return<div style={{background:i?.c+'12',border:`1px solid ${i?.c}30`,borderRadius:8,padding:'10px 12px'}}><div style={{fontSize:11,color:C.muted,marginBottom:4}}>Sonno</div><div style={{fontSize:20,fontWeight:800,color:i?.c}}>{p.sonno}h</div><div style={{fontSize:11,color:i?.c,fontWeight:600}}>{i?.l}</div><div style={{fontSize:10,color:C.muted,marginTop:3}}>💡 {i?.cons}</div></div>})()}
                {p.test?.motivazione&&<div style={{background:(+p.test.motivazione>=7?C.green:+p.test.motivazione>=4?C.yellow:C.red)+'12',border:`1px solid ${+p.test.motivazione>=7?C.green:+p.test.motivazione>=4?C.yellow:C.red}30`,borderRadius:8,padding:'10px 12px'}}><div style={{fontSize:11,color:C.muted,marginBottom:4}}>Motivazione</div><div style={{fontSize:20,fontWeight:800,color:+p.test.motivazione>=7?C.green:+p.test.motivazione>=4?C.yellow:C.red}}>{p.test.motivazione}/10</div><div style={{fontSize:11,color:+p.test.motivazione>=7?C.green:+p.test.motivazione>=4?C.yellow:C.red,fontWeight:600}}>{+p.test.motivazione>=7?'Alta':''+p.test.motivazione>=4?'Media':'Bassa'}</div></div>}
              </div>
            </div>
          )}

          {/* Parametri Avanzati — interpretazioni scientifiche */}
          {(p.spo2||p.test?.handgrip||p.sitReach||p.bia?.PhA||p.bia?.ECW||p.bia?.FM||p.posturaColonna||p.posturaSpalle||p.mobCaviglia||p.mobAnca||p.parq||p.fumo||p.alcol)&&(
            <div style={S.card}>
              <div style={S.st}>{T.advancedParams}</div>
              <div style={{display:'flex',flexDirection:'column',gap:4}}>
                {p.spo2&&<InterpBox interp={interpSpO2(p.spo2)} icon="🫁"/>}
                {p.test?.handgrip&&<InterpBox interp={interpHandgrip(p.test.handgrip,p.sesso,p.annoNascita?new Date().getFullYear()-p.annoNascita:50)} icon="✊"/>}
                {p.sitReach!==undefined&&p.sitReach!==''&&<InterpBox interp={interpSitReach(p.sitReach,p.sesso)} icon="🧘"/>}
                {p.bia?.PhA&&<InterpBox interp={interpPhA(p.bia.PhA,p.sesso,p.annoNascita?new Date().getFullYear()-p.annoNascita:50)} icon="⚡"/>}
                {p.bia?.ECW&&<InterpBox interp={interpECW_TBW(+p.bia.ECW/100)} icon="💧"/>}
