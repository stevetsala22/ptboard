function AdminModal({onClose}){
  const [users,setUsers]=useState([]);
  const [loading,setLoading]=useState(true);
  const [msg,setMsg]=useState('');
  const [feedbacks,setFeedbacks]=useState([]);
  const [backupLoading,setBackupLoading]=useState(false);

  useEffect(()=>{
    fbGetAllUsers().then(u=>{setUsers(u);setLoading(false);});
    fbDb.collection('deleteFeedback').get().then(s=>{setFeedbacks(s.docs.map(d=>({id:d.id,...d.data()})));}).catch(()=>{});
  },[]);

  const setPlan=async(uid,plan,duration)=>{
    try{
      var updateData={plan:plan};
      if(plan==='pro'||plan==='team'){
        var dur=duration||'monthly';
        var expiryDays=dur==='yearly'?370:33;
        updateData.planType=plan+(dur==='yearly'?'Yearly':'Monthly');
        updateData.planExpiresAt=new Date(Date.now()+expiryDays*24*60*60*1000).toISOString();
      }else{
        updateData.planType='';
        updateData.planExpiresAt='';
      }
      await fbDb.collection('users').doc(uid).update(updateData);
      setUsers(us=>us.map(u=>u.id===uid?{...u,plan:plan,planType:updateData.planType,planExpiresAt:updateData.planExpiresAt||undefined}:u));
      setMsg('✓ Piano aggiornato');
      setTimeout(()=>setMsg(''),2000);
    }catch(e){
      console.error('Errore salvataggio piano:',e);
      setMsg('❌ Errore nel salvataggio: '+e.message);
      setTimeout(()=>setMsg(''),4000);
    }
  };

  const planColor={trial:'#f59e0b',pro:'#10b981',team:'#8b5cf6',blocked:'#ef4444'};
  const sel={padding:'5px 8px',borderRadius:6,border:'1px solid #334155',background:'#0f172a',color:'#e2e8f0',fontSize:12,fontFamily:'inherit',cursor:'pointer'};

  return(
    <div style={{position:'fixed',inset:0,background:'#000000b0',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <div style={{background:'#0f1623',border:'1px solid #1e2d47',borderRadius:16,width:'min(860px,95vw)',maxHeight:'90vh',overflowY:'auto'}}>
        {/* Header */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'18px 22px',borderBottom:'1px solid #1e2d47'}}>
          <div style={{fontSize:16,fontWeight:800,color:'#f8fafc'}}>👑 Pannello Admin</div>
          <button onClick={onClose} style={{background:'none',border:'none',color:'#64748b',fontSize:18,cursor:'pointer',padding:'0 4px'}}>✕</button>
        </div>

        <div style={{padding:22}}>
          {/* Stats */}
          <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr 1fr':'repeat(4,1fr)',gap:10,marginBottom:20}}>
            {[
              ['Totale',users.length,'#3b82f6'],
              ['Trial attivi',users.filter(u=>u.plan==='trial'&&!isTrialExpired(u)).length,'#f59e0b'],
              ['Pro/Team',users.filter(u=>u.plan==='pro'||u.plan==='team').length,'#10b981'],
              ['Scaduti',users.filter(u=>isTrialExpired(u)&&u.plan!=='pro'&&u.plan!=='team').length,'#ef4444'],
            ].map(([l,v,c])=>(
              <div key={l} style={{background:'#07090f',border:'1px solid #1e2d47',borderRadius:10,padding:'12px 14px',textAlign:'center'}}>
                <div style={{fontSize:10,color:'#64748b',marginBottom:4,textTransform:'uppercase',letterSpacing:.5}}>{l}</div>
                <div style={{fontSize:26,fontWeight:900,color:c}}>{v}</div>
              </div>
            ))}
          </div>

          {msg&&<div style={{background:'#10b98120',border:'1px solid #10b98140',borderRadius:8,padding:'9px 14px',color:'#10b981',fontSize:13,marginBottom:14}}>{msg}</div>}

          {/* Table */}
          {loading?<div style={{padding:40,textAlign:'center',color:'#475569'}}>Caricamento...</div>:
          users.length===0?<div style={{padding:40,textAlign:'center',color:'#475569'}}>Nessun utente ancora</div>:
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
              <thead>
                <tr style={{borderBottom:'1px solid #1e2d47'}}>
                  {['Email','Nome','Piano','Giorni rimasti','Iscritto','Cambia piano'].map(h=>(
                    <th key={h} style={{padding:'9px 12px',textAlign:'left',fontSize:10,color:'#475569',fontWeight:700,textTransform:'uppercase',letterSpacing:.5,whiteSpace:'nowrap'}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {users.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(u=>(
                  <tr key={u.id} style={{borderBottom:'1px solid #0f172a'}}>
                    <td style={{padding:'10px 12px',color:'#e2e8f0'}}>{u.email}</td>
                    <td style={{padding:'10px 12px',color:'#94a3b8'}}>{u.displayName||'—'}</td>
                    <td style={{padding:'10px 12px'}}>
                      <span style={{padding:'3px 9px',borderRadius:20,fontSize:11,fontWeight:700,background:(planColor[u.plan]||'#475569')+'25',color:planColor[u.plan]||'#94a3b8'}}>
                        {u.plan||'trial'}
                      </span>
                    </td>
                    <td style={{padding:'10px 12px',fontWeight:600,color:(function(){
                      if(u.plan==='blocked') return '#ef4444';
                      if(u.plan==='pro'||u.plan==='team'){
                        if(!u.planExpiresAt||u.planExpiresAt==='') return '#10b981';
                        var daysR=Math.ceil((new Date(u.planExpiresAt)-Date.now())/(1000*60*60*24));
                        return daysR<3?'#ef4444':daysR<=7?'#f59e0b':'#10b981';
                      }
                      return isTrialExpired(u)?'#ef4444':'#10b981';
                    })()}}>
                      {(function(){
                        if(u.plan==='blocked') return 'Scaduto';
                        if(u.plan==='pro'||u.plan==='team'){
                          if(!u.planExpiresAt||u.planExpiresAt==='') return '∞';
                          var daysR=Math.max(0,Math.ceil((new Date(u.planExpiresAt)-Date.now())/(1000*60*60*24)));
                          return daysR+'g';
                        }
                        return isTrialExpired(u)?'Scaduto':trialDaysLeft(u)+'g';
                      })()}
                    </td>
                    <td style={{padding:'10px 12px',color:'#475569',whiteSpace:'nowrap'}}>
                      {u.createdAt?new Date(u.createdAt).toLocaleDateString('it-IT'):'—'}
                    </td>
                    <td style={{padding:'10px 12px',display:'flex',gap:6,alignItems:'center'}}>
                      <select style={sel} value={u.plan||'trial'} onChange={e=>{
                        var newPlan=e.target.value;
                        var dur=(newPlan==='pro'||newPlan==='team')?(u.planType&&u.planType.includes('Yearly')?'yearly':'monthly'):null;
                        setPlan(u.id,newPlan,dur);
                      }}>
                        <option value="trial">Trial</option>
                        <option value="pro">✅ Pro</option>
                        <option value="team">👥 Team</option>
                        <option value="blocked">🚫 Bloccato</option>
                      </select>
                      {(u.plan==='pro'||u.plan==='team')&&<select style={sel} value={u.planType&&u.planType.includes('Yearly')?'yearly':'monthly'} onChange={e=>setPlan(u.id,u.plan,e.target.value)}>
                        <option value="monthly">Mensile</option>
                        <option value="yearly">Annuale</option>
                      </select>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>}

          {/* Feedback eliminazioni */}
          <div style={{marginTop:28}}>
            <div style={{fontSize:14,fontWeight:800,color:'#f8fafc',marginBottom:12}}>📋 Feedback eliminazioni</div>
            {feedbacks.length===0?<div style={{padding:20,textAlign:'center',color:'#475569',fontSize:13}}>Nessun feedback di eliminazione</div>:
            <div style={{overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                <thead>
                  <tr style={{borderBottom:'1px solid #1e2d47'}}>
                    {['Email','Motivo','Dettaglio','Piano','Giorni usati','Data eliminazione'].map(h=>(
                      <th key={h} style={{padding:'9px 12px',textAlign:'left',fontSize:10,color:'#475569',fontWeight:700,textTransform:'uppercase',letterSpacing:.5,whiteSpace:'nowrap'}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {feedbacks.map(f=>(
                    <tr key={f.id} style={{borderBottom:'1px solid #0f172a'}}>
                      <td style={{padding:'10px 12px',color:'#e2e8f0'}}>{f.email||'—'}</td>
                      <td style={{padding:'10px 12px',color:'#94a3b8'}}>{f.reason||'—'}</td>
                      <td style={{padding:'10px 12px',color:'#94a3b8',maxWidth:200,overflow:'hidden',textOverflow:'ellipsis'}}>{f.detail||'—'}</td>
                      <td style={{padding:'10px 12px',color:'#94a3b8'}}>{f.plan||'—'}</td>
                      <td style={{padding:'10px 12px',color:'#94a3b8'}}>{f.daysUsed!=null?f.daysUsed+'g':'—'}</td>
                      <td style={{padding:'10px 12px',color:'#475569',whiteSpace:'nowrap'}}>{f.deletedAt?new Date(f.deletedAt).toLocaleDateString('it-IT'):'—'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>}
          </div>

          {/* Backup dati */}
          <div style={{marginTop:28}}>
            <div style={{fontSize:14,fontWeight:800,color:'#f8fafc',marginBottom:12}}>📥 Backup dati</div>
            <button disabled={backupLoading} onClick={async function(){
              setBackupLoading(true);
              try{
                var snap=await fbDb.collection('users').get();
                var allUsers=[];
                for(var i=0;i<snap.docs.length;i++){
                  var doc=snap.docs[i];
                  var profile=doc.data();
                  var appdata={};
                  try{
                    var adSnap=await fbDb.collection('users').doc(doc.id).collection('appdata').get();
                    adSnap.docs.forEach(function(ad){appdata[ad.id]=ad.data();});
                  }catch(e){}
                  allUsers.push({uid:doc.id,profile:profile,appdata:appdata});
                }
                var backup={date:new Date().toISOString().slice(0,10),users:allUsers};
                var blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
                var url=URL.createObjectURL(blob);
                var a=document.createElement('a');
                a.href=url;
                a.download='ptboard_backup_'+backup.date+'.json';
                a.click();
                URL.revokeObjectURL(url);
                setMsg('✓ Backup completato: '+allUsers.length+' utenti');
                setTimeout(function(){setMsg('');},3000);
              }catch(e){
                console.error('Errore backup:',e);
                setMsg('❌ Errore backup: '+e.message);
                setTimeout(function(){setMsg('');},4000);
              }
              setBackupLoading(false);
            }} style={{padding:'10px 20px',borderRadius:8,border:'1px solid #3b82f640',background:'#3b82f615',color:'#3b82f6',fontSize:13,fontWeight:700,cursor:backupLoading?'wait':'pointer',fontFamily:'inherit',opacity:backupLoading?0.6:1}}>
              {backupLoading?'⏳ Backup in corso...':'📥 Backup dati'}
            </button>
            <div style={{fontSize:11,color:'#475569',marginTop:6}}>Scarica tutti gli utenti e i loro dati (appdata) in formato JSON.</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function AuthScreen({onProfileReady}){
  const T=gT();
  const [mode,setMode]=useState(function(){try{return new URLSearchParams(window.location.search).get('action')==='login'?'login':'register';}catch(e){return 'register';}});
  const [email,setEmail]=useState('');
  const [pw,setPw]=useState('');
  const [pw2,setPw2]=useState('');
  const [gdpr,setGdpr]=useState(false);
  const [err,setErr]=useState('');
  const [msg,setMsg]=useState('');
  const [loading,setLoading]=useState(false);
  const [showPw,setShowPw]=useState(false);
  const [showPw2,setShowPw2]=useState(false);

  const errMap=(code)=>{
    if(code==='auth/user-not-found'||code==='auth/wrong-password'||code==='auth/invalid-credential') return 'Email o password errati';
    if(code==='auth/email-already-in-use') return 'Email già registrata';
    if(code==='auth/weak-password') return 'Password troppo corta (minimo 6 caratteri)';
    if(code==='auth/invalid-email') return 'Email non valida';
    if(code==='auth/popup-closed-by-user') return '';
    if(code==='auth/popup-blocked') return 'Popup bloccato dal browser. Abilita i popup e riprova.';
    return 'Errore. Riprova.';
  };

  const buildDemoPatient=()=>{
    var today=fmtDate();
    return {id:'DEMO-001',nome:'Sara',cognome:'Demo',sesso:'F',ddn:'15/03/1990',annoNascita:1990,
      altezza:165,peso:62,vita:72,fianchi:95,pa:'120/80',fc:68,
      patologie:'',farmaci:'',attivita:'Poco attiva',obiettivo:'Perdere peso',
      stressPercepito:'Medio',sonno:'7',preferenze:'',sintomiSforzo:'NO',allergie:'',
      email:'',telefono:'',
      dataValutazione:today,createdAt:today,
      test:{mwtDist:'520',mwtRpe:'5',mwtSintomi:'NO',stsRip:'14',stsNote:'',noteVal:''},
      programma:{},nutrizione:{},progressi:[],schede:[],log:[]};
  };
  const seedDemoIfEmpty=async(uid)=>{
    try{
      const existingData=await fbLoad(uid);
      if(existingData&&existingData.patients&&existingData.patients.length>0)return false;
      const demoData={patients:[buildDemoPatient()],bookings:[],exercises:[]};
      save(demoData);
      await fbSave(uid,demoData);
      return true;
    }catch(e){console.warn('seedDemo',e);return false;}
  };

  const doLogin=async()=>{setErr('');setLoading(true);try{await fbAuth.signInWithEmailAndPassword(email,pw);if(typeof gtag!=='undefined')gtag('event','login',{method:'email'});}catch(e){setErr(errMap(e.code));}setLoading(false);};
  const doRegister=async()=>{setErr('');if(pw!==pw2){setErr('Le password non coincidono');return;}setLoading(true);try{const c=await fbAuth.createUserWithEmailAndPassword(email,pw);if(typeof gtag!=='undefined')gtag('event','sign_up',{method:'email'});const profile={email,displayName:'',nome:'',cognome:'',telefono:'',citta:'',plan:'trial',trialStart:Date.now(),createdAt:new Date().toISOString(),gdprConsent:true,gdprConsentDate:Date.now()};await fbSaveUserProfile(c.user.uid,profile);sendBrevoEmail(email,'',1);await c.user.sendEmailVerification();const seeded=await seedDemoIfEmpty(c.user.uid);if(seeded)showToast(T.demoToast,'success',5000);if(onProfileReady)onProfileReady(profile);}catch(e){setErr(errMap(e.code));}setLoading(false);};
  const doGoogle=async()=>{
    setErr('');setLoading(true);
    try{
      const provider=new firebase.auth.GoogleAuthProvider();
      const result=await fbAuth.signInWithPopup(provider);
      const user=result.user;
      const existing=await fbGetUserProfile(user.uid);
      if(!existing){
        const dn=user.displayName||'';
        const profile={email:user.email||'',displayName:dn,nome:dn.split(' ')[0]||'',cognome:dn.split(' ').slice(1).join(' ')||'',telefono:'',citta:'',plan:'trial',trialStart:Date.now(),createdAt:new Date().toISOString(),gdprConsent:true,gdprConsentDate:Date.now()};
        await fbSaveUserProfile(user.uid,profile);
        sendBrevoEmail(user.email||'',profile.nome,1);
        if(typeof gtag!=='undefined')gtag('event','sign_up',{method:'google'});
        const seeded=await seedDemoIfEmpty(user.uid);
        if(seeded)showToast(T.demoToast,'success',5000);
        if(onProfileReady)onProfileReady(profile);
      }else{
        if(typeof gtag!=='undefined')gtag('event','login',{method:'google'});
      }
    }catch(e){setErr(errMap(e.code));}
    setLoading(false);
  };
  const doReset=async()=>{setErr('');setLoading(true);try{await fbAuth.sendPasswordResetEmail(email);setMsg('Email di recupero inviata!');}catch(e){setErr(errMap(e.code));}setLoading(false);};

  const inp={width:'100%',padding:'11px 14px',borderRadius:9,border:'1px solid #334155',background:'#0f172a',color:'#e2e8f0',fontSize:14,fontFamily:'inherit',outline:'none',marginBottom:10};
  const btn={width:'100%',padding:'12px',borderRadius:9,border:'none',background:'#3b82f6',color:'#fff',fontSize:14,fontWeight:700,cursor:loading?'not-allowed':'pointer',fontFamily:'inherit',marginBottom:8,opacity:loading?0.6:1};
  const googleBtn={width:'100%',padding:'12px',borderRadius:10,border:'1px solid #d1d5db',background:'#ffffff',color:'#1f2937',fontSize:14,fontWeight:600,cursor:loading?'not-allowed':'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',justifyContent:'center',gap:10,opacity:loading?0.6:1};
  const googleSvg=(<svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>);

  return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'#07090f',padding:20}}>
      <div style={{width:'100%',maxWidth:400}}>
        <div style={{textAlign:'center',marginBottom:32}}>
          <div style={{fontSize:32,fontWeight:900,color:'#3b82f6',marginBottom:6}}>PT Board</div>
          <div style={{fontSize:13,color:'#64748b'}}>Gestione clienti per Personal Trainer</div>
        </div>
        <div style={{background:'#0f1623',border:'1px solid #1e2d47',borderRadius:14,padding:28}}>
          {mode!=='reset'&&(
            <div style={{display:'flex',gap:4,background:'#080d1a',borderRadius:9,padding:4,marginBottom:22}}>
              {[['register','Crea account'],['login','Accedi']].map(([m,l])=>(
                <button key={m} onClick={()=>{setMode(m);setErr('');setMsg('');}} style={{flex:1,padding:'8px',borderRadius:7,border:'none',background:mode===m?'#3b82f6':'transparent',color:mode===m?'#fff':'#64748b',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit',transition:'all .2s'}}>{l}</button>
              ))}
            </div>
          )}
          {mode==='reset'&&(
            <div style={{marginBottom:16}}>
              <button onClick={()=>{setMode('login');setErr('');setMsg('');}} style={{background:'none',border:'none',color:'#64748b',cursor:'pointer',fontSize:13,fontFamily:'inherit',padding:0}}>← Torna al login</button>
              <div style={{fontSize:18,fontWeight:800,color:'#f8fafc',marginTop:8}}>Recupera password</div>
            </div>
          )}
          {mode!=='reset'&&<>
            <button type="button" style={googleBtn} onClick={doGoogle} disabled={loading}>{googleSvg}<span>{T.authGoogleBtn}</span></button>
            <div style={{display:'flex',alignItems:'center',gap:10,margin:'14px 0'}}>
              <div style={{flex:1,height:1,background:'#1e2d47'}}/>
              <span style={{fontSize:11,color:'#64748b',textTransform:'uppercase',letterSpacing:1}}>{T.authOr}</span>
              <div style={{flex:1,height:1,background:'#1e2d47'}}/>
            </div>
          </>}
          <input style={inp} placeholder={T.authPhEmail} type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&(mode==='login'?doLogin():mode==='register'?doRegister():doReset())}/>
          {mode!=='reset'&&<div style={{position:'relative',marginBottom:10}}><input style={{...inp,marginBottom:0,paddingRight:38}} placeholder={T.authPhPassword} type={showPw?'text':'password'} value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&(mode==='login'?doLogin():doRegister())}/><button type="button" onClick={()=>setShowPw(v=>!v)} style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',background:'transparent',border:'none',cursor:'pointer',color:'#64748b',fontSize:18,padding:4}}>{showPw?'🙈':'👁'}</button></div>}
          {mode==='register'&&<div style={{position:'relative',marginBottom:10}}><input style={{...inp,marginBottom:0,paddingRight:38}} placeholder={T.authPhConfirm} type={showPw2?'text':'password'} value={pw2} onChange={e=>setPw2(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doRegister()}/><button type="button" onClick={()=>setShowPw2(v=>!v)} style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',background:'transparent',border:'none',cursor:'pointer',color:'#64748b',fontSize:18,padding:4}}>{showPw2?'🙈':'👁'}</button></div>}
          {mode==='register'&&<label style={{display:'flex',alignItems:'center',gap:8,fontSize:11,color:'#64748b',marginBottom:12,cursor:'pointer',lineHeight:1.4}}>
            <input type="checkbox" checked={gdpr} onChange={e=>setGdpr(e.target.checked)} style={{flexShrink:0,accentColor:'#3b82f6'}}/>
            <span>Accetto <a href="/privacy.html" target="_blank" rel="noreferrer" style={{color:'#3b82f6',textDecoration:'none'}}>Privacy</a> e <a href="/terms.html" target="_blank" rel="noreferrer" style={{color:'#3b82f6',textDecoration:'none'}}>Termini</a></span>
          </label>}
          {err&&<div style={{background:'#ef444415',border:'1px solid #ef444430',borderRadius:8,padding:'9px 13px',fontSize:12,color:'#ef4444',marginBottom:10}}>{err}</div>}
          {msg&&<div style={{background:'#10b98115',border:'1px solid #10b98130',borderRadius:8,padding:'9px 13px',fontSize:12,color:'#10b981',marginBottom:10}}>{msg}</div>}
          {mode==='login'&&<button style={btn} onClick={doLogin} disabled={loading}>{loading?'Accesso...':'Accedi'}</button>}
          {mode==='register'&&<button style={{...btn,opacity:(loading||!gdpr)?0.5:1,cursor:(loading||!gdpr)?'not-allowed':'pointer'}} onClick={doRegister} disabled={loading||!gdpr}>{loading?'Registrazione...':'Crea account'}</button>}
          {mode==='reset'&&<button style={btn} onClick={doReset} disabled={loading}>{loading?'Invio...':'Invia email di recupero'}</button>}
          {mode==='login'&&<button onClick={()=>{setMode('reset');setErr('');setMsg('');}} style={{width:'100%',background:'none',border:'none',color:'#64748b',cursor:'pointer',fontSize:12,fontFamily:'inherit',textAlign:'center',padding:'4px 0'}}>Password dimenticata?</button>}
        </div>
        <div style={{textAlign:'center',marginTop:20,fontSize:11,color:'#334155'}}>Dati salvati in modo sicuro su Google Firebase 🔒</div>
      </div>
    </div>
  );
}

          ${['Apri in Chrome','Banner installa app','oppure Menu → Aggiungi'].map(t=>'<div style="font-size:10px;color:#64748b;margin-bottom:3px">• '+t+'</div>').join('')}
        </div>
      </div>
    </div>
  </div>`},

  {label:'✅ Pronto!',time:'Fine',bc:'#10b98130',bct:'#2dd4bf',badge:'Completato',title:'Sei pronto per usare PT Board! 🎉',desc:'Hai visto tutto quello che ti serve. Inizia subito con il tuo primo cliente.',
  html:`<div style="text-align:center;padding:8px 0 16px">
    <div style="font-size:56px;margin-bottom:16px">🚀</div>
    <div style="font-size:16px;font-weight:800;color:#f8fafc;margin-bottom:6px">Da dove iniziare?</div>
    <div style="font-size:13px;color:#64748b;margin-bottom:20px">Segui questi 3 passi e sei operativo in 5 minuti</div>
    <div style="display:flex;flex-direction:column;gap:8px;max-width:380px;margin:0 auto 20px">
      ${[['1','🎯','Clicca 🎯 Valutazione nel menu','Scegli Base, Completa o Anagrafica'],['2','📋','Apri la scheda cliente','Esplora le 5 tab e prenota sedute'],['3','📅','Prova il calendario','Prenota appuntamenti e invia promemoria']].map(([n,ic,t,d])=>`
      <div style="display:flex;gap:12px;align-items:center;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:14px;text-align:left">
        <div style="width:32px;height:32px;border-radius:50%;background:#3b82f6;color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">${n}</div>
        <div><div style="font-size:13px;font-weight:700;color:#fff">${ic} ${t}</div><div style="font-size:11px;color:#64748b;margin-top:2px">${d}</div></div>
      </div>`).join('')}
    </div>
    <div style="background:#3b82f615;border:1px solid #3b82f640;border-radius:10px;padding:12px;font-size:12px;color:#93c5fd">
      💡 Puoi riaprire questo tutorial dal menu → Parametri → 📖 Tutorial
    </div>
    <div style="background:#3b82f615;border:1px solid #3b82f640;border-radius:10px;padding:12px;text-align:center;margin-top:10px">
      <a href="/PTBoard_Guida_Rapida_PT.pdf" target="_blank" style="font-size:13px;color:#60a5fa;font-weight:700;text-decoration:none">📄 Scarica la Guida Rapida PDF</a>
    </div>
  </div>`},
];

function TutorialModal({onClose,isLight}){
  const [cur,setCur]=useState(0);
  const total=TSTEPS.length;
  const s=TSTEPS[cur];
  const OL={position:'fixed',inset:0,background:'rgba(0,0,0,0.88)',zIndex:300,display:'flex',alignItems:'stretch',justifyContent:'center'};
  const BOX={background:C.card,width:'min(900px,100vw)',maxHeight:'100vh',display:'flex',flexDirection:'column'};
  return(
    <div style={OL}>
      <div style={BOX}>
        {/* Header */}
        <div style={{padding:'14px 20px',borderBottom:'1px solid '+C.border,display:'flex',alignItems:'center',gap:12,flexShrink:0}}>
          <div style={{width:34,height:34,borderRadius:9,background:C.blue+'20',border:'1px solid '+C.blue+'30',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}}>📖</div>
          <div style={{flex:1}}>
            <div style={{fontSize:14,fontWeight:800,color:C.strong}}>Tutorial PT Board</div>
            <div style={{fontSize:11,color:C.muted,marginTop:1}}>Passo {cur+1} di {total} · {s.label}</div>
          </div>
          <button onClick={onClose} style={{background:'transparent',border:'none',cursor:'pointer',color:C.muted,fontSize:20,padding:'4px 8px',borderRadius:6,lineHeight:1}}>✕</button>
        </div>
        {/* Progress */}
        <div style={{height:3,background:C.border,flexShrink:0}}>
          <div style={{height:'100%',width:((cur+1)/total*100)+'%',background:'linear-gradient(90deg,'+C.blue+','+C.green+')',transition:'width .4s ease'}}/>
        </div>
        {/* Step pills */}
        <div style={{display:'flex',padding:'10px 20px',gap:3,flexShrink:0,overflowX:'auto',borderBottom:'1px solid '+C.border}}>
          {TSTEPS.map((x,i)=>(
            <div key={i} style={{display:'flex',alignItems:'center',gap:3,flexShrink:0}}>
              <div onClick={()=>setCur(i)} style={{width:22,height:22,borderRadius:'50%',background:i<cur?C.green:i===cur?C.blue:C.border2,color:i<=cur?'#fff':C.muted,fontSize:9,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',transition:'all .2s',flexShrink:0}}>{i<cur?'✓':i+1}</div>
              {i<total-1&&<div style={{width:14,height:1,background:i<cur?C.green:C.border2,flexShrink:0}}/>}
            </div>
          ))}
        </div>
        {/* Body */}
        <div style={{flex:1,overflowY:'auto',padding:'20px'}}>
          <div style={{display:'inline-flex',alignItems:'center',padding:'3px 12px',borderRadius:100,fontSize:10,fontWeight:700,letterSpacing:.8,textTransform:'uppercase',background:s.bc,color:s.bct,marginBottom:14}}>{s.badge}</div>
          <div style={{fontSize:20,fontWeight:800,color:C.strong,letterSpacing:-0.5,marginBottom:8}}>{s.title}</div>
          <div style={{fontSize:13,color:C.muted,lineHeight:1.7,marginBottom:20,fontWeight:300}}>{s.desc}</div>
          <div dangerouslySetInnerHTML={{__html:s.html}}/>
        </div>
        {/* Footer */}
        <div style={{padding:'12px 20px',borderTop:'1px solid '+C.border,display:'flex',justifyContent:'space-between',flexShrink:0,gap:8}}>
          <button onClick={onClose} style={{padding:'8px 18px',borderRadius:8,border:'1px solid '+C.border2,background:'transparent',color:C.muted,fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>Chiudi</button>
          <div style={{display:'flex',gap:8}}>
            {cur>0&&<button onClick={()=>setCur(c=>c-1)} style={{padding:'8px 18px',borderRadius:8,border:'1px solid '+C.border2,background:'transparent',color:C.muted,fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>{gT().wPrev}</button>}
            {cur<total-1
              ?<button onClick={()=>setCur(c=>c+1)} style={{padding:'8px 18px',borderRadius:8,border:'none',background:C.blue,color:'#fff',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>{gT().wNext}</button>
              :<button onClick={onClose} style={{padding:'8px 18px',borderRadius:8,border:'none',background:C.green,color:'#fff',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>✓ Inizia ad usare PT Board</button>
            }
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
})();
</script>
